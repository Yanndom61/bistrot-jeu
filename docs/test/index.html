#salle .lieu-txt { font-size: 24px; font-weight: 700; fill: #57656b; }

#volet.large { width: min(640px, 94vw); }
.alerte-equipe { background: #fbe6e3; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
.ok-equipe { background: #e7f4ea; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
.personne { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eadfcd; padding: 5px 0; }
.personne > div { flex: 1; min-width: 0; }

.petit-btn.principal { background: #b8322a; border-color: #b8322a; color: #fff; }

.fiche { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; margin: 4px 0 8px; }
.fiche span:nth-child(odd) { color: #6d5546; }
.questions { display: flex; flex-wrap: wrap; gap: 6px; }
.questions .petit-btn { flex: 1 1 45%; text-align: left; font-weight: 600; }
.reponse { background: #f3eadb; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }

.offre { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }

.mot { font-style: italic; background: #fff3d6; border-radius: 8px; padding: 6px 10px; }

#volet-corps h3 { font-size: 15px; margin: 10px 0 6px; }
.journal { list-style: none; margin: 0; padding: 0; }
.journal li { padding: 6px 0; border-bottom: 1px solid #eadfcd; }
.journal .h { display: block; font-size: 12px; }
.ligne-reglage { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bascule { min-width: 72px; height: 44px; border-radius: 22px; border: 2px solid #8a6a50; background: #fff; font-weight: 700; color: #6d5546; }
.bascule.on { background: #2f8f55; border-color: #2f8f55; color: #fff; }
.version { color: #8a6a50; font-size: 12px; margin-top: 14px; }

/* Boutons communs */
.gros { display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 8px 14px; border: 2px solid #8a6a50; border-radius: 12px; background: #fff; color: #3a2a22; font-size: 16px; font-weight: 700; }

.fin-detail { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; margin: 8px 0; font-size: 13px; }

/* outils.js — petites fonctions communes : hasard reproductible, textes, heures, euros. */
B.VERSION_JEU = '0.4.0';

/* Hasard reproductible : la graine est rangée dans la partie, donc une partie rechargée continue pareil. */
B.hasard = function (S) {
  let a = (S.graine | 0) + 0x6D2B79F5 | 0;
  S.graine = a;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
B.entre = function (S, a, b) { return a + (b - a) * B.hasard(S); };
B.entier = function (S, a, b) { return Math.floor(a + (b - a + 1) * B.hasard(S)); };
B.duree = function (S, v) { return Array.isArray(v) ? B.entre(S, v[0], v[1]) : v; };

/* Textes : tous viennent de donnees/textes.json. */
B.t = function (cle, vars) {
  const s = B.DATA.textes[cle];
  if (s == null) { B.textesManquants[cle] = true; return cle; }
  return String(s).replace(/\{(\w+)\}/g, function (m, k) {
    return vars && vars[k] != null ? vars[k] : m;
  });
};
B.textesManquants = {};

B.heure = function (minute) {
  const m = Math.floor(minute) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
};
B.euros = function (n) {
  const r = Math.round(n);
  const s = String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');
  return (r < 0 ? '-' : '') + s + '\u00A0€';
};

/* Prix au centime : « 19,50 € ». */
B.prix = function (n) {
  const r = Math.round(n * 100) / 100, e = Math.floor(Math.abs(r)), c = Math.round((Math.abs(r) - e) * 100);
  return (r < 0 ? '-' : '') + String(e).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F') + ',' + String(c).padStart(2, '0') + '\u00A0€';
};

/* « Bienvenue chez YaYa », « Bienvenue au Petit Zinc », « Bienvenue à la Brasserie »… */
B.chezNom = function (nom) {
  const n = String(nom || '').trim();
  if (/^chez\s+/i.test(n)) return 'chez ' + n.replace(/^chez\s+/i, '');
  if (/^le\s+/i.test(n)) return 'au ' + n.replace(/^le\s+/i, '');
  if (/^les\s+/i.test(n)) return 'aux ' + n.replace(/^les\s+/i, '');
  if (/^la\s+/i.test(n)) return 'à la ' + n.replace(/^la\s+/i, '');
  if (/^l['’]\s*/i.test(n)) return 'à l’' + n.replace(/^l['’]\s*/i, '');
  return 'chez ' + n;
};

B.lieu = function (id) {
  const L = B.DATA.lieux.lieux;
  return L.find(function (l) { return l.id === id; }) || L[0];
};

/* Messages : rangés dans le journal de la partie, et transmis à l'écran (B.flux). */
B.flux = [];
/* Note dans le journal seulement (sans bulle à l'écran), pour les événements fréquents comme les paiements. */
B.noter = function (S, cle, vars) {
  S.journal.push({ jour: S.jour, minute: Math.floor(S.minute), texte: B.t(cle, vars) });
  if (S.journal.length > 300) S.journal.splice(0, S.journal.length - 300);
};
B.message = function (S, cle, vars) {
  const m = { jour: S.jour, minute: Math.floor(S.minute), texte: B.t(cle, vars) };
  S.journal.push(m);
  if (S.journal.length > 300) S.journal.splice(0, S.journal.length - 300);
  B.flux.push(m);
};

/* ==== src/moteur/salle.js ==== */
/* salle.js — le plan de la salle : tables, places, rallonges, chemins. */
B.salle = {};

B.salle.plan = function () { return B.DATA.salle; };
B.salle.geo = function (id) {
  return B.DATA.salle.tables.find(function (t) { return t.id === id; });
};
B.salle.taille = function (places) { return places <= 2 ? 60 : 84; };

/* Places autour d'une table : sur les côtés pour 2, dessus/dessous pour 4. */
B.salle.places = function (id) {
  const g = B.salle.geo(id), d = B.salle.taille(g.places) / 2 + 16;
  if (g.places <= 2) return [{ x: g.x - d, y: g.y }, { x: g.x + d, y: g.y }];
  return [
    { x: g.x - 21, y: g.y - d }, { x: g.x + 21, y: g.y - d },
    { x: g.x - 21, y: g.y + d }, { x: g.x + 21, y: g.y + d }
  ];
};

/* Centre d'un groupe de tables (une table seule, ou deux tables rapprochées). */
B.salle.centre = function (ids) {
  let x = 0, y = 0;
  ids.forEach(function (id) { const g = B.salle.geo(id); x += g.x; y += g.y; });
  return { x: x / ids.length, y: y / ids.length };
};
B.salle.nomTables = function (ids) { return ids.slice().sort(function (a, b) { return a - b; }).join('-'); };

/* Chemin simple : on rejoint l'allée centrale, on la longe, puis on va au but. */
B.salle.chemin = function (de, vers) {
  const A = B.DATA.salle.allee, pts = [];
  if (Math.abs(de.y - A) > 1) pts.push({ x: de.x, y: A });
  pts.push({ x: vers.x, y: A });
  if (Math.abs(vers.y - A) > 1) pts.push({ x: vers.x, y: vers.y });
  return pts;
};

/* Fait avancer une personne le long de son chemin. Renvoie vrai quand elle est arrivée. */
B.salle.bouger = function (p, dist) {
  while (dist > 0 && p.chemin.length) {
    const c = p.chemin[0], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy);
    if (d <= dist) { p.x = c.x; p.y = c.y; p.chemin.shift(); dist -= d; }
    else { p.x += dx / d * dist; p.y += dy / d * dist; dist = 0; }
  }
  return p.chemin.length === 0;
};

/* Cherche une table libre : la plus petite qui suffit, sinon deux tables rapprochées. */
B.salle.chercher = function (S, taille) {
  const libre = function (id) {
    const t = S.tables.find(function (x) { return x.id === id; });
    return t && !t.groupe && !t.sale;
  };
  const seules = S.tables.filter(function (t) { return libre(t.id) && t.places >= taille; })
    .sort(function (a, b) { return a.places - b.places || a.id - b.id; });
  if (seules.length) return [seules[0].id];
  for (const r of B.DATA.salle.rallonges) {
    const total = r.reduce(function (s, id) { return s + B.salle.geo(id).places; }, 0);
    if (total >= taille && r.every(libre)) return r.slice();
  }
  return null;
};
B.salle.tableDe = function (S, id) { return S.tables.find(function (t) { return t.id === id; }); };

/* ==== src/moteur/clients.js ==== */
/* clients.js — arrivée des groupes, file à la porte, repas, départ. */
B.clients = {};

B.clients.type = function (id) {
  return B.DATA.clients.types.find(function (t) { return t.id === id; });
};

/* Nombre moyen de groupes qui arrivent par heure à cette minute de la journée. */
B.clients.affluence = function (S, minute) {
  const tr = B.DATA.clients.affluence.find(function (a) { return minute >= a.de && minute < a.a; });
  if (!tr) return 0;
  return tr.groupesParHeure * B.lieu(S.lieu).affluence * (S.carte ? B.carte.facteurAffluence(S) : 1);
};

B.clients.tirerType = function (S) {
  const T = B.DATA.clients.types;
  let tot = 0; T.forEach(function (t) { tot += t.poids; });
  let r = B.hasard(S) * tot;
  for (const t of T) { r -= t.poids; if (r < 0) return t; }
  return T[T.length - 1];
};

B.clients.arrivee = function (S) {
  const type = B.clients.tirerType(S);
  const taille = B.entier(S, type.taille[0], type.taille[1]);
  const noms = B.lieu(S.lieu).nomsClients;
  const e = B.DATA.salle.entree;
  const g = {
    id: S.prochainId++, type: type.id, taille: taille,
    nom: noms[B.entier(S, 0, noms.length - 1)],
    etat: 'file', depuis: S.minute, arrivee: S.minute,
    patience: B.duree(S, B.DATA.clients.durees.patienceFile),
    tables: null, x: e.x, y: e.y, chemin: [], duree: 0, serveur: null, cuisinier: null, pret: null, aMange: false
  };
  S.groupes.push(g);
  S.stats.jour.groupes++;
  S.stats.jour.arrives += taille;
  if (taille >= 5) B.message(S, 'msg_grand_groupe', { taille: taille, groupe: B.t('groupe_' + type.id, { nom: g.nom }) });
};

/* Place les groupes qui attendent à la porte, dans l'ordre d'arrivée, dès qu'une table convient. */
B.clients.placer = function (S) {
  let enFile = 0;
  for (const g of S.groupes) {
    if (g.etat !== 'file') continue;
    const ids = S.placement === 'manuel' ? null : B.salle.chercher(S, g.taille);
    if (ids) {
      B.clients.installer(S, g, ids);
    } else if (S.minute - g.depuis > g.patience) {
      g.etat = 'repart';
      g.chemin = [{ x: B.DATA.salle.dehors.x, y: B.DATA.salle.dehors.y }];
      S.stats.jour.repartis += g.taille;
      B.message(S, 'msg_repart', { taille: g.taille });
    } else enFile++;
  }
  S.stats.jour.fileMax = Math.max(S.stats.jour.fileMax, enFile);
};

B.clients.installer = function (S, g, ids) {
  ids.forEach(function (id) { B.salle.tableDe(S, id).groupe = g.id; });
  g.tables = ids;
  g.etat = 'marche';
  g.depuis = S.minute;
  g.chemin = B.salle.chemin(g, B.salle.centre(ids));
  if (ids.length > 1) B.message(S, 'msg_installe_rallonge', { num: B.salle.nomTables(ids), taille: g.taille });
};

/* Placement par le joueur : un groupe de la file sur une table touchée. Renvoie { ok } ou { erreur, vars }. */
B.clients.placerManuel = function (S, groupeId, tableId) {
  const g = S.groupes.find(function (x) { return x.id === groupeId && x.etat === 'file'; });
  const t = B.salle.tableDe(S, tableId);
  if (!g || !t) return { erreur: 'placement_occupee', vars: { num: tableId } };
  const libre = function (id) { const x = B.salle.tableDe(S, id); return x && !x.groupe && !x.sale; };
  if (!libre(tableId)) return { erreur: 'placement_occupee', vars: { num: tableId } };
  if (t.places >= g.taille) { B.clients.installer(S, g, [tableId]); return { ok: true }; }
  const r = B.DATA.salle.rallonges.find(function (r) { return r.indexOf(tableId) >= 0; });
  if (r) {
    const total = r.reduce(function (s, id) { return s + B.salle.tableDe(S, id).places; }, 0);
    if (total >= g.taille && r.every(libre)) { B.clients.installer(S, g, r.slice()); return { ok: true }; }
    if (total >= g.taille) { const autre = r.find(function (id) { return id !== tableId; }); return { erreur: 'placement_occupee', vars: { num: autre } }; }
  }
  if (g.taille >= 5) return { erreur: 'placement_rallonge', vars: { taille: g.taille } };
  return { erreur: 'placement_trop_petite', vars: { num: tableId, places: t.places, taille: g.taille } };
};

/* Le groupe quitte sa table : la table devient à débarrasser. */
B.clients.partir = function (S, g) {
  (g.tables || []).forEach(function (id) {
    const t = B.salle.tableDe(S, id);
    t.groupe = null; t.sale = true;
  });
  const c = B.salle.centre(g.tables);
  g.x = c.x; g.y = c.y;
  g.etat = 'depart';
  g.chemin = B.salle.chemin(g, B.DATA.salle.entree).concat([{ x: B.DATA.salle.dehors.x, y: B.DATA.salle.dehors.y }]);
  if (g.aMange) S.stats.jour.servis += g.taille;
};

B.clients.avancer = function (S, h) {
  const D = B.DATA.clients.durees, v = B.DATA.clients.vitesses.clients * h;
  for (const g of S.groupes) {
    const ecoule = S.minute - g.depuis;
    if (g.etat === 'marche') {
      if (B.salle.bouger(g, v)) { g.etat = 'carte'; g.depuis = S.minute; g.duree = B.duree(S, D.lireCarte); }
    } else if (g.etat === 'carte') {
      if (ecoule >= g.duree) { g.etat = 'commande'; g.depuis = S.minute; }
    } else if (g.etat === 'cuisine') {
      if (g.cuisinier && g.pret != null && S.minute >= g.pret) { B.carte.finirCuisson(S, g); g.etat = 'pret'; g.depuis = S.minute; g.cuisinier = null; }
    } else if (g.etat === 'mange') {
      if (ecoule >= g.duree) { g.etat = 'addition'; g.depuis = S.minute; }
    } else if (g.etat === 'depart' || g.etat === 'repart') {
      if (B.salle.bouger(g, v)) g.parti = true;
    }
  }
  S.groupes = S.groupes.filter(function (g) { return !g.parti; });
};

/* ==== src/moteur/equipe.js ==== */
/* equipe.js — l'équipe : le patron, les employés, les candidats, les entretiens et l'embauche.
   Version simple : plannings, formations et contrats viendront à l'étape « Équipe ». */
B.equipe = {};

B.equipe.D = function () { return B.DATA.equipe; };
B.equipe.poste = function (id) { return B.DATA.equipe.postes[id]; };
B.equipe.nomPoste = function (p) {
  const P = B.equipe.poste(p.poste);
  if (!P) return p.poste;
  return p.genre === 'f' ? P.nomF : P.nom;
};

/* Texte au choix dans une liste de textes.json, avec accords selon le genre. */
B.tChoix = function (cle, n, vars, genre) {
  let s = B.DATA.textes[cle];
  if (s == null) { B.textesManquants[cle] = true; return ''; }
  if (Array.isArray(s)) s = s[Math.abs(n | 0) % s.length];
  const f = genre === 'f';
  const accords = { e: f ? 'e' : '', ere: f ? 'ère' : 'er', le: f ? 'la' : 'le', nerveux: f ? 'nerveuse' : 'nerveux', il: f ? 'elle' : 'il', Il: f ? 'Elle' : 'Il' };
  return String(s).replace(/\{(\w+)\}/g, function (m, k) {
    if (vars && vars[k] != null) return vars[k];
    if (accords[k] != null) return accords[k];
    return m;
  });
};

/* ---------- Salaires : grille officielle HCR × coefficient du lieu ---------- */
B.equipe.echelon = function (exp) {
  for (const e of B.DATA.equipe.echelonSelonExperience) if (exp <= e.jusqua) return e.echelon;
  return 3;
};
B.equipe.minimum = function (S, poste, exp) {
  const P = B.equipe.poste(poste), G = B.DATA.equipe.grilleHCR;
  let h = G[P.niveauHCR][B.equipe.echelon(exp) - 1];
  if (P.partDuMinimum) h = G.I[0] * P.partDuMinimum;
  return Math.round(h * Math.max(1, B.lieu(S.lieu).salaires) * 100) / 100;
};
B.equipe.parMois = function (horaire) { return horaire * B.DATA.equipe.heuresParMois39h; };
B.equipe.euroHeure = function (n) { return n.toFixed(2).replace('.', ',') + '\u00A0€'; };

/* ---------- Composition ---------- */
B.equipe.salle = function (S) { return S.equipe.filter(function (p) { return p.service === 'salle'; }); };
B.equipe.cuisine = function (S) { return S.equipe.filter(function (p) { return p.service === 'cuisine'; }); };
/* Ceux qui restent (sans compter les personnes renvoyées qui finissent leur tâche). */
B.equipe.actifs = function (S, service) { return S.equipe.filter(function (p) { return p.service === service && !p.partant; }); };
B.equipe.patron = function (S) { return S.equipe.find(function (p) { return p.patron; }); };
B.equipe.peutOuvrir = function (S) { return B.equipe.actifs(S, 'salle').length > 0 && B.equipe.actifs(S, 'cuisine').length > 0; };
B.equipe.coutMensuel = function (S) {
  return S.equipe.reduce(function (s, p) { return s + (p.patron || p.partant || p.interim ? 0 : B.equipe.parMois(p.salaire)); }, 0);
};

/* Place de repos d'une personne de salle (près de la passe) ou de cuisine (près des fourneaux). */
B.equipe.base = function (S, p) {
  const P = B.DATA.salle;
  if (p.service === 'salle') {
    const i = B.equipe.salle(S).indexOf(p);
    return { x: P.passe.x - 12 - Math.floor(i / 2) * 36, y: i % 2 ? P.allee + 20 : P.allee - 20 };
  }
  const k = P.cuisine, j = Math.max(0, B.equipe.cuisine(S).indexOf(p));
  return { x: k.x + 36 + (j % 2) * 60, y: k.y + 178 + Math.floor(j / 2) * 58 };
};

B.equipe.nouveauMembre = function (S, o) {
  const p = {
    id: S.prochainId++, nom: o.nom, genre: o.genre || 'm', poste: o.poste, patron: !!o.patron,
    service: o.service || (B.equipe.poste(o.poste) ? B.equipe.poste(o.poste).service : 'salle'),
    note: o.note, vitesse: o.vitesse, amabilite: o.amabilite, qualite: o.qualite,
    salaire: o.salaire || 0, experience: o.experience || 0, perso: o.perso || null,
    x: 0, y: 0, chemin: [], tache: null
  };
  S.equipe.push(p);
  const b = B.equipe.base(S, p); p.x = b.x; p.y = b.y;
  return p;
};

B.equipe.creerPatron = function (S) {
  const d = B.DATA.equipe.patron;
  return B.equipe.nouveauMembre(S, { nom: d.nom, poste: 'patron', patron: true, service: 'salle', note: 5, vitesse: d.vitesse, qualite: d.qualite, amabilite: d.amabilite });
};

/* Le patron change de poste (salle ↔ cuisine), sauf s'il laisserait un poste vide. */
B.equipe.patronPeutChanger = function (S) {
  const p = B.equipe.patron(S);
  if (!p) return false;
  return B.equipe.actifs(S, p.service).length > 1;
};
B.equipe.changerPatron = function (S) {
  const p = B.equipe.patron(S);
  if (!B.equipe.patronPeutChanger(S)) return false;
  B.equipe.liberer(S, p);
  p.service = p.service === 'salle' ? 'cuisine' : 'salle';
  B.equipe.replacer(S);
  return true;
};

/* ---------- Effectif : les 16 places fixées dans Chez YaYa (le patron et les intérimaires en plus) ---------- */
B.equipe.place = function (poste) {
  return B.DATA.equipe.effectif.places.find(function (pl) { return pl.postes.indexOf(poste) >= 0; }) || null;
};
B.equipe.placeRecrutable = function (pl) { return pl.postes.some(function (k) { return B.equipe.poste(k).recrutable; }); };
B.equipe.titulaires = function (S) { return S.equipe.filter(function (p) { return !p.patron && !p.interim && !p.partant; }); };
B.equipe.occupes = function (S, pl) { return B.equipe.titulaires(S).filter(function (p) { return pl.postes.indexOf(p.poste) >= 0; }).length; };
B.equipe.placeLibre = function (S, poste) { const pl = B.equipe.place(poste); return !pl || B.equipe.occupes(S, pl) < pl.nombre; };
B.equipe.effectif = function (S) {
  const E = B.DATA.equipe.effectif, r = { n: 0, total: E.total, groupes: {} };
  Object.keys(E.groupes).forEach(function (g) { r.groupes[g] = 0; });
  E.places.forEach(function (pl) { const n = B.equipe.occupes(S, pl); r.groupes[pl.groupe] += n; r.n += n; });
  return r;
};

/* ---------- Intérim : un remplaçant pour la journée, sur une place vide ---------- */
B.equipe.placesVides = function (S, service) {
  return B.DATA.equipe.effectif.places.reduce(function (s, pl) {
    if (pl.groupe !== service || !B.equipe.placeRecrutable(pl)) return s;
    return s + Math.max(0, pl.nombre - B.equipe.occupes(S, pl));
  }, 0);
};
B.equipe.interimaires = function (S, service) { return S.equipe.filter(function (p) { return p.interim && !p.partant && (!service || p.service === service); }); };
B.equipe.salaireInterim = function (S, service) {
  return Math.round(B.equipe.minimum(S, B.DATA.equipe.interim.postes[service], B.DATA.equipe.interim.experience) * (1 + B.DATA.equipe.interim.majoration) * 100) / 100;
};
/* Renvoie null si on peut appeler un intérimaire pour ce service, sinon la clé du texte qui explique pourquoi. */
B.equipe.interimPossible = function (S, service) {
  if (!S.dejaOuvert) return 'interim_jour1';
  if (B.equipe.placesVides(S, service) <= B.equipe.interimaires(S, service).length) return 'interim_complet_' + service;
  return null;
};
B.equipe.appelerInterim = function (S, service, auto) {
  if (B.equipe.interimPossible(S, service)) return null;
  const I = B.DATA.equipe.interim, D = B.DATA.equipe, poste = I.postes[service];
  const pr = D.prenoms[B.entier(S, 0, D.prenoms.length - 1)];
  const noms = D.noms.concat(B.lieu(S.lieu).nomsClients);
  const p = B.equipe.nouveauMembre(S, {
    nom: pr[0] + ' ' + noms[B.entier(S, 0, noms.length - 1)], genre: pr[1], poste: poste, service: service,
    note: I.note, vitesse: I.vitesse, qualite: I.qualite, amabilite: I.amabilite, experience: I.experience,
    salaire: B.equipe.salaireInterim(S, service)
  });
  p.interim = true; p.jourInterim = S.jour;
  B.equipe.replacer(S);
  if (auto) B.message(S, 'msg_interim_auto', { nom: p.nom });
  else B.message(S, 'msg_interim', { nom: p.nom, poste: B.equipe.nomPoste(p), salaire: B.equipe.euroHeure(p.salaire) });
  return p;
};
/* Le matin : les intérimaires de la veille repartent ; si l'option est active et qu'il manque quelqu'un pour ouvrir,
   un intérimaire est appelé automatiquement (dernier recours). */
B.equipe.matin = function (S) {
  const avant = S.equipe.length;
  S.equipe = S.equipe.filter(function (p) { return !p.partant && !p.interim; });
  if (S.equipe.length < avant) B.equipe.replacer(S);
  if (S.interimAuto && S.dejaOuvert) {
    ['salle', 'cuisine'].forEach(function (sv) {
      if (!B.equipe.actifs(S, sv).length) B.equipe.appelerInterim(S, sv, true);
    });
  }
};

/* ---------- Renvoyer un employé ---------- */
B.equipe.enService = function (S) { return !!S.ouvert && !S.finJour; };
/* Renvoie null si c'est possible, sinon la clé du texte qui explique pourquoi. */
B.equipe.peutRenvoyer = function (S, p) {
  if (!p || p.patron) return 'renvoi_patron';
  if (p.partant) return 'renvoi_deja';
  if (B.equipe.enService(S) && (p.service === 'salle' || p.service === 'cuisine') &&
      B.equipe.actifs(S, p.service).length <= 1) return p.service === 'salle' ? 'renvoi_salle_vide' : 'renvoi_cuisine_vide';
  return null;
};
/* Hors service, il part tout de suite. En plein service, il finit sa tâche en cours puis part. */
B.equipe.renvoyer = function (S, p) {
  if (B.equipe.peutRenvoyer(S, p)) return false;
  p.partant = true;
  B.message(S, 'msg_renvoi', { nom: p.nom, e: p.genre === 'f' ? 'e' : '' });
  if (!B.equipe.enService(S) || !B.equipe.occupe(S, p)) B.equipe.retirer(S, p, false);
  return true;
};
B.equipe.occupe = function (S, p) {
  if (p.service === 'salle') return !!p.tache;
  if (p.service === 'cuisine') return S.groupes.some(function (g) { return g.etat === 'cuisine' && g.cuisinier === p.id; });
  return false;
};
B.equipe.retirer = function (S, p, apresTache) {
  B.equipe.liberer(S, p);
  S.equipe = S.equipe.filter(function (x) { return x.id !== p.id; });
  B.equipe.replacer(S);
  if (apresTache) B.message(S, 'msg_renvoi_parti', { nom: p.nom });
};
/* Appelé à chaque pas : les personnes renvoyées qui ont fini leur tâche s'en vont. */
B.equipe.departs = function (S) {
  S.equipe.filter(function (p) { return p.partant && !B.equipe.occupe(S, p); })
    .forEach(function (p) { B.equipe.retirer(S, p, true); });
};

/* Quand quelqu'un quitte son poste : ce qu'il faisait est repris par les autres. */
B.equipe.liberer = function (S, p) {
  if (p.tache) {
    if (p.tache.groupe) { const g = S.groupes.find(function (x) { return x.id === p.tache.groupe; }); if (g) g.serveur = null; }
    if (p.tache.table) { const t = B.salle.tableDe(S, p.tache.table); if (t) t.serveur = null; }
  }
  p.tache = null; p.chemin = [];
  S.groupes.forEach(function (g) { if (g.cuisinier === p.id && g.etat === 'cuisine') { g.cuisinier = null; g.pret = null; } });
};
B.equipe.replacer = function (S) {
  S.equipe.forEach(function (p) {
    if (p.service !== 'salle') { const b = B.equipe.base(S, p); p.x = b.x; p.y = b.y; p.chemin = []; p.tache = null; }
    else if (p.x > B.DATA.salle.cuisine.x - 20) { p.x = B.DATA.salle.passe.x; p.y = B.DATA.salle.allee; p.chemin = []; }
  });
};

/* ---------- Candidats ---------- */
B.equipe.candidat = function (S, poste) {
  const D = B.DATA.equipe, P = D.postes[poste];
  const pr = D.prenoms[B.entier(S, 0, D.prenoms.length - 1)];
  const noms = D.noms.concat(B.lieu(S.lieu).nomsClients);
  const note = B.entier(S, P.niveauJeu[0], P.niveauJeu[1]);
  const age = B.entier(S, 19, 55);
  const exp = Math.max(0, Math.min(age - 18, Math.round((note - 2) * 1.6 + B.entre(S, -2, 3))));
  const varie = function () { return Math.max(1, Math.min(10, note + B.entier(S, -2, 2))); };
  const perso = D.personnalites[B.entier(S, 0, D.personnalites.length - 1)];
  const min = B.equipe.minimum(S, poste, exp);
  const demande = Math.round(min * (1 + Math.max(0, (note - 4) * 0.03) + perso.exigence + B.entre(S, 0, 0.06)) * 10) / 10;
  return {
    id: S.prochainId++, nom: pr[0] + ' ' + noms[B.entier(S, 0, noms.length - 1)], genre: pr[1], poste: poste,
    age: age, experience: exp, note: note, vitesse: varie(), amabilite: varie(), qualite: varie(),
    perso: perso.id, minimum: min, demande: Math.max(min, demande), offre: min,
    reponses: [], revele: {}, refus: 0, dernierMot: null, graineTexte: B.entier(S, 0, 9999)
  };
};

B.equipe.genererDepart = function (S) {
  S.candidats = B.DATA.equipe.candidatsDepart.map(function (p) { return B.equipe.candidat(S, p); });
};

B.equipe.nouveauxCandidats = function (S) {
  const N = B.DATA.equipe.nouveauxCandidatsParJour;
  let n = Math.min(B.entier(S, N.min, N.max), Math.max(0, N.plafond - S.candidats.length));
  const postes = Object.keys(B.DATA.equipe.postes).filter(function (k) { return B.DATA.equipe.postes[k].recrutable && B.equipe.placeLibre(S, k); });
  if (!postes.length) n = 0;
  for (let i = 0; i < n; i++) S.candidats.push(B.equipe.candidat(S, postes[B.entier(S, 0, postes.length - 1)]));
  if (n > 0) B.message(S, 'msg_nouveaux_candidats', { n: n });
};

B.equipe.perso = function (id) { return B.DATA.equipe.personnalites.find(function (p) { return p.id === id; }) || B.DATA.equipe.personnalites[0]; };
B.equipe.adj = function (c) { const p = B.equipe.perso(c.perso); return c.genre === 'f' ? p.adjF : p.adj; };
B.equipe.texteExperience = function (c) {
  if (c.experience === 0) return B.t(c.genre === 'f' ? 'equipe_experience_0F' : 'equipe_experience_0');
  if (c.experience === 1) return B.t('equipe_experience_1');
  return B.t('equipe_experience_n', { n: c.experience });
};

/* ---------- Entretien ---------- */
B.equipe.questions = function (c) {
  const service = B.equipe.poste(c.poste).service;
  return ['parcours', 'rush', service === 'cuisine' ? 'qualite_cuisine' : 'qualite_salle', 'salaire'];
};
B.equipe.niveau3 = function (v) { return v <= 3 ? 0 : v <= 6 ? 1 : 2; };

B.equipe.repondre = function (S, c, q) {
  if (c.reponses.some(function (r) { return r.q === q; })) return null;
  const service = B.equipe.poste(c.poste).service, g = c.genre, n = c.graineTexte + c.reponses.length * 7;
  let corps;
  if (q === 'parcours') corps = B.tChoix('r_parcours_' + service + '_' + (c.experience === 0 ? 0 : c.experience < 5 ? 1 : 2), n, { exp: c.experience }, g);
  else if (q === 'rush') { corps = B.tChoix('r_rush_' + B.equipe.niveau3(c.vitesse), n, null, g); c.revele.vitesse = true; }
  else if (q === 'qualite_salle') { corps = B.tChoix('r_qualite_salle_' + B.equipe.niveau3(c.amabilite), n, null, g); c.revele.amabilite = true; }
  else if (q === 'qualite_cuisine') { corps = B.tChoix('r_qualite_cuisine_' + B.equipe.niveau3(c.qualite), n, null, g); c.revele.qualite = true; }
  else if (q === 'salaire') { corps = B.tChoix('r_salaire', n, { salaire: B.equipe.euroHeure(c.demande) }, g); c.revele.salaire = true; c.offre = Math.max(c.offre, c.demande); }
  else return null;
  const intro = B.tChoix('intro_' + c.perso, n + 1, null, g);
  if (intro && !/[.!?…]\s*$/.test(intro)) corps = corps.charAt(0).toLowerCase() + corps.slice(1);
  const fin = B.DATA.textes['fin_' + c.perso] ? B.tChoix('fin_' + c.perso, n + 2, null, g) : '';
  const texte = '« ' + intro + corps + fin + ' »';
  c.reponses.push({ q: q, texte: texte });
  return texte;
};

/* Le joueur propose un salaire horaire. Réponse : accepte, contre-proposition ou refus. */
B.equipe.proposer = function (S, c, offre) {
  if (!B.equipe.placeLibre(S, c.poste)) { c.dernierMot = B.t('entretien_complet'); return { r: 'complet' }; }
  offre = Math.max(c.minimum, Math.round(offre * 100) / 100);
  c.offre = offre;
  const perso = B.equipe.perso(c.perso);
  if (offre >= c.demande * (1 - perso.souplesse) - 0.001) {
    const p = B.equipe.nouveauMembre(S, { nom: c.nom, genre: c.genre, poste: c.poste, note: c.note, vitesse: c.vitesse, amabilite: c.amabilite, qualite: c.qualite, salaire: offre, experience: c.experience, perso: c.perso });
    S.candidats = S.candidats.filter(function (x) { return x.id !== c.id; });
    B.message(S, 'msg_embauche', { nom: c.nom, poste: B.equipe.nomPoste(p), salaire: B.equipe.euroHeure(offre) });
    c.dernierMot = B.t('entretien_accepte');
    return { r: 'accepte', membre: p };
  }
  if (offre >= c.demande * 0.92) {
    c.dernierMot = B.t('entretien_contre', { salaire: B.equipe.euroHeure(c.demande) });
    c.revele.salaire = true;
    return { r: 'contre' };
  }
  c.refus++;
  if (c.refus >= B.DATA.equipe.refusAvantDepart) {
    S.candidats = S.candidats.filter(function (x) { return x.id !== c.id; });
    B.message(S, 'msg_candidat_parti', { nom: c.nom });
    c.dernierMot = B.t('entretien_part');
    return { r: 'part' };
  }
  c.dernierMot = B.t('entretien_refus');
  return { r: 'refus' };
};

/* Facteur de vitesse d'une personne : 1 pour une vitesse de 5, plus rapide au-dessus. */
B.equipe.facteurSalle = function (p) { return 0.8 + 0.04 * (p.vitesse || 5); };
B.equipe.facteurCuisine = function (p) { return 1.25 - 0.05 * (p.vitesse || 5); };

/* ==== src/moteur/carte.js ==== */
/* carte.js — la carte des plats, les prix, les commandes des clients, les cuissons et le paiement.
   Catalogue repris de l'ancien jeu (donnees/catalogue.json) ; règles dans donnees/carte.json. */
B.carte = {};
B.carte.CATS = ['entree', 'plat', 'dessert'];
B.carte.R = function () { return B.DATA.carte; };

/* ---------- Catalogue du lieu : ses spécialités + les classiques du bistrot ---------- */
B.carte._cache = {};
B.carte.catalogue = function (S) {
  if (B.carte._cache[S.lieu]) return B.carte._cache[S.lieu];
  const C = B.DATA.catalogue, classiques = {}, out = [], vus = {};
  C.classiques.forEach(function (d) { classiques[d.id] = d; });
  (C.specialites[S.lieu] || []).forEach(function (s) {
    const d = s.classique ? classiques[s.classique] : s;
    if (!d || vus[d.id]) return;
    vus[d.id] = true;
    out.push(Object.assign({}, d, { local: true }));
  });
  C.classiques.forEach(function (d) { if (!vus[d.id]) { vus[d.id] = true; out.push(Object.assign({}, d, { local: false })); } });
  out.forEach(function (d, i) { d.ordre = i; });
  B.carte._cache[S.lieu] = out;
  return out;
};
B.carte.plat = function (S, id) {
  const cat = B.carte.catalogue(S);
  if (!cat._index) { cat._index = {}; cat.forEach(function (d) { cat._index[d.id] = d; }); }
  return cat._index[id] || null;
};
B.carte.coefPrix = function (S) { return B.lieu(S.lieu).prix || 1; };
B.carte.prixConseille = function (S, d) {
  const a = B.DATA.carte.prix.arrondiConseille;
  return Math.max(B.DATA.carte.prix.minimum, Math.round(d.prixRef * B.carte.coefPrix(S) / a) * a);
};
/* Coût matière ESTIMÉ (provisoire jusqu'aux stocks) : recette × prix de l'ancien jeu × coefficient du lieu. */
B.carte.cout = function (S, d) {
  const I = B.DATA.catalogue.ingredients;
  let c = 0;
  for (const k in d.recette) c += (I[k] ? I[k].prix : 0.5) * d.recette[k];
  return Math.round(c * B.carte.coefPrix(S) * 100) / 100;
};
B.carte.marge = function (S, id) {
  const d = B.carte.plat(S, id), prix = S.carte.plats[id].prix, cout = B.carte.cout(S, d);
  return { prix: prix, cout: cout, marge: Math.round((prix - cout) * 100) / 100, pct: prix > 0 ? Math.round((prix - cout) / prix * 100) : 0, pctCout: prix > 0 ? Math.round(cout / prix * 100) : 0 };
};
B.carte.origineViande = function (S, d) {
  const I = B.DATA.catalogue.ingredients;
  if (!Object.keys(d.recette).some(function (k) { return I[k] && I[k].viande; })) return null;
  const o = B.DATA.catalogue.originesViande[S.lieu];
  return o ? o[1] : 'France';
};

/* ---------- La carte du restaurant ---------- */
B.carte.creer = function (S) {
  const cat = B.carte.catalogue(S), L = B.DATA.carte.limites.max, plats = {};
  const depart = B.DATA.catalogue.carteDepartClassiques[S.lieu] || {};
  const n = { entree: 0, plat: 0, dessert: 0 };
  cat.forEach(function (d) { plats[d.id] = { on: false, prix: B.carte.prixConseille(S, d) }; });
  const allumer = function (d) { if (!plats[d.id].on && n[d.cat] < L[d.cat]) { plats[d.id].on = true; n[d.cat]++; } };
  B.carte.CATS.forEach(function (c) { (depart[c] || []).forEach(function (id) { const d = B.carte.plat(S, id); if (d) allumer(d); }); });
  cat.forEach(function (d) { if (d.local) allumer(d); });
  S.carte = { plats: plats };
  B.carte.completer(S);
};
/* Garantit le minimum par catégorie (et le maximum), sans rien inventer. */
B.carte.completer = function (S) {
  const cat = B.carte.catalogue(S), Lmin = B.DATA.carte.limites.min, Lmax = B.DATA.carte.limites.max;
  cat.forEach(function (d) { if (!S.carte.plats[d.id]) S.carte.plats[d.id] = { on: false, prix: B.carte.prixConseille(S, d) }; });
  B.carte.CATS.forEach(function (c) {
    let on = B.carte.surCarte(S, c);
    for (const d of cat) { if (on.length >= Lmin[c]) break; if (d.cat === c && !S.carte.plats[d.id].on) { S.carte.plats[d.id].on = true; on = B.carte.surCarte(S, c); } }
    while (on.length > Lmax[c]) { S.carte.plats[on[on.length - 1]].on = false; on = B.carte.surCarte(S, c); }
  });
};
B.carte.surCarte = function (S, cat) {
  return B.carte.catalogue(S).filter(function (d) { return (!cat || d.cat === cat) && S.carte.plats[d.id] && S.carte.plats[d.id].on; }).map(function (d) { return d.id; });
};
/* Ajoute ou retire un plat. Renvoie null, ou la clé du texte qui explique pourquoi c'est impossible. */
B.carte.basculer = function (S, id) {
  const d = B.carte.plat(S, id), p = S.carte.plats[id], L = B.DATA.carte.limites;
  if (!d || !p) return 'carte_inconnu';
  const n = B.carte.surCarte(S, d.cat).length;
  if (p.on && n <= L.min[d.cat]) return 'carte_min_' + d.cat;
  if (!p.on && n >= L.max[d.cat]) return 'carte_max_' + d.cat;
  p.on = !p.on;
  return null;
};
B.carte.changerPrix = function (S, id, sens) {
  const d = B.carte.plat(S, id), p = S.carte.plats[id], P = B.DATA.carte.prix;
  if (!d || !p) return;
  const max = Math.max(P.minimum, B.carte.prixConseille(S, d) * P.maxFoisConseille);
  p.prix = Math.round(Math.min(max, Math.max(P.minimum, p.prix + sens * P.pas)) * 100) / 100;
};
B.carte.indicePrix = function (S) {
  const ids = B.carte.surCarte(S);
  if (!ids.length) return 1;
  return ids.reduce(function (s, id) { return s + S.carte.plats[id].prix / B.carte.prixConseille(S, B.carte.plat(S, id)); }, 0) / ids.length;
};
B.carte.facteurAffluence = function (S) {
  const A = B.DATA.carte.affluencePrix;
  return Math.max(A.bornes[0], Math.min(A.bornes[1], Math.pow(B.carte.indicePrix(S), -A.elasticite)));
};

/* ---------- Commande : chacun choisit selon les prix et ses goûts ---------- */
B.carte.tirer = function (S, poids) {
  let tot = 0; poids.forEach(function (p) { tot += p.w; });
  if (tot <= 0) return null;
  let r = B.hasard(S) * tot;
  for (const p of poids) { r -= p.w; if (r < 0) return p.v; }
  return poids[poids.length - 1].v;
};
B.carte.choisirPlat = function (S, g, cat) {
  const R = B.DATA.carte.commande;
  const poids = B.carte.surCarte(S, cat).map(function (id) {
    const d = B.carte.plat(S, id), rapport = B.carte.prixConseille(S, d) / S.carte.plats[id].prix;
    let w = d.popularite * Math.pow(rapport, R.elasticiteChoix);
    if (d.local && g.type === 'touristes') w *= R.bonusSpecialiteTouristes;
    return { v: id, w: w };
  });
  return B.carte.tirer(S, poids);
};
B.carte.probaCategorie = function (S, cat) {
  const R = B.DATA.carte.commande, ids = B.carte.surCarte(S, cat);
  if (!ids.length) return 0;
  const idx = ids.reduce(function (s, id) { return s + S.carte.plats[id].prix / B.carte.prixConseille(S, B.carte.plat(S, id)); }, 0) / ids.length;
  const f = Math.max(R.bornesEntreeDessert[0], Math.min(R.bornesEntreeDessert[1], Math.pow(idx, -R.elasticiteEntreeDessert)));
  return Math.min(0.95, (cat === 'entree' ? R.probaEntree : R.probaDessert) * f);
};
B.carte.zone = function (S) {
  const Z = B.DATA.carte.cuissons.zoneDuLieu;
  if (Z[S.lieu]) return Z[S.lieu];
  return B.lieu(S.lieu).groupe === 'outre-mer' ? 'dom' : 'fr';
};
B.carte.cuissonDemandee = function (S, type) {
  const C = B.DATA.carte.cuissons, opts = C.options[type], z = B.carte.zone(S);
  const w = type === 'boeuf' ? C.poidsBoeuf[z] || C.poidsBoeuf.fr : type === 'veau' ? C.poidsVeau : type === 'agneau' ? C.poidsAgneau : type === 'canard' ? C.poidsCanard : C.poidsBlanc[z] || C.poidsBlanc.fr;
  return B.carte.tirer(S, opts.map(function (o, i) { return { v: o, w: w[i] || 0 }; }));
};
B.carte.ligne = function (S, id) {
  const d = B.carte.plat(S, id);
  const l = { id: id, nom: d.nom, cat: d.cat, prix: S.carte.plats[id].prix, cout: B.carte.cout(S, d) };
  if (d.cuisson) { l.viande = d.cuisson; l.cuisson = B.carte.cuissonDemandee(S, d.cuisson); }
  return l;
};
B.carte.commander = function (S, g) {
  const lignes = [];
  for (let i = 0; i < g.taille; i++) {
    if (B.hasard(S) < B.carte.probaCategorie(S, 'entree')) { const e = B.carte.choisirPlat(S, g, 'entree'); if (e) lignes.push(B.carte.ligne(S, e)); }
    const p = B.carte.choisirPlat(S, g, 'plat'); if (p) lignes.push(B.carte.ligne(S, p));
    if (B.hasard(S) < B.carte.probaCategorie(S, 'dessert')) { const d = B.carte.choisirPlat(S, g, 'dessert'); if (d) lignes.push(B.carte.ligne(S, d)); }
  }
  const ordre = { entree: 0, plat: 1, dessert: 2 };
  lignes.sort(function (a, b) { return ordre[a.cat] - ordre[b.cat]; });
  g.commande = lignes;
  lignes.forEach(function (l) { S.stats.jour.coutMatiere += l.cout; S.stats.jour.platsVendus[l.id] = (S.stats.jour.platsVendus[l.id] || 0) + 1; });
};

/* ---------- Cuissons : réussies ou ratées selon la qualité du cuisinier ---------- */
B.carte.finirCuisson = function (S, g) {
  const E = B.DATA.carte.cuissons.erreur, C = B.DATA.carte.cuissons;
  const cuisinier = S.equipe.find(function (p) { return p.id === g.cuisinier; });
  const q = cuisinier ? (cuisinier.qualite || 5) : 5;
  const proba = Math.max(E.min, Math.min(E.max, E.base - E.parPointDeQualite * q));
  (g.commande || []).forEach(function (l) {
    if (!l.cuisson) return;
    if (l.renvoye || g.refait) { l.servie = l.cuisson; return; }   /* le plat refait est juste */
    if (B.hasard(S) >= proba) { l.servie = l.cuisson; return; }
    const o = C.options[l.viande], k = o.indexOf(l.cuisson);
    let j = B.hasard(S) < E.versTropCuit ? k + 1 : k - 1;
    if (j < 0 || j >= o.length) j = j < 0 ? k + 1 : k - 1;
    l.servie = o[Math.max(0, Math.min(o.length - 1, j))];
    l.cuisinier = cuisinier ? cuisinier.nom : null;
  });
};
/* Au service : un plat dont la cuisson est ratée est renvoyé en cuisine et refait. Renvoie true si renvoi. */
B.carte.verifierService = function (S, g) {
  const rate = (g.commande || []).filter(function (l) { return l.cuisson && l.servie && l.servie !== l.cuisson && !l.renvoye; });
  if (!rate.length) return false;
  const N = B.DATA.carte.cuissons.noms;
  rate.forEach(function (l) {
    l.renvoye = true; S.stats.jour.platsRenvoyes++; S.stats.jour.coutMatiere += l.cout;
    B.message(S, 'msg_plat_renvoye', { table: g.tables[0], plat: l.nom, demande: N[l.cuisson].toLowerCase(), servie: N[l.servie].toLowerCase() });
  });
  g.refait = true; g.etat = 'cuisine'; g.cuisinier = null; g.pret = null;
  return true;
};

/* ---------- Paiement à la fin du repas ---------- */
B.carte.etoiles = function (S, g) {
  const R = B.DATA.carte.satisfaction;
  let s = R.base;
  if (g.attenteCommande != null && g.attenteCommande > B.DATA.clients.alertes.attenteRouge) s += R.attenteLongue;
  if ((g.commande || []).some(function (l) { return l.renvoye; })) s += R.platRenvoye;
  const lignes = g.commande || [];
  if (lignes.length) {
    const idx = lignes.reduce(function (a, l) { const d = B.carte.plat(S, l.id); return a + (d ? l.prix / B.carte.prixConseille(S, d) : 1); }, 0) / lignes.length;
    s += R.prixParPoint * (idx - 1);
  }
  return Math.max(1, Math.min(5, Math.round(s * 10) / 10));
};
B.carte.pourboire = function (S, g, total, etoiles) {
  const P = B.DATA.carte.pourboires, T = B.DATA.catalogue.pourboires[S.lieu];
  const tm = { famille: 0.9, touristes: 1.15, affaires: 0.9 }[g.type] || 1;
  const monnaie = function () { return P.monnaies[B.entier(S, 0, P.monnaies.length - 1)]; };
  let t;
  if (!(total > 0)) return 0;
  if (!T) {
    const F = P.france;
    const p = Math.max(F.min, Math.min(F.max, (F.base + F.parEtoile * (etoiles - 3)) * tm));
    if (B.hasard(S) > p) return 0;
    t = total * (F.pctBase + F.pctParEtoile * Math.max(0, Math.min(1.5, etoiles - 3.5)) + B.hasard(S) * F.pctHasard);
    if (etoiles < 4.3 && B.hasard(S) < F.monnaie) t = monnaie();
  } else {
    if (!T[0]) return 0;
    const p = Math.max(0.01, Math.min(T[0] >= 2.5 ? 0.95 : 0.85, (0.10 + 0.22 * (etoiles - 3)) * tm * T[0]));
    if (B.hasard(S) > p) return 0;
    if (T[3] && B.hasard(S) < 0.7) t = monnaie();
    else t = total * (T[1] + (T[2] - T[1]) * (0.6 * Math.max(0, Math.min(1, (etoiles - 3) / 2)) + 0.4 * B.hasard(S)));
  }
  t = Math.max(0.5, t);
  t = t < 5 ? Math.round(t * 2) / 2 : Math.round(t);
  return Math.min(400, t);
};
B.carte.payer = function (S, g) {
  if (g.paye) return;
  if (!g.commande) B.carte.commander(S, g);
  const total = Math.round(g.commande.reduce(function (s, l) { return s + l.prix; }, 0) * 100) / 100;
  const etoiles = B.carte.etoiles(S, g);
  const tip = B.carte.pourboire(S, g, total, etoiles);
  g.paye = true; g.total = total; g.pourboire = tip; g.etoiles = etoiles;
  S.argent = Math.round((S.argent + total) * 100) / 100;
  S.cagnotte = Math.round(((S.cagnotte || 0) + tip) * 100) / 100;
  const st = S.stats.jour;
  st.recettes = Math.round((st.recettes + total) * 100) / 100;
  st.pourboires = Math.round((st.pourboires + tip) * 100) / 100;
  st.couverts += g.taille; st.tickets++;
  S.tickets = (S.tickets || []);
  S.tickets.unshift({ jour: S.jour, minute: Math.floor(S.minute), table: (g.tables || [])[0], taille: g.taille, nom: g.nom, type: g.type, lignes: g.commande, total: total, pourboire: tip });
  if (S.tickets.length > 30) S.tickets.length = 30;
  B.noter(S, tip > 0 ? 'msg_paiement_pourboire' : 'msg_paiement', { table: (g.tables || [])[0], total: B.euros(total), pourboire: B.euros(tip), n: g.taille });
};

B.carte.meilleurPlat = function (S) {
  const v = S.stats.jour.platsVendus || {};
  let best = null;
  for (const id in v) if (!best || v[id] > v[best]) best = id;
  const d = best && B.carte.plat(S, best);
  return d ? { nom: d.nom, n: v[best] } : null;
};

/* ==== src/moteur/cuisine.js ==== */
/* cuisine.js — la cuisine prépare les commandes. Chaque personne en cuisine prépare 2 commandes à la fois.
   S'il n'y a personne de libre, les commandes attendent leur tour (premier arrivé, premier servi). */
B.cuisine = {};

B.cuisine.avancer = function (S) {
  const cuisiniers = B.equipe.actifs(S, 'cuisine');
  if (!cuisiniers.length) return;
  const cap = B.DATA.equipe.commandesParCuisinier;
  const enCours = {};
  S.groupes.forEach(function (g) { if (g.etat === 'cuisine' && g.cuisinier) enCours[g.cuisinier] = (enCours[g.cuisinier] || 0) + 1; });
  const attente = S.groupes.filter(function (g) { return g.etat === 'cuisine' && !g.cuisinier; })
    .sort(function (a, b) { return a.depuis - b.depuis || a.id - b.id; });
  for (const g of attente) {
    let choix = null;
    for (const c of cuisiniers) {
      const n = enCours[c.id] || 0;
      if (n < cap && (!choix || n < (enCours[choix.id] || 0) || (n === (enCours[choix.id] || 0) && c.vitesse > choix.vitesse))) choix = c;
    }
    if (!choix) break;
    enCours[choix.id] = (enCours[choix.id] || 0) + 1;
    g.cuisinier = choix.id;
    g.pret = S.minute + B.duree(S, B.DATA.clients.durees.cuisine) * B.equipe.facteurCuisine(choix) * (g.refait ? B.DATA.carte.cuissons.refaireFacteur : 1);
  }
};

/* ==== src/moteur/service.js ==== */
/* service.js — les serveurs : prendre les commandes, servir, encaisser, débarrasser. */
B.service = {};

/* Ordre de priorité : plat prêt (il refroidit), addition, commande, puis table à débarrasser. */
B.service.choisir = function (S, w) {
  let best = null;
  const prop = function (prio, depuis, tache) {
    if (!best || prio < best.prio || (prio === best.prio && depuis < best.depuis)) best = { prio: prio, depuis: depuis, tache: tache };
  };
  for (const g of S.groupes) {
    if (g.serveur) continue;
    if (g.etat === 'pret') prop(0, g.depuis, { type: 'servir', groupe: g.id });
    else if (g.etat === 'addition') prop(1, g.depuis, { type: 'addition', groupe: g.id });
    else if (g.etat === 'commande') prop(2, g.depuis, { type: 'commande', groupe: g.id });
  }
  for (const t of S.tables) {
    if (t.sale && !t.serveur) prop(3, 9999, { type: 'debarrasser', table: t.id });
  }
  return best ? best.tache : null;
};

B.service.groupe = function (S, id) { return S.groupes.find(function (g) { return g.id === id; }); };

/* Prépare les étapes d'une tâche : aller quelque part, puis agir un certain temps. */
B.service.preparer = function (S, w, tache) {
  const D = B.DATA.clients.durees, A = B.DATA.salle.allee;
  const auBord = function (ids) { return { x: B.salle.centre(ids).x, y: A }; };
  tache.etapes = [];
  if (tache.type === 'debarrasser') {
    const t = B.salle.tableDe(S, tache.table);
    t.serveur = w.id;
    tache.etapes.push({ aller: auBord([t.id]) }, { agir: D.debarrasserParTable });
  } else {
    const g = B.service.groupe(S, tache.groupe);
    g.serveur = w.id;
    if (tache.type === 'servir') tache.etapes.push({ aller: { x: B.DATA.salle.passe.x, y: A } }, { agir: D.prendrePlatPasse }, { aller: auBord(g.tables), porte: 'assiette' }, { agir: D.poserPlat, porte: 'assiette' });
    if (tache.type === 'commande') tache.etapes.push({ aller: auBord(g.tables) }, { agir: D.prendreCommande });
    if (tache.type === 'addition') tache.etapes.push({ aller: auBord(g.tables), porte: 'addition' }, { agir: D.addition, porte: 'addition' });
  }
  w.tache = tache;
  w.chemin = [];
};

B.service.terminer = function (S, w) {
  const tache = w.tache, D = B.DATA.clients.durees;
  w.tache = null;
  if (tache.type === 'debarrasser') {
    const t = B.salle.tableDe(S, tache.table);
    t.sale = false; t.serveur = null;
    return;
  }
  const g = B.service.groupe(S, tache.groupe);
  if (!g) return;
  g.serveur = null;
  if (tache.type === 'commande') {
    S.stats.jour.attenteCommande += S.minute - g.depuis;
    S.stats.jour.nbCommandes++;
    g.attenteCommande = S.minute - g.depuis;
    if (!g.commande) B.carte.commander(S, g);
    g.etat = 'cuisine'; g.depuis = S.minute; g.pret = null; g.cuisinier = null;
  } else if (tache.type === 'servir') {
    if (B.carte.verifierService(S, g)) return;
    const type = B.clients.type(g.type);
    g.etat = 'mange'; g.depuis = S.minute; g.duree = B.duree(S, type.repas); g.aMange = true;
  } else if (tache.type === 'addition') {
    B.carte.payer(S, g);
    B.clients.partir(S, g);
  }
};

B.service.avancer = function (S, h) {
  B.equipe.salle(S).forEach(function (w) {
    const f = B.equipe.facteurSalle(w), v = B.DATA.clients.vitesses.serveurs * f;
    let reste = h;
    let garde = 0;
    while (reste > 1e-9 && garde++ < 20) {
      if (!w.tache) {
        if (w.partant) return;
        const t = B.service.choisir(S, w);
        if (t) B.service.preparer(S, w, t);
        else {
          const base = B.equipe.base(S, w);
          if (!w.chemin.length && (Math.abs(w.x - base.x) > 1 || Math.abs(w.y - base.y) > 1)) w.chemin = B.salle.chemin(w, base);
          B.salle.bouger(w, v * reste);
          return;
        }
      }
      const e = w.tache.etapes[0];
      if (!e) { B.service.terminer(S, w); continue; }
      if (e.aller) {
        if (!w.chemin.length) w.chemin = B.salle.chemin(w, e.aller);
        const besoin = B.service.longueur(w) / v;
        if (besoin <= reste) { reste -= besoin; w.x = e.aller.x; w.y = e.aller.y; w.chemin = []; w.tache.etapes.shift(); }
        else { B.salle.bouger(w, v * reste); reste = 0; }
      } else if (e.agir != null) {
        if (e.agir / f <= reste) { reste -= e.agir / f; w.tache.etapes.shift(); }
        else { e.agir -= reste * f; reste = 0; }
      }
    }
  });
};

B.service.longueur = function (w) {
  let x = w.x, y = w.y, L = 0;
  for (const p of w.chemin) { L += Math.hypot(p.x - x, p.y - y); x = p.x; y = p.y; }
  return L;
};

/* ==== src/moteur/partie.js ==== */
/* partie.js — créer une partie, faire passer le temps, finir la journée. */
B.statsVides = function () {
  return { groupes: 0, arrives: 0, servis: 0, repartis: 0, fileMax: 0, attenteCommande: 0, nbCommandes: 0,
    recettes: 0, pourboires: 0, couverts: 0, tickets: 0, coutMatiere: 0, platsRenvoyes: 0, platsVendus: {} };
};

B.nouvellePartie = function (o) {
  o = o || {};
  const R = B.DATA.regles, J = B.DATA.clients.journee, P = B.DATA.salle;
  const diff = R.difficultes.facile;
  return {
    format: 'bistrot',
    version: B.VERSION_SAUVEGARDE,
    jeu: B.VERSION_JEU,
    creeLe: o.date || null,
    nom: (o.nom || B.t('nouvelle_nom_defaut')).trim().slice(0, 40),
    lieu: B.lieu(o.lieu || 'paris').id,
    difficulte: 'facile',
    jour: 1,
    minute: J.ouverture,
    argent: diff.capitalDepart,
    note: diff.noteDepart,
    vitesse: 1,
    graine: (o.graine != null ? o.graine : Math.floor(Math.random() * 2147483647)) | 0,
    prochainId: 1,
    tables: P.tables.map(function (t) { return { id: t.id, places: t.places, groupe: null, sale: false, serveur: null }; }),
    groupes: [],
    equipe: [],
    candidats: [],
    ouvert: false,
    placement: 'auto',
    dejaOuvert: false,
    interimAuto: !!B.DATA.equipe.interim.autoParDefaut.facile,
    equipeReprise: 0,
    carte: null,
    cagnotte: 0,
    tickets: [],
    stats: { jour: B.statsVides(), totalServis: 0, joursJoues: 0 },
    journal: [],
    finJour: false,
    bilan: null,
    origine: null
  };
};

/* Nouvelle partie complète : le patron seul, et des candidats qui attendent leur entretien. */
B.creerPartie = function (o) {
  const S = B.nouvellePartie(o);
  B.equipe.creerPatron(S);
  B.equipe.genererDepart(S);
  B.carte.creer(S);
  return S;
};

B.ouvrir = function (S) {
  if (S.ouvert || !B.equipe.peutOuvrir(S)) return false;
  S.ouvert = true;
  S.dejaOuvert = true;
  B.message(S, 'msg_ouverture');
  return true;
};

/* Fait passer dt minutes de jeu, par petits pas d'un quart de minute. */
B.avancer = function (S, dt) {
  while (dt > 1e-9 && !S.finJour && S.ouvert) {
    const h = Math.min(0.25, dt);
    dt -= h;
    B.pas(S, h);
  }
};

B.pas = function (S, h) {
  const avant = S.minute;
  S.minute += h;
  B.DATA.clients.annonces.forEach(function (a) {
    if (avant < a.minute && S.minute >= a.minute) B.message(S, a.texte);
  });
  const parMinute = B.clients.affluence(S, S.minute) / 60;
  if (parMinute > 0 && B.hasard(S) < parMinute * h) B.clients.arrivee(S);
  B.clients.placer(S);
  B.clients.avancer(S, h);
  B.cuisine.avancer(S);
  B.service.avancer(S, h);
  B.equipe.departs(S);
  B.finDeJournee(S);
};

B.finDeJournee = function (S) {
  const J = B.DATA.clients.journee;
  if (S.minute >= J.finForcee && S.groupes.length) {
    S.groupes.forEach(function (g) {
      if (g.aMange && g.etat !== 'depart') { S.stats.jour.servis += g.taille; B.carte.payer(S, g); }
    });
    S.groupes = [];
    S.tables.forEach(function (t) { t.groupe = null; t.sale = false; t.serveur = null; });
    S.equipe.forEach(function (w) { w.tache = null; w.chemin = []; });
    B.message(S, 'msg_fin_forcee');
  }
  const salePasFaite = S.tables.some(function (t) { return t.sale; });
  if (S.minute >= J.fermeture && !S.groupes.length && (!salePasFaite || S.minute >= J.finForcee)) {
    S.finJour = true;
    const st = S.stats.jour;
    S.bilan = {
      jour: S.jour, servis: st.servis, repartis: st.repartis,
      attente: st.nbCommandes ? Math.round(st.attenteCommande / st.nbCommandes) : 0,
      recettes: st.recettes, couverts: st.couverts, tickets: st.tickets, pourboires: st.pourboires,
      ticketMoyen: st.tickets ? Math.round(st.recettes / st.tickets * 100) / 100 : 0,
      coutMatiere: Math.round(st.coutMatiere * 100) / 100, platsRenvoyes: st.platsRenvoyes,
      meilleurPlat: B.carte.meilleurPlat(S)
    };
    S.stats.totalServis += st.servis;
    S.stats.joursJoues++;
    B.message(S, 'msg_fin_service');
  }
};

B.jourSuivant = function (S) {
  const P = B.DATA.salle;
  S.jour++;
  S.minute = B.DATA.clients.journee.ouverture;
  S.stats.jour = B.statsVides();
  S.finJour = false;
  S.bilan = null;
  S.groupes = [];
  B.equipe.matin(S);
  S.tables.forEach(function (t) { t.groupe = null; t.sale = false; t.serveur = null; });
  S.equipe.forEach(function (w) { const b = B.equipe.base(S, w); w.x = b.x; w.y = b.y; w.chemin = []; w.tache = null; });
  B.equipe.nouveauxCandidats(S);
  S.ouvert = B.equipe.peutOuvrir(S);
  void P;
};

/* Contrôle de cohérence, utilisé par le simulateur et les tests. Renvoie la liste des problèmes. */
B.verifier = function (S) {
  const pb = [];
  (function scan(o, chemin) {
    if (typeof o === 'number') {
      if (!isFinite(o)) pb.push('valeur impossible à ' + chemin);
      return;
    }
    if (o && typeof o === 'object') for (const k in o) scan(o[k], chemin + '.' + k);
  })(S, 'partie');
  const st = S.stats.jour;
  if (!isFinite(S.argent)) pb.push('argent impossible');
  ['groupes', 'arrives', 'servis', 'repartis', 'fileMax', 'attenteCommande', 'nbCommandes', 'recettes', 'pourboires', 'couverts', 'coutMatiere', 'platsRenvoyes'].forEach(function (k) {
    if (st[k] < 0) pb.push('compteur négatif : ' + k);
  });
  if (st.servis + st.repartis > st.arrives) pb.push('plus de clients sortis que de clients entrés');
  S.tables.forEach(function (t) {
    if (t.groupe) {
      const g = S.groupes.find(function (x) { return x.id === t.groupe; });
      if (!g) pb.push('table ' + t.id + ' occupée par un groupe disparu');
      else if (!g.tables || g.tables.indexOf(t.id) < 0) pb.push('table ' + t.id + ' et groupe ' + g.id + ' ne se correspondent pas');
    }
    if (t.groupe && t.sale) pb.push('table ' + t.id + ' occupée et sale à la fois');
  });
  S.groupes.forEach(function (g) {
    const assis = ['marche', 'carte', 'commande', 'cuisine', 'pret', 'mange', 'addition'].indexOf(g.etat) >= 0;
    if (assis && !(g.tables && g.tables.length)) pb.push('groupe ' + g.id + ' sans table');
    if (assis) {
      const places = g.tables.reduce(function (s, id) { return s + B.salle.geo(id).places; }, 0);
      if (places < g.taille) pb.push('groupe ' + g.id + ' trop nombreux pour sa table');
    }
    if (['commande', 'pret', 'addition', 'cuisine'].indexOf(g.etat) >= 0 && S.minute - g.depuis > 120) pb.push('groupe ' + g.id + ' oublié depuis plus de 90 min (' + g.etat + ')');
  });
  S.equipe.forEach(function (w) {
    if (w.tache && w.tache.groupe && !S.groupes.find(function (g) { return g.id === w.tache.groupe; })) pb.push('serveur ' + w.nom + ' sert un groupe disparu');
    if (w.service === 'salle' && w.salaire < 0) pb.push('salaire négatif');
  });
  if (S.equipe.filter(function (p) { return p.patron; }).length !== 1) pb.push('il faut exactement un patron');
  S.groupes.forEach(function (g) {
    if (g.cuisinier && !S.equipe.find(function (p) { return p.id === g.cuisinier && p.service === 'cuisine'; })) pb.push('groupe ' + g.id + ' attend un cuisinier absent');
  });
  if (S.argent < 0 && S.difficulte === 'facile') pb.push('argent négatif');
  return pb;
};

/* ==== src/moteur/sauvegarde.js ==== */
/* sauvegarde.js — enregistrer et relire une partie. Chaque sauvegarde porte un numéro de version.
   Quand le format change, on ajoute une étape dans B.MIGRATIONS (de la version n à n+1) :
   ainsi chaque nouvelle version du jeu sait relire toutes les anciennes. */
B.VERSION_SAUVEGARDE = 4;

B.MIGRATIONS = {
  /* v1 → v2 (Bistrot 0.2) : l'équipe arrive. Le patron démarre seul (Léa n'est plus là), avec des candidats.
     La journée en cours repart au matin, car le service ne peut pas continuer sans cuisine. */
  1: function (S) {
    delete S.serveurs;
    S.equipe = []; S.candidats = []; S.placement = 'auto';
    S.groupes = [];
    S.tables.forEach(function (t) { t.groupe = null; t.sale = false; t.serveur = null; });
    S.minute = B.DATA.clients.journee.ouverture;
    S.stats.jour = B.statsVides();
    S.finJour = false; S.bilan = null;
    B.equipe.creerPatron(S);
    B.equipe.genererDepart(S);
    S.ouvert = false;
    B.message(S, 'msg_lea_partie');
    S.version = 2;
    return S;
  },
  /* v2 → v3 (Bistrot 0.3) : effectif de 16, intérim et renvoi. L'option d'intérim automatique prend la valeur
     par défaut de la difficulté. Les « Intérimaire » repris par erreur de l'ancien jeu (remplaçants d'un jour) partent. */
  2: function (S) {
    S.dejaOuvert = !!S.ouvert || S.jour > 1;
    S.interimAuto = !!B.DATA.equipe.interim.autoParDefaut[S.difficulte || 'facile'];
    const avant = S.equipe.length;
    S.equipe = S.equipe.filter(function (p) { return p.patron || p.nom !== 'Intérimaire'; });
    if (S.equipe.length < avant) {
      B.equipe.replacer(S);
      S.groupes.forEach(function (g) { if (g.cuisinier && !S.equipe.some(function (p) { return p.id === g.cuisinier; })) { g.cuisinier = null; g.pret = null; } if (g.serveur && !S.equipe.some(function (p) { return p.id === g.serveur; })) g.serveur = null; });
      S.tables.forEach(function (t) { if (t.serveur && !S.equipe.some(function (p) { return p.id === t.serveur; })) t.serveur = null; });
      S.ouvert = S.ouvert && B.equipe.peutOuvrir(S);
    }
    S.version = 3;
    return S;
  },
  /* v3 → v4 (Bistrot 0.4) : la carte, les prix et le paiement arrivent. Carte de départ du lieu ;
     les clients déjà attablés reçoivent leur commande (sans erreur de cuisson) et paieront à la fin. */
  3: function (S) {
    B.carte.creer(S);
    S.cagnotte = 0; S.tickets = [];
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    S.groupes.forEach(function (g) {
      if (['cuisine', 'pret', 'mange', 'addition'].indexOf(g.etat) >= 0 && !g.commande) {
        B.carte.commander(S, g);
        g.commande.forEach(function (l) { if (l.cuisson) l.servie = l.cuisson; });
      }
    });
    S.version = 4;
    return S;
  }
};

B.serialiser = function (S) { return JSON.stringify(S); };

/* Relit un texte de sauvegarde. Renvoie { partie } ou { erreur: 'cle_du_texte' }. Ne modifie jamais le texte d'origine. */
B.relire = function (texte) {
  let S;
  try { S = JSON.parse(texte); } catch (e) { return { erreur: 'erreur_sauvegarde_illisible' }; }
  if (!S || S.format !== 'bistrot' || typeof S.version !== 'number') return { erreur: 'erreur_sauvegarde_illisible' };
  if (S.version > B.VERSION_SAUVEGARDE) return { erreur: 'erreur_sauvegarde_recente' };
  while (S.version < B.VERSION_SAUVEGARDE) {
    const m = B.MIGRATIONS[S.version];
    if (!m) return { erreur: 'erreur_sauvegarde_illisible' };
    S = m(S);
  }
  S.jeu = B.VERSION_JEU;
  return { partie: S };
};

/* Noms des cases de rangement du téléphone. Le lien TEST et le lien OFFICIEL ont chacun les leurs. */
B.cles = function (canal) {
  const p = 'bistrotjeu.' + canal + '.';
  return { partie: p + 'partie', secours: p + 'partie-precedente', reglages: p + 'reglages', copieAncien: p + 'copie-ancien-jeu' };
};

/* ==== src/moteur/ancien.js ==== */
/* ancien.js — lecture des parties de l'ancien jeu « Chez YaYa » (v1 à v10.2).
   Règle d'or : on LIT seulement. Aucune écriture, aucune suppression sur les cases de l'ancien jeu. */
B.ancien = {};

/* Cases utilisées par l'ancien jeu : 5 emplacements + la sauvegarde principale. */
B.ancien.cles = ['bistrot_slot1', 'bistrot_slot2', 'bistrot_slot3', 'bistrot_slot4', 'bistrot_slot5', 'bistrot_save_v1'];
B.ancien.cleActive = 'bistrot_active_slot';

B.ancien.lire = function (texte) {
  try {
    const o = JSON.parse(texte);
    if (!o || typeof o !== 'object' || typeof o.t !== 'number' || typeof o.cash !== 'number') return null;
    return o;
  } catch (e) { return null; }
};

/* Résumé lisible d'une ancienne partie. */
B.ancien.resumer = function (o) {
  const lieu = B.lieu(o.v96loc || 'paris');
  return {
    nom: (o.rName || 'Chez YaYa').trim(),
    lieu: lieu.id,
    lieuNom: lieu.nom,
    jour: Math.floor(o.t / 1440) + 1,
    argent: Math.round(o.cash * 100) / 100,
    note: typeof o.rep === 'number' && isFinite(o.rep) ? Math.round(o.rep * 100) / 100 : 3,
    versionSauvegarde: o.v || 0
  };
};

/* Crée une partie Bistrot à partir d'une ancienne partie (copie, l'originale reste intacte). */
B.ancien.convertir = function (o, infos) {
  const r = B.ancien.resumer(o);
  const S = B.nouvellePartie({ nom: r.nom, lieu: r.lieu, graine: infos && infos.graine, date: infos && infos.date });
  B.equipe.creerPatron(S);
  const n = B.ancien.reprendreEquipe(S, o);
  const patron = B.equipe.patron(S);
  if (!B.equipe.salle(S).filter(function (p) { return !p.patron; }).length) patron.service = 'salle';
  else if (!B.equipe.cuisine(S).length) patron.service = 'cuisine';
  B.equipe.replacer(S);
  B.equipe.genererDepart(S);
  S.ouvert = B.equipe.peutOuvrir(S);
  S.dejaOuvert = S.ouvert;
  B.carte.creer(S);
  const carte = B.ancien.reprendreCarte(S, o);
  S.equipeReprise = n;
  S.jour = Math.max(1, r.jour);
  S.argent = r.argent;
  S.note = Math.max(0, Math.min(5, r.note));
  S.origine = {
    jeu: 'Chez YaYa', versionSauvegarde: r.versionSauvegarde,
    cle: infos && infos.cle || null, reprisLe: infos && infos.date || null,
    reprisPourLinstant: ['nom', 'lieu', 'jour', 'argent', 'note', 'equipe', 'carte'],
    carte: carte
  };
  return S;
};

/* Reprend les employés lisibles de l'ancien jeu. Salaire recalculé sur la grille HCR (poste + expérience).
   Bar, plonge et nettoyage sont gardés dans l'équipe, leur rôle viendra plus tard. Renvoie le nombre repris. */
B.ancien.reprendreEquipe = function (S, o) {
  const staff = Array.isArray(o.staff) ? o.staff : [];
  const fem = B.DATA.equipe.prenomsFemininsAncienJeu.concat(B.DATA.equipe.prenoms.filter(function (p) { return p[1] === 'f'; }).map(function (p) { return p[0]; }));
  const borne = function (v, d) { v = Math.round(+v); return isFinite(v) ? Math.max(1, Math.min(10, v)) : d; };
  const persos = { 'sérieux': 'serieux', 'souriant': 'souriant', 'ambitieux': 'ambitieux', 'discret': 'discret', 'stressé': 'stresse', 'blagueur': 'blagueur', 'posé': 'pose' };
  let n = 0;
  staff.forEach(function (s) {
    if (!s || typeof s.name !== 'string' || !s.name.trim()) return;
    if (s.tmp || (s.ct && s.ct.k === 'interim')) return; /* intérimaires d'un jour : pas repris */
    let poste = B.DATA.equipe.postes[s.post] ? s.post : (s.role === 'cook' ? 'commis' : s.role === 'waiter' ? 'serv' : null);
    if (!poste) return;
    const sub = s.sub || {}, note = borne(s.skill, 5), exp = Math.max(0, Math.min(45, Math.round(+s.exp) || 0));
    B.equipe.nouveauMembre(S, {
      nom: s.name.trim().slice(0, 40), genre: fem.indexOf(s.name.split(' ')[0]) >= 0 ? 'f' : 'm', poste: poste,
      note: note, vitesse: borne(sub.vit, note), amabilite: borne(sub.ami, note), qualite: borne(sub.qua, note),
      salaire: B.equipe.minimum(S, poste, exp), experience: exp, perso: persos[s.pers] || null
    });
    n++;
  });
  return n;
};

/* Reprend la carte de l'ancienne partie : plats présents dans Bistrot (mêmes identifiants), à la carte ou non, et leur prix.
   Les plats de saison, du menu du jour et les boissons de l'ancien jeu ne sont pas encore dans Bistrot. */
B.ancien.reprendreCarte = function (S, o) {
  const m = o && o.menu && typeof o.menu === 'object' ? o.menu : null;
  const r = { lus: 0, ignores: 0, ajustes: 0 };
  if (!m) return r;
  const P = B.DATA.carte.prix;
  let touche = false;
  B.carte.catalogue(S).forEach(function (d) {
    const a = m[d.id];
    if (!a || typeof a !== 'object' || typeof a.on !== 'boolean') return;
    if (!touche) { B.carte.CATS.forEach(function (c) { B.carte.surCarte(S, c).forEach(function (id) { S.carte.plats[id].on = false; }); }); touche = true; }
    S.carte.plats[d.id].on = a.on;
    const conseille = B.carte.prixConseille(S, d), prix = +a.price;
    if (isFinite(prix) && prix >= P.minimum && prix <= conseille * P.maxFoisConseille) S.carte.plats[d.id].prix = Math.round(prix * 2) / 2;
    r.lus++;
  });
  if (!touche) return r;
  Object.keys(m).forEach(function (id) { if (m[id] && m[id].on && !S.carte.plats[id]) r.ignores++; });
  const avant = JSON.stringify(B.carte.surCarte(S));
  B.carte.completer(S);
  if (JSON.stringify(B.carte.surCarte(S)) !== avant) r.ajustes = 1;
  return r;
};

/* Liste les anciennes parties trouvées, sans doublon (la sauvegarde principale recopie souvent un emplacement). */
B.ancien.trouver = function (lireCase) {
  const vues = {}, out = [];
  let active = null;
  try { active = lireCase(B.ancien.cleActive); } catch (e) { active = null; }
  B.ancien.cles.forEach(function (cle) {
    let txt = null;
    try { txt = lireCase(cle); } catch (e) { txt = null; }
    if (!txt) return;
    const o = B.ancien.lire(txt);
    if (!o) return;
    if (vues[txt]) return;
    vues[txt] = true;
    const n = cle.indexOf('slot') >= 0 ? +cle.slice(-1) : null;
    out.push({ cle: cle, emplacement: n, derniere: n === null || String(n) === String(active), texte: txt, resume: B.ancien.resumer(o) });
  });
  return out;
};

      haut += '<rect x="' + (geo.x - c / 2) + '" y="' + (geo.y - c / 2) + '" width="' + c + '" height="' + c + '" rx="12" fill="none" stroke="#1d6fd8" stroke-width="5"/>';
    }
  });
  /* Numéros de table */
  P.tables.forEach(function (t) {
    haut += '<text x="' + t.x + '" y="' + (t.y + 11) + '" class="num">' + t.id + '</text>';
  });
  /* Clients */
  let rangFile = 0, nbFile = 0, touchesFile = '';
  const manuel = S.placement === 'manuel' && S.ouvert;
  S.groupes.forEach(function (g) {
    const assis = ['carte', 'commande', 'cuisine', 'pret', 'mange', 'addition'].indexOf(g.etat) >= 0;
    if (g.etat === 'file') {
      nbFile++;
      const yf = UI.dessin.yFile(S, rangFile), demi = Math.ceil(g.taille / 2) * 11;
      if (yf + demi <= 428) {
        if (UI.groupeChoisi === g.id) haut += '<rect x="' + (P.file.x - 30) + '" y="' + (yf - demi - 8) + '" width="60" height="' + (2 * demi + 16) + '" rx="10" fill="none" stroke="#1d6fd8" stroke-width="5"/>';
        bas += UI.dessin.paquet(g, P.file.x, yf);
        if (manuel) touchesFile += '<rect data-groupe="' + g.id + '" x="' + (P.file.x - 40) + '" y="' + (yf - demi - 11) + '" width="80" height="' + (2 * demi + 22) + '" fill="transparent"/>';
      }
      rangFile++;
    } else if (assis) {
      const places = [];
      g.tables.forEach(function (id) { B.salle.places(id).forEach(function (p) { places.push(p); }); });
      for (let i = 0; i < g.taille; i++) bas += UI.dessin.client(places[i].x, places[i].y, UI.dessin.couleur(g));
      if (g.etat === 'mange') g.tables.forEach(function (id) {
        const geo = B.salle.geo(id);
        bas += '<circle cx="' + geo.x + '" cy="' + (geo.y - 22) + '" r="10" fill="#fff" stroke="#ccc" stroke-width="2"/>';
      });
      const c = B.salle.centre(g.tables), geo = B.salle.geo(g.tables[0]);
      const y = geo.y < P.allee ? geo.y - 85 : geo.y + 89;
      etiq += UI.dessin.etiquette(c.x, y, B.t('etat_court_' + g.etat), UI.dessin.couleurs[UI.classeAttente(g)]);
    } else {
      bas += UI.dessin.paquet(g, g.x, g.y);
    }
  });
  S.tables.forEach(function (t) {
    if (!t.sale) return;
    const geo = B.salle.geo(t.id), y = geo.y < P.allee ? geo.y - 85 : geo.y + 89;
    etiq += UI.dessin.etiquette(geo.x, y, B.t('etat_court_sale'), UI.dessin.couleurs.sale);
  });
  if (nbFile) etiq += '<text x="22" y="' + (P.file.y - 30) + '" class="petit-txt gauche">' + UI.esc(B.t('salle_file', { n: nbFile })) + '</text>';
  /* Cuisine : veste blanche et toque */
  B.equipe.cuisine(S).forEach(function (w) {
    const x = w.x, y = w.y, occupe = S.groupes.some(function (g) { return g.cuisinier === w.id; });
    haut += '<rect x="' + (x - 11) + '" y="' + (y - 33) + '" width="22" height="14" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>';
    haut += '<circle cx="' + x + '" cy="' + y + '" r="16" fill="' + (w.patron ? '#8e2a22' : '#ffffff') + '" stroke="' + (occupe ? '#d9811c' : '#555') + '" stroke-width="3"/>';
  });
  /* Salle : rond foncé avec tablier blanc (le patron en rouge foncé) */
  B.equipe.salle(S).forEach(function (w) {
    const x = w.x.toFixed(1), y = w.y.toFixed(1);
    haut += '<circle cx="' + x + '" cy="' + y + '" r="17" fill="' + (w.patron ? '#8e2a22' : '#1f1f1f') + '" stroke="#f2c14e" stroke-width="3"/>';
    haut += '<rect x="' + (w.x - 7).toFixed(1) + '" y="' + (w.y - 2).toFixed(1) + '" width="14" height="14" rx="2" fill="#fff"/>';
    const e = w.tache && w.tache.etapes[0];
    if (e && e.porte === 'assiette') haut += '<circle cx="' + (w.x + 20).toFixed(1) + '" cy="' + (w.y - 14).toFixed(1) + '" r="10" fill="#fff" stroke="#bbb" stroke-width="2"/>';
    if (e && e.porte === 'addition') haut += '<rect x="' + (w.x + 12).toFixed(1) + '" y="' + (w.y - 26).toFixed(1) + '" width="14" height="20" fill="#fff" stroke="#bbb" stroke-width="2"/>';
  });
  const tf = UI.$('touches-file');
  if (tf._html !== touchesFile) { tf.innerHTML = touchesFile; tf._html = touchesFile; }
  const html = bas + haut + etiq;
  const dyn = UI.$('dyn');
  if (dyn._html !== html) { dyn.innerHTML = html; dyn._html = html; }
};

UI.dessin.initTouches = function () {
  UI.$('touches-file').addEventListener('click', function (e) {
    const r = e.target.closest('[data-groupe]');
    if (!r || !UI.S) return;
    const id = +r.dataset.groupe;
    UI.groupeChoisi = UI.groupeChoisi === id ? null : id;
    UI.selection = null;
    UI.majDetail(); UI.dessin.dynamique();
  });
  UI.$('touches').addEventListener('click', function (e) {
    const r = e.target.closest('[data-table]');
    if (!r || !UI.S) return;
    const id = +r.dataset.table;
    if (UI.groupeChoisi) {
      const res = B.clients.placerManuel(UI.S, UI.groupeChoisi, id);
      if (res.ok) UI.groupeChoisi = null;
      else B.flux.push({ jour: UI.S.jour, minute: Math.floor(UI.S.minute), texte: B.t(res.erreur, res.vars) });
      UI.majDetail(); UI.dessin.dynamique();
      return;
    }
    UI.selection = UI.selection === id ? null : id;
    UI.majDetail();
    UI.dessin.dynamique();
  });
};

/* ==== src/interface/messages.js ==== */
/* messages.js — notifications dans leur zone réservée (jamais sur un bouton) et Journal complet. */
UI.toasts = [];
UI.DUREE_MESSAGE = 6000;
UI.MAX_VISIBLES = 3;

UI.majMessages = function (maintenant) {
  while (B.flux.length) UI.toasts.push({ m: B.flux.shift(), fin: maintenant + UI.DUREE_MESSAGE });
  UI.toasts = UI.toasts.filter(function (t) { return t.fin > maintenant; });
  const el = UI.$('messages');
  /* On affiche jusqu'à 3 messages, moins s'ils ne tiennent pas en entier dans la zone. */
  for (let n = Math.min(UI.MAX_VISIBLES, UI.toasts.length); n >= 0; n--) {
    const visibles = UI.toasts.slice(UI.toasts.length - n).reverse();
    const caches = UI.toasts.length - n;
    let html = visibles.map(function (t) {
      return '<div class="msg"><span class="h">' + B.heure(t.m.minute) + '</span> ' + UI.esc(t.m.texte) + '</div>';
    }).join('');
    if (caches > 0) html += '<div class="msg-plus">' + UI.esc(B.t('msg_plus', { n: caches })) + '</div>';
    if (el._html === html) return;
    el.innerHTML = html;
    if (el.scrollHeight <= el.clientHeight + 1 || n === 0) { el._html = html; return; }
  }
};

UI.htmlJournal = function () {
  const J = UI.S ? UI.S.journal.slice().reverse() : [];
  if (!J.length) return '<p>' + UI.esc(B.t('journal_vide')) + '</p>';
  return '<ul class="journal">' + J.map(function (m) {
    return '<li><span class="h">' + UI.esc(B.t('journal_ligne', { jour: m.jour, heure: B.heure(m.minute) })) + '</span>' + UI.esc(m.texte) + '</li>';
  }).join('') + '</ul>';
};

/* ==== src/interface/volets.js ==== */
/* volets.js — panneaux qui s'ouvrent par-dessus la salle (Journal, Menu) et se ferment d'un geste.
   Le jeu se met en pause pendant la lecture (réglage), et reprend à la fermeture. */
UI.voletOuvert = null;

UI.ouvrirVolet = function (quoi) {
  UI.voletOuvert = quoi;
  const v = UI.$('volet');
  v.classList.toggle('large', quoi === 'equipe' || quoi === 'carte');
  if (quoi === 'equipe') { UI.candidatCourant = null; UI.renvoiCourant = null; UI.renvoiRefus = null; UI.rafraichirEquipe(true); }
  else if (quoi === 'carte') { UI.platCourant = null; UI.carteRefus = null; UI.rafraichirCarte(true); }
  else if (quoi === 'ticket') {
    const g = UI.S.groupes.find(function (x) { return x.id === UI.ticketGroupe; });
    UI.$('volet-titre').textContent = B.t('ticket_titre');
    UI.$('volet-corps').innerHTML = g ? UI.htmlTicket(g) : '';
  }
  else {
    UI.$('volet-titre').textContent = B.t(quoi === 'journal' ? 'journal_titre' : 'menu_titre');
    UI.$('volet-corps').innerHTML = quoi === 'journal' ? UI.htmlJournal() : UI.htmlMenu();
  }
  UI.$('voile').hidden = false;
  v.hidden = false;
  requestAnimationFrame(function () { v.classList.add('ouvert'); });
  if (UI.reglages.pauseAuto) UI.pause('volet', true);
  UI.sauver();
};

UI.fermerVolet = function () {
  const v = UI.$('volet');
  v.classList.remove('ouvert');
  UI.$('voile').hidden = true;
  setTimeout(function () { if (!v.classList.contains('ouvert')) v.hidden = true; }, 220);
  UI.voletOuvert = null;
  UI.candidatCourant = null;
  UI.renvoiCourant = null;
  UI.renvoiRefus = null;
  UI.platCourant = null;
  UI.carteRefus = null;
  UI.ticketGroupe = null;
  UI.pause('volet', false);
  UI.majDetail();
};

UI.htmlMenu = function () {
  const S = UI.S;
  let h = '<h3>' + UI.esc(B.t('menu_reglages')) + '</h3>';
  h += '<div class="ligne-reglage"><span>' + UI.esc(B.t('menu_pause_auto')) + '</span>' +
    '<button type="button" class="bascule' + (UI.reglages.pauseAuto ? ' on' : '') + '" data-action="pause-auto">' +
    UI.esc(B.t(UI.reglages.pauseAuto ? 'menu_oui' : 'menu_non')) + '</button></div>';
  const manuel = S && S.placement === 'manuel';
  h += '<div class="ligne-reglage"><span>' + UI.esc(B.t('menu_placement')) + '</span>' +
    '<button type="button" class="bascule' + (manuel ? ' on' : '') + '" data-action="placement">' + UI.esc(B.t(manuel ? 'menu_oui' : 'menu_non')) + '</button></div>';
  h += '<h3>' + UI.esc(B.t('menu_partie')) + '</h3>';
  if (UI.derniereSauvegarde != null) h += '<p>' + UI.esc(B.t('menu_sauve', { heure: B.heure(UI.derniereSauvegarde) })) + '</p>';
  if (S && S.origine) h += '<p>' + UI.esc(B.t('menu_origine', { v: S.origine.versionSauvegarde })) + '</p>';
  h += '<button type="button" class="gros" data-action="accueil">' + UI.esc(B.t('menu_accueil')) + '</button>';

UI.initVolets = function () {
  UI.$('volet-fermer').textContent = B.t('btn_fermer');
  UI.$('volet-fermer').addEventListener('click', UI.fermerVolet);
  UI.$('voile').addEventListener('click', UI.fermerVolet);
  UI.$('volet-corps').addEventListener('click', function (e) {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    if (b.dataset.action === 'pause-auto') {
      UI.reglages.pauseAuto = !UI.reglages.pauseAuto;
      UI.sauverReglages();
      if (!UI.reglages.pauseAuto) UI.pause('volet', false);
      UI.$('volet-corps').innerHTML = UI.htmlMenu();
    } else if (b.dataset.action === 'placement' && UI.S) {
      UI.S.placement = UI.S.placement === 'manuel' ? 'auto' : 'manuel';
      UI.groupeChoisi = null;
      UI.majPlacement(); UI.sauver();
      UI.$('volet-corps').innerHTML = UI.htmlMenu();
    } else if (b.dataset.action === 'accueil') {
      UI.fermerVolet();
      UI.sauver();
      UI.montrerAccueil();
    }
  });
  /* Glisser le volet vers la droite pour le fermer */
  let x0 = null;
  const v = UI.$('volet');
  v.addEventListener('pointerdown', function (e) { x0 = e.clientX; });
  v.addEventListener('pointerup', function (e) { if (x0 != null && e.clientX - x0 > 60) UI.fermerVolet(); x0 = null; });
  v.addEventListener('pointercancel', function () { x0 = null; });
};

UI.rafraichirEquipe = function (enHaut) {
  if (UI.voletOuvert !== 'equipe') return;
  const r = UI.renvoiCourant != null && UI.S && UI.S.equipe.find(function (x) { return x.id === UI.renvoiCourant; });
  UI.$('volet-titre').textContent = UI.candidatCourant ? B.t('entretien_titre', { nom: UI.candidatCourant.nom }) : r ? B.t('renvoi_titre', { nom: r.nom }) : B.t('equipe_titre');
  const corps = UI.$('volet-corps'), y = corps.scrollTop;
  corps.innerHTML = UI.htmlEquipe();
  corps.scrollTop = enHaut ? 0 : y;
};

UI.initEquipe = function () {
  UI.$('volet-corps').addEventListener('click', function (e) {
    const b = e.target.closest('[data-eq]');
    if (!b || !UI.S || b.disabled) return;
    const S = UI.S, a = b.dataset.eq, c = UI.candidatCourant;
    if (a === 'ouvrir') {
      if (B.ouvrir(S)) { UI.sauver(); UI.fermerVolet(); UI.majBarre(); UI.majDetail(); }
      return;
    }
    if (a === 'patron') { UI.renvoiRefus = null; B.equipe.changerPatron(S); UI.sauver(); UI.rafraichirEquipe(); return; }
    if (a === 'renvoyer') {
      const p = S.equipe.find(function (x) { return x.id === +b.dataset.id; });
      if (!p) return;
      const non = B.equipe.peutRenvoyer(S, p);
      if (non) { UI.renvoiRefus = { id: p.id, texte: UI.tGenre(non, p, { prenom: UI.prenom(p) }) }; UI.rafraichirEquipe(); return; }
      UI.renvoiRefus = null; UI.renvoiCourant = p.id; UI.rafraichirEquipe(true); return;
    }
    if (a === 'interim') { B.equipe.appelerInterim(S, b.dataset.sv, false); UI.sauver(); UI.rafraichirEquipe(); UI.majBarre(); UI.dessin.dynamique(); return; }
    if (a === 'interim-auto') { S.interimAuto = !S.interimAuto; UI.sauver(); UI.rafraichirEquipe(); return; }
    if (a === 'renvoi-non') { UI.renvoiCourant = null; UI.rafraichirEquipe(true); return; }
    if (a === 'renvoi-oui') {
      const p = S.equipe.find(function (x) { return x.id === UI.renvoiCourant; });
      UI.renvoiCourant = null;
      if (p) {
        const non = B.equipe.peutRenvoyer(S, p);
        if (non) UI.renvoiRefus = { id: p.id, texte: UI.tGenre(non, p, { prenom: UI.prenom(p) }) };
        else B.equipe.renvoyer(S, p);
      }
      UI.sauver(); UI.rafraichirEquipe(true); UI.majBarre(); UI.majDetail(); UI.dessin.dynamique();
      return;
    }
    if (a === 'entretien') {
      UI.candidatCourant = S.candidats.find(function (x) { return x.id === +b.dataset.id; }) || null;
      if (UI.candidatCourant) UI.candidatCourant.dernierMot = null;
      UI.rafraichirEquipe(true); return;
    }
    if (a === 'retour') { UI.candidatCourant = null; UI.rafraichirEquipe(true); return; }
    if (!c) return;
    if (a === 'question') B.equipe.repondre(S, c, b.dataset.q);
    else if (a === 'moins') c.offre = Math.max(c.minimum, Math.round((c.offre - 0.1) * 100) / 100);
    else if (a === 'plus') c.offre = Math.round((c.offre + 0.1) * 100) / 100;
    else if (a === 'proposer') B.equipe.proposer(S, c, c.offre);
    UI.sauver();
    UI.rafraichirEquipe(a === 'proposer');
  });
};

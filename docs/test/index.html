    if (e.etat === 'nego') h += '<p class="alerte-ag">' + UI.esc(B.t('cal_prive_trop_cher')) + '</p>';
    h += '<p class="sous">' + UI.esc(B.t('cal_prive_conseil', { prix: B.euros(B.ev.prixConseille(S, e)) })) + '</p>';
    h += '<div class="prix-prive"><button type="button" class="petit-btn gros-mini" data-cal-prix="-1" aria-label="' + UI.esc(B.t('carte_moins')) + '">−</button><b class="gros-prix">' + UI.esc(B.euros(e.prix)) + '</b><button type="button" class="petit-btn gros-mini" data-cal-prix="1" aria-label="' + UI.esc(B.t('carte_plus')) + '">+</button><span>' + UI.esc(B.t('cal_par_personne')) + '</span></div>';
    h += '<p>' + UI.esc(B.t('cal_prive_total', { total: B.euros(e.prix * e.n), marge: B.euros((e.prix - cpp) * e.n), acompte: B.euros(Math.round(e.prix * e.n * B.DATA.calendrier.evenementsPrives.acompte)) })) + '</p>';
    h += '<div class="rang"><button type="button" class="gros principal" data-cal-action="proposer">' + UI.esc(B.t('cal_prive_proposer')) + '</button><button type="button" class="gros" data-cal-action="decliner">' + UI.esc(B.t('cal_prive_decliner')) + '</button></div>';
  } else if (e.etat === 'contre') {
    h += '<p class="alerte-ag">' + UI.esc(B.t('cal_prive_contre', { prix: B.euros(e.contre), marge: B.euros((e.contre - cpp) * e.n) })) + '</p>';
    h += '<div class="rang"><button type="button" class="gros principal" data-cal-action="contre">' + UI.esc(B.t('cal_prive_accepter', { prix: B.euros(e.contre) })) + '</button><button type="button" class="gros" data-cal-action="decliner">' + UI.esc(B.t('cal_prive_refuser')) + '</button></div>';
  } else if (e.etat === 'reserve') {
    h += '<p>' + UI.esc(B.t('cal_prive_reserve', { prix: B.euros(e.prix), total: B.euros(e.prix * e.n), acompte: B.euros(e.acompte) })) + '</p>';
    h += '<p class="sous">' + UI.esc(B.t('cal_prive_stock')) + '</p>';
  }
  if (S.finJour && ['appel', 'nego', 'contre'].indexOf(e.etat) >= 0) h += '<p class="sous">' + UI.esc(B.t('cal_prive_demain')) + '</p>';
  return h + '</div>';
};

UI.rafraichirCalendrier = function (enHaut) {
  if (UI.voletOuvert !== 'calendrier') return;
  UI.$('volet-titre').textContent = B.t('cal_titre');
  const c = UI.$('volet-corps'), y = c.scrollTop;
  c.innerHTML = UI.htmlCalendrier();
  c.scrollTop = enHaut ? 0 : y;
  UI.majCalendrier();
};

/* ---------- Événement du jour : une fenêtre avec de gros boutons (le jeu attend ta réponse) ---------- */
UI.majEvenement = function () {
  const S = UI.S, el = UI.$('evenement');
  const a = S && S.cal && S.cal.attente;
  if (!a || S.finJour) { if (!el.hidden) { el.hidden = true; UI.pause('evenement', false); } return; }
  if (!el.hidden && el._id === a.id + ':' + a.minute) return;
  el._id = a.id + ':' + a.minute;
  const suffixe = a.variante ? '_' + a.variante : '';
  const vars = Object.assign({ sport: a.sport || '' }, a.vars || {});
  const emoji = a.id === 'resultat' || a.id === 'match' ? a.emoji : B.t('ev_' + a.id + '_emoji');
  const titre = a.id === 'resultat' ? a.titre : 'ev_' + a.id + '_titre' + suffixe, texte = a.id === 'resultat' ? a.texte : 'ev_' + a.id + '_texte' + suffixe;
  let h = '<div class="carte-fin carte-evenement"><h2>' + UI.esc(emoji + ' ' + B.t(titre, vars)) + '</h2>';
  h += '<p class="gros-texte">' + UI.esc(B.t(texte, vars)) + '</p>';
  B.ev.choix(S, a).forEach(function (c, k) {
    const v = Object.assign({}, vars, { prix: c.prix ? B.euros(c.prix) : '' }), effet = B.t(c.cle + '_effet', v);
    h += '<button type="button" class="gros' + (k === 0 ? ' principal' : '') + '" data-ev-choix="' + k + '">' + UI.esc(B.t(c.cle, v)) +
      (effet ? '<small>' + UI.esc(effet) + '</small>' : '') + '</button>';
  });
  el.innerHTML = h + '</div>';
  el.hidden = false;
  UI.pause('evenement', true);
};

/* ---------- Fin de journée : le temps de demain ---------- */
UI.texteDemain = function (S) {
  if (!S.cal) return '';
  const i = B.cal.infos(S, 1), mq = UI.marquesDuJour(S, i);
  return B.t('fin_demain', { date: B.texteDate(S, 1), meteo: UI.texteMeteo(i.meteo), affluence: UI.pct(i.facteur) }) + (mq.length ? ' · ' + mq.map(function (m) { return m.txt; }).join(' · ') : '');
};

UI.initCalendrier = function () {
  UI.$('btn-calendrier').addEventListener('click', function () { if (UI.S && UI.S.cal) { UI.calOnglet = UI.aDecider(UI.S) ? 'evenements' : 'jour'; UI.calMois = 0; UI.calPrive = null; UI.ouvrirVolet('calendrier'); } });
  UI.$('evenement').addEventListener('click', function (e) {
    const b = e.target.closest('[data-ev-choix]');
    if (!b || !UI.S) return;
    B.ev.choisir(UI.S, +b.dataset.evChoix);
    UI.$('evenement').hidden = true;
    UI.pause('evenement', false);
    UI.sauver(); UI.majBarre(); UI.majCalendrier();
  });
  UI.$('volet-corps').addEventListener('click', function (e) {
    if (UI.voletOuvert !== 'calendrier' || !UI.S) return;
    const S = UI.S;
    const o = e.target.closest('[data-cal-onglet]');
    if (o) { UI.calOnglet = o.dataset.calOnglet; UI.calPrive = null; UI.rafraichirCalendrier(true); return; }
    const m = e.target.closest('[data-cal-mois]');
    if (m) { UI.calMois = Math.max(-1, Math.min(12, UI.calMois + +m.dataset.calMois)); UI.rafraichirCalendrier(false); return; }
    const f = e.target.closest('[data-cal-fete]');
    if (f) { B.ev.repondreFete(S, f.dataset.calFete, f.dataset.oui === '1'); UI.sauver(); UI.rafraichirCalendrier(false); return; }
    const p = e.target.closest('[data-cal-prive]');
    if (p) { UI.calPrive = +p.dataset.calPrive; UI.rafraichirCalendrier(true); return; }
    if (e.target.closest('[data-cal-retour]')) { UI.calPrive = null; UI.rafraichirCalendrier(true); return; }
    const x = e.target.closest('[data-cal-prix]');
    if (x && UI.calPrive != null) { B.ev.changerPrix(S, UI.calPrive, +x.dataset.calPrix); UI.rafraichirCalendrier(false); return; }
    const a = e.target.closest('[data-cal-action]');
    if (a && UI.calPrive != null) {
      const k = a.dataset.calAction;
      if (k === 'proposer') B.ev.proposer(S, UI.calPrive);
      else if (k === 'contre') B.ev.accepterContre(S, UI.calPrive);
      else if (k === 'decliner') B.ev.decliner(S, UI.calPrive);
      UI.sauver(); UI.majBarre(); UI.rafraichirCalendrier(false);
    }
  });
};

/* ==== src/interface/carte.js ==== */
/* carte.js (écran) — volet Carte (prix, plats à la carte), fiche d'un plat, et ticket d'une table. */
UI.platCourant = null;   /* id du plat dont la fiche est ouverte */
UI.carteRefus = null;    /* { id, texte } : pourquoi on ne peut pas ajouter / retirer ce plat */
UI.ticketGroupe = null;  /* id du groupe dont on regarde le ticket */

UI.carteOnglet = 'plats';  /* plats | boissons | mdj */

UI.badgesPlat = function (S, d) {
  let h = '';
  if (S.stocks && S.carte.plats[d.id] && S.carte.plats[d.id].on && !B.carte.disponible(S, d.id)) h += '<span class="badge rouge">' + UI.esc(B.t('carte_badge_rupture')) + '</span>';
  if (d.saison) h += '<span class="badge ' + (B.carte.enSaison(S, d) ? 'veg' : 'gris') + '">' + UI.esc(B.t(B.carte.enSaison(S, d) ? 'carte_badge_saison' : 'carte_badge_hors_saison')) + '</span>';
  if (d.fete) h += '<span class="badge fete">' + UI.esc(B.t('carte_badge_fete')) + '</span>';
  if (d.local) h += '<span class="badge local">' + UI.esc(B.t('carte_badge_local')) + '</span>';
  if (d.cat === 'boisson') { if (d.alcool) h += '<span class="badge">' + UI.esc(B.t('carte_badge_alcool')) + '</span>'; return h; }
  if (B.DATA.carte.faitMaison) h += '<span class="badge fm">' + UI.esc(B.t('carte_badge_fm')) + '</span>';
  if (d.vegetarien) h += '<span class="badge veg">' + UI.esc(B.t('carte_badge_veg')) + '</span>';
  return h;
};

UI.lignePlat = function (S, d) {
  const p = S.carte.plats[d.id], m = B.carte.marge(S, d.id), conseille = B.carte.prixConseille(S, d);
  let h = '<div class="plat' + (p.on ? ' on' : '') + '">' +
    '<button type="button" class="plat-nom" data-ca="fiche" data-id="' + d.id + '"><span class="nom">' + UI.esc(d.emoji + ' ' + d.nom) + '</span>' +
    '<span class="sous">' + UI.badgesPlat(S, d) + UI.esc(B.t('carte_ligne_chiffres', { conseille: B.prix(conseille), cout: B.prix(m.cout), pct: m.pct })) + '</span></button>' +
    '<div class="plat-prix"><button type="button" class="petit-btn mini" data-ca="moins" data-id="' + d.id + '" aria-label="' + UI.esc(B.t('carte_moins')) + '">−</button>' +
    '<b>' + UI.esc(B.prix(p.prix)) + '</b>' +
    '<button type="button" class="petit-btn mini" data-ca="plus" data-id="' + d.id + '" aria-label="' + UI.esc(B.t('carte_plus')) + '">+</button></div>' +
    '<button type="button" class="bascule' + (p.on ? ' on' : '') + '" data-ca="basculer" data-id="' + d.id + '">' + UI.esc(B.t(p.on ? 'carte_a_la_carte' : 'carte_pas_a_la_carte')) + '</button></div>';
  if (UI.carteRefus && UI.carteRefus.id === d.id) h += '<div class="refus">' + UI.esc(UI.carteRefus.texte) + '</div>';
  return h;
};
/* Les plats de saison hors de leurs mois ne sont montrés que s'ils sont encore à la carte. */
UI.visibles = function (S, filtre) {
  return B.carte.catalogue(S).filter(function (d) { return filtre(d) && (B.carte.enSaison(S, d) || S.carte.plats[d.id].on); });
};

UI.htmlCarte = function () {
  const S = UI.S;
  if (UI.platCourant && B.carte.plat(S, UI.platCourant)) return UI.htmlFichePlat(B.carte.plat(S, UI.platCourant));
  const L = B.DATA.carte.limites;
  let h = UI.onglets('data-ca-onglet', [['plats', B.t('carte_onglet_plats')], ['boissons', B.t('carte_onglet_boissons')], ['mdj', B.t('carte_onglet_mdj')]], UI.carteOnglet);
  if (UI.carteOnglet === 'mdj') return UI.mdjChoix && S.stocks.mdj ? UI.htmlChoixMdj(UI.mdjChoix) : h + UI.htmlMenuDuJour();
  if (UI.carteOnglet === 'boissons') {
    h += '<p class="sous">' + UI.esc(B.t('carte_intro_boissons', { n: B.carte.surCarte(S, 'boisson').length, max: L.max.boisson })) + '</p>';
    ['apero', 'vin', 'bouteille', 'froid', 'chaud'].forEach(function (ty) {
      const ds = UI.visibles(S, function (d) { return d.cat === 'boisson' && d.type === ty; });
      if (!ds.length) return;
      h += '<h3>' + UI.esc(B.t('carte_type_' + ty)) + '</h3>';
      ds.forEach(function (d) { h += UI.lignePlat(S, d); });
    });
    return h;
  }
  h += '<p class="sous">' + UI.esc(B.t('carte_intro', { e: B.carte.surCarte(S, 'entree').length, p: B.carte.surCarte(S, 'plat').length, d: B.carte.surCarte(S, 'dessert').length,
    me: L.max.entree, mp: L.max.plat, md: L.max.dessert, indice: Math.round(B.carte.indicePrix(S) * 100) })) + '</p>';
  B.carte.CATS.forEach(function (c) {
    h += '<h3>' + UI.esc(B.t('carte_cat_' + c)) + '</h3>';
    UI.visibles(S, function (d) { return d.cat === c; }).forEach(function (d) { h += UI.lignePlat(S, d); });
  });
  h += '<p class="sous">' + UI.esc(B.t('carte_note_cout')) + '</p>';
  return h;
};

UI.mdjChoix = null;   /* place du menu en cours de modification : entree | plat | dessert */
UI.mdjMsg = null;     /* { texte, ok } */

  const S = UI.S, m = S.stocks.mdj, on = S.stocks.mdjOn !== false;
  let h = '<p class="sous">' + UI.esc(B.t('mdj_intro')) + '</p>';

  h += '<div class="ligne-reglage"><span>' + UI.esc(B.t('mdj_actif')) + '</span><button type="button" class="bascule' + (on ? ' on' : '') + '" data-ca="mdj-on">' + UI.esc(B.t(on ? 'menu_oui' : 'menu_non')) + '</button></div>';
  h += '<h3>' + UI.esc(B.t('mdj_du_jour') + ' · ' + B.texteDate(S)) + (B.menuJour.estModifie(S) ? ' <span class="badge orange">' + UI.esc(B.t('mdj_badge_modifie')) + '</span>' : '') + '</h3>';
  if (!m || !m.plat) {
    h += '<p class="gros-texte">' + UI.esc(B.t('mdj_aucun')) + '</p>';

  } else {
    B.menuJour.CATS.forEach(function (c) {

      const manque = d ? B.stock.manque(S, d.recette) : [];
      h += '<div class="mdj-place"><div class="mdj-texte"><span class="sous">' + UI.esc(B.t('mdj_cat_' + c)) + (m.manuel && m.manuel[c] ? ' · ' + B.t('mdj_choisi_par_toi') : '') + '</span>' +

    B.menuJour.formules(S).forEach(function (f) {
      h += '<div class="ligne-st"><span class="gros-texte">' + UI.esc(B.t('mdj_formule_' + f)) + '</span><span class="plat-prix"><button type="button" class="petit-btn mini" data-ca="mdj-moins" data-id="' + f + '" aria-label="' + UI.esc(B.t('carte_moins')) + '">−</button><b>' +
        UI.esc(B.prix(B.menuJour.prixFormule(S, f))) + '</b><button type="button" class="petit-btn mini" data-ca="mdj-plus" data-id="' + f + '" aria-label="' + UI.esc(B.t('carte_plus')) + '">+</button></span></div>';
    });
    if (B.menuJour.prixModifies(S)) h += '<button type="button" class="gros" data-ca="mdj-prix-auto">' + UI.esc(B.t('mdj_prix_conseilles', { ep: B.prix(B.menuJour.prixConseilles(S).ep), epd: B.prix(B.menuJour.prixConseilles(S).epd) })) + '</button>';
  }
  const pl = S.stocks.planMdj;
  if (pl && pl.jour === S.jour + 1) {
    h += '<h3>' + UI.esc(B.t('mdj_demain')) + '</h3><p>' + B.menuJour.CATS.map(function (c) { const d = pl[c] && B.menuJour.plat(S, pl[c]); return d ? UI.esc(d.emoji + ' ' + d.nom) : ''; }).filter(Boolean).join(' · ') + '</p>';
  }
  return h;
};

/* Écran de modification d'une place du menu : les plats faisables d'abord, ceux qui manquent d'ingrédients grisés avec la raison. */
UI.htmlChoixMdj = function (cat) {
  const S = UI.S, M = B.DATA.stocks.menuDuJour, L = B.menuJour.choix(S, cat);
  let h = '<button type="button" class="gros" data-ca="mdj-retour">' + UI.esc(B.t('mdj_retour')) + '</button>';

  if (UI.mdjMsg) h += '<div class="refus gros-texte">' + UI.esc(UI.mdjMsg.texte) + '</div>';
  if (cat !== 'plat') {
    const actuel = !S.stocks.mdj[cat];
    h += '<button type="button" class="mdj-choix' + (actuel ? ' actuel' : '') + '" data-ca="mdj-prendre" data-cat="' + cat + '" data-id=""><b>' + UI.esc(B.t('mdj_sans_' + cat)) + '</b>' +
      '<span>' + UI.esc(B.t('mdj_sans_aide_' + cat)) + '</span></button>';
  }
  L.forEach(function (x) {
    const etat = x.actuel ? B.t('mdj_etat_actuel') : x.propose ? B.t('mdj_etat_propose') : '';

      '<b>' + UI.esc(x.d.emoji + ' ' + x.d.nom) + (etat ? ' <span class="badge">' + UI.esc(etat) + '</span>' : '') + '</b><span>' + UI.esc(info) + '</span></button>';
  });
  return h;
};

/* Ticket d'une table : commande, cuissons, total, et pourboire une fois payé. */
UI.htmlTicket = function (g) {
  const S = UI.S, N = B.DATA.carte.cuissons.noms;

    if (l.renvoye) h += '<div class="t-note">' + UI.esc(B.t('ticket_renvoye', { servie: N[l.servie] ? N[l.servie].toLowerCase() : '' })) + '</div>';
  });

  else h += '<p class="t-pied">' + UI.esc(B.t('ticket_a_payer')) + '</p>';

UI.rafraichirCarte = function (enHaut) {
  if (UI.voletOuvert !== 'carte') return;
  const d = UI.platCourant && B.carte.plat(UI.S, UI.platCourant);
  UI.$('volet-titre').textContent = d ? d.emoji + ' ' + d.nom : UI.carteOnglet === 'mdj' && UI.mdjChoix ? B.t('mdj_titre_choix_' + UI.mdjChoix) : B.t('carte_titre');
  const corps = UI.$('volet-corps'), y = corps.scrollTop;
  corps.innerHTML = UI.htmlCarte();
  corps.scrollTop = enHaut ? 0 : y;
};

UI.ouvrirTicket = function (gid) {
  const g = UI.S.groupes.find(function (x) { return x.id === gid; });
  if (!g || !g.commande) return;
  UI.ticketGroupe = gid;
  UI.ouvrirVolet('ticket');
};

UI.initCarte = function () {
  UI.$('volet-corps').addEventListener('click', function (e) {
    const o = e.target.closest('[data-ca-onglet]');
    if (o && UI.voletOuvert === 'carte') { UI.carteOnglet = o.dataset.caOnglet; UI.platCourant = null; UI.carteRefus = null; UI.mdjChoix = null; UI.mdjMsg = null; UI.rafraichirCarte(true); return; }
    const b = e.target.closest('[data-ca]');
    if (!b || !UI.S || b.disabled) return;
    const S = UI.S, a = b.dataset.ca, id = b.dataset.id;
    if (a === 'mdj-changer') { UI.mdjChoix = id; UI.mdjMsg = null; UI.rafraichirCarte(true); return; }
    if (a === 'mdj-retour') { UI.mdjChoix = null; UI.mdjMsg = null; UI.rafraichirCarte(true); return; }
    if (a === 'mdj-prendre') {
      const r = B.menuJour.choisir(S, b.dataset.cat, b.dataset.id || null);
      if (r.erreur) { UI.mdjMsg = { texte: B.t(r.erreur, r.vars) }; UI.rafraichirCarte(true); return; }
      const d = b.dataset.id && B.menuJour.plat(S, b.dataset.id);
      UI.mdjChoix = null;
      UI.mdjMsg = { ok: r.portions >= B.DATA.stocks.menuDuJour.minPortions, texte: d ? B.t(r.portions >= B.DATA.stocks.menuDuJour.minPortions ? 'mdj_ok_change' : 'mdj_ok_peu', { plat: d.nom, n: r.portions }) : B.t('mdj_ok_sans_' + b.dataset.cat, { n: r.portions }) };
      UI.sauver(); UI.rafraichirCarte(true); return;
    }
    if (a === 'mdj-auto') { B.menuJour.revenirAuto(S); UI.mdjMsg = { ok: true, texte: B.t('mdj_ok_auto') }; UI.sauver(); UI.rafraichirCarte(true); return; }
    if (a === 'mdj-prix-auto') { B.menuJour.prixConseillesRemettre(S); UI.sauver(); UI.rafraichirCarte(); return; }
    if (a === 'mdj-on') { S.stocks.mdjOn = S.stocks.mdjOn === false; UI.sauver(); UI.rafraichirCarte(); return; }
    if (a === 'mdj-plus' || a === 'mdj-moins') { B.menuJour.changerPrix(S, id, a === 'mdj-plus' ? 1 : -1); UI.sauver(); UI.rafraichirCarte(); return; }
    if (a === 'fiche') { UI.platCourant = id; UI.carteRefus = null; UI.rafraichirCarte(true); return; }
    if (a === 'retour') { UI.platCourant = null; UI.carteRefus = null; UI.rafraichirCarte(true); return; }
    if (a === 'moins' || a === 'plus') { B.carte.changerPrix(S, id, a === 'plus' ? 1 : -1); UI.carteRefus = null; }
    if (a === 'basculer') {
      const non = B.carte.basculer(S, id);
      UI.carteRefus = non ? { id: id, texte: B.t(non) } : null;
    }
    UI.sauver(); UI.rafraichirCarte();
  });
  UI.$('detail').addEventListener('click', function (e) {
    const b = e.target.closest('[data-ticket]');
    if (b && UI.S) UI.ouvrirTicket(+b.dataset.ticket);
  });
};

/* ==== src/interface/stocks.js ==== */
/* stocks.js (écran) — volet Stocks : la réserve (par rangement), passer une commande, réglages (commande automatique, marge).
   Le volet Carte reçoit aussi deux onglets : Boissons et Menu du jour. */
UI.stOnglet = 'reserve';   /* reserve | commander | reglages */
UI.panier = null;          /* { four, lignes: { ingrédient: portions } } */
UI.stMsg = null;           /* résultat de la dernière action (texte) */

UI.onglets = function (attr, liste, actif) {
  return '<div class="onglets">' + liste.map(function (o) {
    return '<button type="button" class="onglet' + (o[0] === actif ? ' actif' : '') + '" ' + attr + '="' + o[0] + '">' + UI.esc(o[1]) + '</button>';
  }).join('') + '</div>';
};
UI.jaugeHtml = function (n, max) {
  const p = Math.min(100, Math.round(n / max * 100));
  return '<span class="jauge"><i style="width:' + p + '%" class="' + (p > 90 ? 'rouge' : p > 70 ? 'orange' : '') + '"></i></span>';
};

UI.htmlStocks = function () {
  const S = UI.S;
  let h = UI.onglets('data-st-onglet', [['reserve', B.t('st_onglet_reserve')], ['commander', B.t('st_onglet_commander')], ['reglages', B.t('st_onglet_reglages')]], UI.stOnglet);
  if (UI.stMsg) h += '<div class="refus' + (UI.stMsg.ok ? ' ok' : '') + '">' + UI.esc(UI.stMsg.texte) + '</div>';
  if (UI.stOnglet === 'commander') return h + UI.htmlCommander();
  if (UI.stOnglet === 'reglages') return h + UI.htmlStReglages();
  return h + UI.htmlReserve();
};

UI.htmlReserve = function () {
  const S = UI.S, R = B.DATA.stocks.rangements, I = B.DATA.stocks.ingredients;
  let h = '<p class="sous">' + UI.esc(B.t('st_reserve_intro', { date: B.texteDate(S), auto: B.t(S.stocks.auto ? 'st_auto_oui' : 'st_auto_non') })) + '</p>';
  /* ruptures du jour */
  const rup = Object.keys(S.stocks.ruptures).map(function (k) { return S.stocks.ruptures[k]; });
  if (rup.length) {
    h += '<h3>' + UI.esc(B.t('st_ruptures')) + '</h3>';
    rup.forEach(function (r) {
      h += '<div class="alerte' + (r.fin != null ? ' finie' : '') + '"><b>' + UI.esc(r.nom) + '</b> · ' + UI.esc(B.t(r.fin != null ? 'st_rupture_finie' : 'st_rupture_en_cours', { debut: B.heure(r.debut), fin: r.fin != null ? B.heure(r.fin) : '', refus: r.refus, manque: r.manque.map(function (i) { return B.stock.ing(i).nom.toLowerCase(); }).join(', ') })) +
        '<br><span class="sous">' + UI.esc(B.t(r.cause, r.vars)) + '</span></div>';
    });
  }
  /* commandes en route */
  if (S.stocks.commandes.length) {
    h += '<h3>' + UI.esc(B.t('st_en_route')) + '</h3>';
    S.stocks.commandes.slice().sort(function (a, b) { return a.arrivee - b.arrivee; }).forEach(function (c) {
      const n = Object.keys(c.lignes).reduce(function (s, i) { return s + c.lignes[i]; }, 0);
      h += '<div class="ligne-st"><span>' + UI.esc(B.DATA.stocks.fournisseurs[c.four].emoji + ' ' + B.stock.nomFournisseur(S, c.four) + (c.auto ? ' · ' + B.t('st_auto_court') : '')) + '</span><span>' +
        UI.esc(B.t('st_route_val', { n: n, total: B.euros(c.cout), heure: B.stock.texteArrivee(S, c.arrivee) })) + '</span></div>';
    });
  }
  const P = B.stock.prevision(S);
  Object.keys(R).forEach(function (r) {
    const occ = B.stock.occupation(S, r);
    h += '<h3>' + UI.esc(R[r].emoji + ' ' + R[r].nom) + ' <span class="sous">· ' + UI.esc(B.t('st_place', { n: Math.round(occ), max: R[r].capacite })) + '</span>' + UI.jaugeHtml(occ, R[r].capacite) + '</h3>';
    const ids = Object.keys(S.stocks.lots).filter(function (i) { return B.stock.info(i).rangement === r && B.stock.quantite(S, i) >= 1; }).sort(function (a, b) { return B.stock.ing(a).nom.localeCompare(B.stock.ing(b).nom); });
    if (!ids.length) { h += '<p class="sous">' + UI.esc(B.t('st_vide')) + '</p>'; return; }
    ids.forEach(function (i) {
      const q = Math.round(B.stock.quantite(S, i)), lot = S.stocks.lots[i][0], ec = Math.round(B.stock.aEcouler(S, i));
      const jours = lot.dlc - S.jour, p = P[i] || 0;
      let badges = '';
      if (ec >= 1) badges += '<span class="badge rouge">' + UI.esc(B.t('st_badge_ecouler', { n: ec })) + '</span>';
      if (p && q < p) badges += '<span class="badge orange">' + UI.esc(B.t('st_badge_bas')) + '</span>';
      if (B.stock.enSaison(S, i)) badges += '<span class="badge veg">' + UI.esc(B.t('st_badge_saison')) + '</span>';
      h += '<div class="ligne-st"><span><b>' + UI.esc(B.stock.ing(i).emoji ? B.stock.ing(i).emoji + ' ' : '') + UI.esc(B.stock.ing(i).nom) + '</b> ' + badges + '<br><span class="sous">' +
        UI.esc(B.t('st_lot', { dlc: jours <= 0 ? B.t('st_dlc_aujourdhui') : jours === 1 ? B.t('st_dlc_demain') : B.t('st_dlc_jours', { n: jours }), prix: B.prix(lot.prix), four: B.stock.nomFournisseur(S, lot.four) })) +
        '</span></span><span class="qte"><b>' + q + '</b><span class="sous">' + UI.esc(p ? B.t('st_par_jour', { n: Math.round(p) }) : '') + '</span></span></div>';
    });
  });
  const b = S.bilan;
  if (b && b.jour === S.jour - 1 || S.stats.jour.gaspillage) h += '<p class="sous">' + UI.esc(B.t('st_gaspillage_matin', { n: S.stats.jour.gaspillagePortions || 0, valeur: B.euros(S.stats.jour.gaspillage || 0) })) + '</p>';
  return h;
};

/* Panier proposé : ce qu'il manque pour tenir jusqu'à la prochaine commande, chez ce fournisseur. */
UI.proposer = function (four) {
  const S = UI.S, b = B.stock.besoins(S), l = {};
  for (const i in b) if (B.stock.fourOk(four, i)) l[i] = Math.ceil(b[i] / 5) * 5;
  return l;
};
UI.totalPanier = function () {
  const S = UI.S, F = B.DATA.stocks.fournisseurs[UI.panier.four];
  let t = 0, n = 0;
  for (const i in UI.panier.lignes) { const q = UI.panier.lignes[i]; if (q > 0) { t += q * B.stock.prixAchat(S, i, UI.panier.four); n += q; } }
  return { total: B.r2(t + (n ? F.frais : 0)), n: n };
};

UI.htmlCommander = function () {
  const S = UI.S, FS = B.DATA.stocks.fournisseurs, R = B.DATA.stocks.rangements;
  if (!UI.panier) UI.panier = { four: S.stocks.habituel, lignes: {} };
  const four = UI.panier.four;
  let h = '<div class="fours">';
  Object.keys(FS).forEach(function (f) {
    const F = FS[f];
    h += '<button type="button" class="four' + (f === four ? ' actif' : '') + '" data-st-four="' + f + '"><b>' + UI.esc(F.emoji + ' ' + B.stock.nomFournisseur(S, f)) + '</b>' +
      '<span class="sous">' + UI.esc(B.t('st_four_val', { type: F.type, delai: B.t('st_delai_' + f), frais: B.euros(F.frais), origine: B.stock.origine(S, f) || '' })) + '</span></button>';

   Le guide n'est lancé que pour une partie créée depuis « Nouvelle partie » (S.tuto) : les parties en cours n'y sont jamais forcées. */

/* ---------- Guide pas à pas ---------- */
UI.TUTO = [
  { cible: null }, { cible: 'vitesses' }, { cible: 'btn-equipe' }, { cible: 'salle-zone' }, { cible: 'btn-carte' },

];
UI.tutoActif = function () { return !!(UI.S && UI.S.tuto && !UI.S.tuto.fini); };

  if (!UI.S) return;

};

UI.cacherCibles = function () { document.querySelectorAll('.tuto-cible').forEach(function (e) { e.classList.remove('tuto-cible'); }); };

UI.montrerTuto = function () {
  const S = UI.S, el = UI.$('tuto');
  if (!UI.tutoActif()) { UI.fermerTuto(); return; }
  const n = Math.max(0, Math.min(UI.TUTO.length - 1, S.tuto.etape | 0)), E = UI.TUTO[n], dernier = n === UI.TUTO.length - 1;
  S.tuto.etape = n;
  if (UI.voletOuvert) UI.fermerVolet();
  UI.pause('tuto', true);
  UI.cacherCibles();
  const c = B.objectifs.courant(S);
  let h = '<div class="carte-tuto" role="dialog" aria-live="polite"><p class="tuto-etape">' + UI.esc(B.t('tuto_etape', { n: n + 1, sur: UI.TUTO.length })) + '</p>';
  h += '<h2>' + UI.esc(B.t('tuto_' + n + '_titre')) + '</h2>';
  h += '<p class="tuto-texte">' + UI.esc(B.t('tuto_' + n + '_texte', { objectif: c ? B.t('obj_' + c.id) : '' })) + '</p>';
  h += '<div class="rang">';
  if (n > 0) h += '<button type="button" class="gros" data-tuto="retour">' + UI.esc(B.t('tuto_retour')) + '</button>';
  h += '<button type="button" class="gros principal" data-tuto="suivant">' + UI.esc(B.t(dernier ? 'tuto_fin' : 'tuto_suivant')) + '</button></div>';
  if (!dernier) h += '<button type="button" class="gros discret" data-tuto="passer">' + UI.esc(B.t('tuto_passer')) + '</button>';
  el.innerHTML = h + '</div>';
  el.hidden = false;
  el.className = '';
  const cibles = (E.cible || '').split(' ').filter(Boolean).map(UI.$).filter(Boolean);
  cibles.forEach(function (x) { x.classList.add('tuto-cible'); });
  el.classList.toggle('sans-cible', !cibles.length);
  /* la carte se met là où elle ne cache pas le bouton montré */
  if (cibles.length) {
    const r = cibles[0].getBoundingClientRect(), W = window.innerWidth, H = window.innerHeight;
    if (r.height > H * 0.5) el.classList.add(r.left + r.width / 2 < W / 2 ? 'a-droite' : 'a-gauche');
    else if (r.top < H / 3) el.classList.add('en-bas');
    else if (r.left > W / 2) el.classList.add('a-gauche');
    else el.classList.add('en-haut');
  }
  UI.sauver();
};

UI.fermerTuto = function () {
  const el = UI.$('tuto');
  UI.cacherCibles();
  el.hidden = true; el.innerHTML = '';
  UI.pause('tuto', false);

UI.finirTuto = function () {
  const S = UI.S;
  if (S && S.tuto) S.tuto.fini = true;

/* ==== src/interface/sons.js ==== */
/* sons.js (v1.0) — des sons simples et doux, fabriqués par le navigateur (comme l'ancien jeu : pas de fichier à charger).
   Coupés au départ (choix prudent : téléphone dans un lieu public, et les navigateurs bloquent le son avant un premier toucher).
   Réglages gardés sur le téléphone : son oui / non, volume de 1 à 10. */
UI.sons = { ctx: null, maitre: null, dernier: {}, vu: null };

UI.sons.debloquer = function () {
  if (!UI.reglages.son) return;
  try {
    if (!UI.sons.ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      UI.sons.ctx = new C();
      UI.sons.maitre = UI.sons.ctx.createGain();
      UI.sons.maitre.connect(UI.sons.ctx.destination);
    }
    if (UI.sons.ctx.state !== 'running') UI.sons.ctx.resume();
    UI.sons.maitre.gain.value = UI.reglages.volume / 10;
  } catch (e) { /* pas de son sur cet appareil */ }
};

UI.sons.note = function (f, d, type, v, t0) {
  const c = UI.sons.ctx, t = c.currentTime + (t0 || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.07, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(UI.sons.maitre); o.start(t); o.stop(t + d + 0.02);
};

/* Les sons de l'ancien jeu (mêmes notes), sauf « oups », plus doux que le bruit d'erreur d'origine. */
UI.sons.liste = {
  caisse: function (n) { n(1568, 0.1, 'square', 0.02, 0); n(2093, 0.28, 'sine', 0.05, 0.06); },
  evenement: function (n) { n(740, 0.1, 'triangle', 0.07); n(988, 0.1, 'triangle', 0.07, 0.11); n(740, 0.1, 'triangle', 0.07, 0.22); },
  bravo: function (n) { n(523, 0.12, 'triangle', 0.06); n(659, 0.12, 'triangle', 0.06, 0.1); n(784, 0.12, 'triangle', 0.06, 0.2); n(1047, 0.3, 'triangle', 0.07, 0.3); },
  oups: function (n) { n(220, 0.22, 'triangle', 0.06); n(185, 0.3, 'triangle', 0.05, 0.12); },
  ding: function (n) { n(1319, 0.35, 'sine', 0.06); n(1760, 0.5, 'sine', 0.045, 0.08); },
  clic: function (n) { n(700, 0.05, 'sine', 0.04); }
};
UI.sons.jouer = function (nom) {
  if (!UI.reglages.son || !UI.sons.ctx || UI.sons.ctx.state !== 'running') return;
  const now = Date.now(), ecart = nom === 'clic' ? 60 : nom === 'caisse' ? 400 : 250;
  if (UI.sons.dernier[nom] && now - UI.sons.dernier[nom] < ecart) return;
  UI.sons.dernier[nom] = now;
  try { UI.sons.liste[nom](UI.sons.note); } catch (e) { /* tant pis */ }
};

/* Appelé à chaque image : on regarde ce qui a changé dans la partie et on joue le son qui va avec. */
UI.sons.surveiller = function (S) {
  if (!S) { UI.sons.vu = null; return; }
  const st = S.stats.jour;
  const now = { S: S, jour: S.jour, recettes: st.recettes, repartis: st.repartis, attente: S.cal && S.cal.attente ? S.cal.attente.id + ':' + S.cal.attente.minute : '',
    objectifs: S.objectifs ? Object.keys(S.objectifs.faits).length : 0, michelin: !!(S.michelin && S.michelin.etoile), fin: !!S.finJour };
  const v = UI.sons.vu;
  UI.sons.vu = now;
  if (!v || v.S !== S || v.jour !== now.jour) return;
  if (now.michelin && !v.michelin) UI.sons.jouer('bravo');
  else if (now.objectifs > v.objectifs) UI.sons.jouer('bravo');
  else if (now.attente && now.attente !== v.attente) UI.sons.jouer('evenement');
  else if (now.fin && !v.fin) UI.sons.jouer('ding');
  else if (now.repartis > v.repartis) UI.sons.jouer('oups');
  else if (now.recettes > v.recettes) UI.sons.jouer('caisse');
};

UI.htmlReglagesSon = function () {
  const R = UI.reglages;
  let h = '<div class="ligne-reglage"><span>' + UI.esc(B.t('menu_son')) + '</span>' +
    '<button type="button" class="bascule' + (R.son ? ' on' : '') + '" data-action="son">' + UI.esc(B.t(R.son ? 'menu_oui' : 'menu_non')) + '</button></div>';
  h += '<div class="ligne-reglage"><span>' + UI.esc(B.t('menu_volume')) + '</span><span class="volume">' +
    '<button type="button" class="petit-btn gros-mini" data-action="volume" data-pas="-1" aria-label="' + UI.esc(B.t('menu_volume_moins')) + '"' + (R.volume <= 1 ? ' disabled' : '') + '>−</button>' +
    '<b>' + R.volume + ' / 10</b>' +
    '<button type="button" class="petit-btn gros-mini" data-action="volume" data-pas="1" aria-label="' + UI.esc(B.t('menu_volume_plus')) + '"' + (R.volume >= 10 ? ' disabled' : '') + '>+</button></span></div>';
  if (!R.son) h += '<p class="sous">' + UI.esc(B.t('menu_son_note')) + '</p>';
  return h;
};

UI.initSons = function () {
  ['pointerdown', 'touchend', 'keydown'].forEach(function (ev) { document.addEventListener(ev, UI.sons.debloquer, { passive: true }); });
  document.addEventListener('click', function (e) { if (e.target.closest('button')) UI.sons.jouer('clic'); }, true);
};

/* ==== src/interface/stockage.js ==== */
/* stockage.js — rangement de la partie sur le téléphone. Cases propres à ce lien (TEST ou OFFICIEL).
   Les cases de l'ancien jeu (« bistrot_… ») sont seulement lues, jamais écrites. */
UI.cles = function () { return B.cles(B.CANAL); };

UI.lireCase = function (cle) { try { return localStorage.getItem(cle); } catch (e) { return null; } };
UI.ecrireCase = function (cle, valeur) {
  if (cle.indexOf('bistrotjeu.') !== 0) throw new Error('écriture interdite hors des cases de Bistrot');
  localStorage.setItem(cle, valeur);
};

UI.sauver = function () {
  if (!UI.S) return;
  const K = UI.cles();
  try {
    const avant = UI.lireCase(K.partie);
    const txt = B.serialiser(UI.S);
    if (avant && avant !== txt) UI.ecrireCase(K.secours, avant);
    UI.ecrireCase(K.partie, txt);
    UI.derniereSauvegarde = UI.S.minute;
  } catch (e) {
    if (!UI._alerteStockage) { UI._alerteStockage = true; B.message(UI.S, 'erreur_stockage'); }
  }
};

/* Renvoie { partie } ou { erreur } ; essaie la copie de secours si la sauvegarde principale est abîmée. */
UI.chargerPartie = function () {
  const K = UI.cles();
  const txt = UI.lireCase(K.partie);
  if (!txt) return {};
  const r = B.relire(txt);
  if (r.partie || r.erreur === 'erreur_sauvegarde_recente') return r;
  const sec = UI.lireCase(K.secours);
  if (sec) { const r2 = B.relire(sec); if (r2.partie) return r2; }
  return r;
};

UI.chargerReglages = function () {
  try { const r = JSON.parse(UI.lireCase(UI.cles().reglages) || '{}'); if (typeof r.pauseAuto === 'boolean') UI.reglages.pauseAuto = r.pauseAuto; if (typeof r.son === 'boolean') UI.reglages.son = r.son; if (r.volume >= 1 && r.volume <= 10) UI.reglages.volume = Math.round(r.volume); } catch (e) { /* réglages par défaut */ }
};
UI.sauverReglages = function () {
  try { UI.ecrireCase(UI.cles().reglages, JSON.stringify(UI.reglages)); } catch (e) { /* tant pis */ }
};

/* ==== src/interface/accueil.js ==== */
/* accueil.js — écran d'accueil : continuer, nouvelle partie, reprendre une partie de l'ancien jeu. */
UI.montrerAccueil = function (vue) {
  UI.pause('accueil', true);
  if (UI.fermerTuto && !UI.$('tuto').hidden) UI.fermerTuto();   /* le guide reprendra à la même étape */
  const el = UI.$('accueil');
  el.hidden = false;
  vue = vue || 'menu';
  let h = '<div class="carte-accueil"><h1>' + UI.esc(B.t('jeu_nom')) + '</h1>';
  const sousTitre = B.t('canal_' + B.CANAL);
  h += '<p class="sous">' + UI.esc(B.t('jeu_sous_titre')) + (sousTitre ? ' · <b>' + UI.esc(sousTitre) + '</b>' : '') + '</p>';
  if (vue === 'menu') {
    if (UI.S) h += '<button type="button" class="gros principal" data-a="continuer">' + UI.esc(B.t(UI.S.faillite ? 'accueil_continuer_faillite' : 'accueil_continuer', { nom: UI.S.nom, lieu: B.lieu(UI.S.lieu).nom, jour: UI.S.jour, niveau: UI.texteNiveau(UI.S) })) + '</button>';
    if (UI.erreurChargement) h += '<p class="alerte">' + UI.esc(B.t(UI.erreurChargement)) + '</p>';
    h += '<button type="button" class="gros' + (UI.S ? '' : ' principal') + '" data-a="nouvelle">' + UI.esc(B.t('accueil_nouvelle')) + '</button>';
    if (UI.anciennes().length) h += '<button type="button" class="gros" data-a="ancien">' + UI.esc(B.t('accueil_ancien')) + '</button>';
  } else if (vue === 'nouvelle') {
    h += '<h2>' + UI.esc(B.t('nouvelle_titre')) + '</h2>';
    h += '<label>' + UI.esc(B.t('nouvelle_nom')) + '<input id="n-nom" maxlength="40" value="' + UI.esc(B.t('nouvelle_nom_defaut')) + '"></label>';
    h += '<label>' + UI.esc(B.t('nouvelle_lieu')) + '<select id="n-lieu">';
    ['france', 'outre-mer', 'monde'].forEach(function (gr) {
      h += '<optgroup label="' + UI.esc(B.t('nouvelle_groupe_' + gr)) + '">';
      B.DATA.lieux.lieux.filter(function (l) { return l.groupe === gr; }).forEach(function (l) {
        h += '<option value="' + l.id + '">' + UI.esc(l.nom) + '</option>';
      });
      h += '</optgroup>';
    });
    h += '</select></label>';
    h += '<label>' + UI.esc(B.t('nouvelle_niveau')) + '</label><div class="niveaux">' + ['facile', 'normal', 'difficile'].map(function (n) {
      return '<button type="button" class="niveau' + (n === UI.niveauChoisi ? ' actif' : '') + '" data-a="niveau" data-n="' + n + '">' + UI.esc(B.t('niveau_' + n)) + '</button>';
    }).join('') + '</div><p class="niveau-texte" id="n-niveau-texte">' + UI.esc(UI.texteChoixNiveau(UI.niveauChoisi)) + '</p>';
    h += '<div class="rang"><button type="button" class="gros" data-a="menu">' + UI.esc(B.t('accueil_retour')) + '</button>';
    h += '<button type="button" class="gros principal" data-a="ouvrir">' + UI.esc(B.t('nouvelle_ouvrir')) + '</button></div>';
  } else if (vue === 'ancien') {
    h += '<h2>' + UI.esc(B.t('ancien_titre')) + '</h2>';
    h += '<p class="rassure">' + UI.esc(B.t('ancien_rassure')) + '</p>';
    const A = UI.anciennes();
    if (!A.length) h += '<p>' + UI.esc(B.t('ancien_aucune')) + '</p>';
    A.forEach(function (a, i) {
      const r = a.resume;
      const titre = a.emplacement ? B.t('ancien_emplacement', { n: a.emplacement }) : B.t('ancien_derniere');
      h += '<div class="ancienne"><div><b>' + UI.esc(titre) + (a.derniere && a.emplacement ? ' · ' + UI.esc(B.t('ancien_derniere')) : '') + '</b><br>' +
        UI.esc(B.t('ancien_ligne', { nom: r.nom, lieu: r.lieuNom, jour: r.jour, argent: B.euros(r.argent) })) + '</div>' +
        '<button type="button" class="gros principal" data-a="importer" data-i="' + i + '">' + UI.esc(B.t('ancien_reprendre')) + '</button></div>';
    });
    h += '<p class="petit">' + UI.esc(B.t('ancien_contenu')) + '</p>';
    h += '<button type="button" class="gros" data-a="menu">' + UI.esc(B.t('accueil_retour')) + '</button>';
  }
  h += '</div>';
  el.innerHTML = h;
  el.scrollTop = 0;
};

UI.niveauChoisi = 'facile';
UI.texteChoixNiveau = function (n) {
  const N = B.DATA.argent.niveaux[n];
  return B.t('niveau_texte_' + n, { capital: B.euros(N.capital), pret: N.pret ? B.euros(N.pret.montant) : '', mensualite: N.pret ? B.euros(B.argent.mensualite(N.pret.montant, N.pret.tauxAnnuel, N.pret.mois)) : '', concurrence: Math.round((1 - N.affluence) * 100) });
};
UI.anciennes = function () { return B.ancien.trouver(UI.lireCase); };

UI.remplacerOk = function () {
  if (!UI.S) return true;
  if (UI.S.faillite) return true;   /* une copie de la partie en faillite est déjà gardée à part */
  return window.confirm(B.t('nouvelle_remplace', { nom: UI.S.nom, jour: UI.S.jour }));
};

UI.cacherAccueil = function () {
  UI.$('accueil').hidden = true;
  UI.pause('accueil', false);
  UI.majBarre();
};

UI.demarrer = function (S, cle, vars) {
  UI.S = S;
  UI.selection = null;
  UI.toasts = [];
  B.flux.length = 0;
  if (cle) B.message(S, cle, vars);
  UI.sauver();
  UI.cacherAccueil();
  UI.majDetail();
  UI.majPlacement();
  UI.majFin();
  if (UI.tutoActif()) UI.montrerTuto();
  else if (!S.ouvert) UI.ouvrirVolet('equipe');
};

UI.initAccueil = function () {
  UI.$('accueil').addEventListener('click', function (e) {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    const a = b.dataset.a;
    if (a === 'continuer') { UI.cacherAccueil(); UI.majPlacement(); UI.$('fin').hidden = true; UI.majFin(); if (UI.tutoActif()) UI.montrerTuto(); else if (!UI.S.ouvert && !UI.S.faillite) UI.ouvrirVolet('equipe'); }
    else if (a === 'niveau') {
      UI.niveauChoisi = b.dataset.n;
      UI.$('accueil').querySelectorAll('.niveau').forEach(function (x) { x.classList.toggle('actif', x.dataset.n === UI.niveauChoisi); });
      UI.$('n-niveau-texte').textContent = UI.texteChoixNiveau(UI.niveauChoisi);
    }
    else if (a === 'nouvelle' || a === 'ancien' || a === 'menu') UI.montrerAccueil(a);
    else if (a === 'ouvrir') {
      if (!UI.remplacerOk()) return;
      const S = B.creerPartie({ nom: UI.$('n-nom').value || B.t('nouvelle_nom_defaut'), lieu: UI.$('n-lieu').value, difficulte: UI.niveauChoisi, date: new Date().toISOString() });
      S.tuto = { etape: 0 };   /* v0.9 : le guide pas à pas, seulement pour une partie nouvelle */
      UI.erreurChargement = null;
      UI.demarrer(S, 'msg_bienvenue', { chez: B.chezNom(S.nom), heure: B.heure(B.DATA.clients.affluence[0].de) });
    } else if (a === 'importer') {
      const choix = UI.anciennes()[+b.dataset.i];
      if (!choix || !UI.remplacerOk()) return;
      const S = B.ancien.convertir(JSON.parse(choix.texte), { cle: choix.cle, date: new Date().toISOString(), graine: Math.floor(Math.random() * 2147483647) });
      try { UI.ecrireCase(UI.cles().copieAncien, choix.texte); } catch (err) { /* la copie de réserve est un plus, pas une obligation */ }
      UI.erreurChargement = null;
      if (S.equipeReprise) B.message(S, 'msg_equipe_reprise', { n: S.equipeReprise });
      UI.demarrer(S, 'msg_import', { nom: S.nom, jour: S.jour });
    }
  });
};

/* ==== src/interface/boucle.js ==== */
/* boucle.js — démarrage, écran portrait, fin de journée, et la boucle qui fait vivre la salle. */
UI.initPortrait = function () {
  UI.$('portrait').innerHTML = '<div class="tel"></div><h2>' + UI.esc(B.t('portrait_titre')) + '</h2><p>' + UI.esc(B.t('portrait_texte')) + '</p>';
  const mq = window.matchMedia('(orientation: portrait)');
  const maj = function () { UI.pause('portrait', mq.matches); if (mq.matches) UI.sauver(); };
  if (mq.addEventListener) mq.addEventListener('change', maj); else mq.addListener(maj);
  maj();
};

UI.majFin = function () {
  const S = UI.S, el = UI.$('fin');
  if (!S || !S.finJour || !S.bilan) { el.hidden = true; return; }
  if (!el.hidden) return;
  if (S.faillite) { UI.montrerFaillite(); return; }
  const b = S.bilan, res = b.resultat || 0, neuf = !!b.depenses;
  el.innerHTML = '<div class="carte-fin"><h2>' + UI.esc(B.t('fin_titre', { jour: b.jour })) + '</h2><div class="chiffres">' +
    '<div><b>' + b.servis + '</b><span>' + UI.esc(B.t('fin_servis')) + '</span></div>' +
    (neuf ? '<div><b class="' + (res < 0 ? 'rouge-txt' : 'vert-txt') + '">' + UI.esc(B.euros(res)) + '</b><span>' + UI.esc(B.t(res < 0 ? 'fin_perte' : 'fin_benefice')) + '</span></div>' +
      '<div><b class="' + (b.caisse < 0 ? 'rouge-txt' : '') + '">' + UI.esc(B.euros(b.caisse)) + '</b><span>' + UI.esc(B.t('fin_caisse')) + '</span></div></div>'
      : '<div><b>' + UI.esc(B.euros(b.recettes || 0)) + '</b><span>' + UI.esc(B.t('fin_recettes')) + '</span></div>' +
      '<div><b>' + UI.esc(B.prix(b.ticketMoyen || 0)) + '</b><span>' + UI.esc(B.t('fin_ticket_moyen')) + '</span></div></div>') +
    UI.htmlFinAlerte(b) + UI.htmlFinArgent(b) + UI.htmlFinAvis(b) +
    '<div class="fin-detail">' + [
      B.t('fin_d_repartis', { n: b.repartis }), B.t('fin_d_attente', { n: b.attente }),
      B.t('fin_d_cout', { cout: B.euros(b.coutMatiere || 0) }), B.t('fin_d_marge', { marge: B.euros((b.recettes || 0) - (b.coutMatiere || 0)) }),
      B.t('fin_d_renvois', { n: b.platsRenvoyes || 0 }), B.t('fin_d_pourboires', { total: B.prix(b.pourboires || 0) }),
      b.meilleurPlat ? B.t('fin_d_meilleur', { nom: b.meilleurPlat.nom, n: b.meilleurPlat.n }) : '',
      neuf ? B.t('fin_d_ticket', { total: B.prix(b.ticketMoyen || 0) }) : B.t('fin_d_achats', { total: B.euros(b.achats || 0) }), neuf ? '' : B.t('fin_d_resultat', { total: B.euros(b.resultat || 0) }),
      B.t('fin_d_gaspillage', { n: b.gaspillagePortions || 0, valeur: B.euros(b.gaspillage || 0) }),
      B.t('fin_d_mdj', { n: b.mdjVendus || 0, e: b.emporter || 0 }), B.t('fin_d_boissons', { n: b.boissons || 0 }),
      B.t('fin_d_ruptures', { n: (b.ruptures || []).length, partis: b.partisRupture || 0 }),
      b.formations && !neuf ? B.t('fin_d_formations', { total: B.euros(b.formations) }) : '',
      b.proprete ? B.t('fin_d_proprete', { avant: b.proprete.avant, apres: b.proprete.apres }) : '',
      b.partisSale ? B.t('fin_d_partis_sale', { n: b.partisSale }) : '',
      (b.absents || []).length ? B.t('fin_d_absents', { n: b.absents.map(function (x) { return x.nom.split(' ')[0]; }).join(', ') }) : '',
      b.partage ? B.t('fin_d_partage', { total: B.prix(b.partage.total), n: b.partage.n, part: B.prix(b.partage.part) }) : '',
      b.prives ? B.t('fin_d_prives', { n: b.prives }) : ''
    ].filter(Boolean).map(function (x) { return '<span>' + UI.esc(x) + '</span>'; }).join('') + '</div>' + UI.htmlFinRuptures(b) + UI.htmlFinSemaine(b) + '<p class="fin-demain">' + UI.esc(UI.texteDemain(S)) + '</p>' +
    '<button type="button" class="gros principal" id="fin-suivant">' + UI.esc(B.t('fin_suivant', { jour: b.jour + 1 })) + '</button></div>';
  el.hidden = false;
  UI.sauver();
  UI.$('fin-suivant').addEventListener('click', function () {
    B.jourSuivant(UI.S);
    el.hidden = true;
    UI.sauver();
    UI.majBarre();
    UI.majCalendrier();
    if (!UI.S.ouvert) UI.ouvrirVolet('equipe');
  });
};

UI.htmlFinRuptures = function (b) {
  const R = b.ruptures || [];
  if (!R.length) return '';
  return '<div class="fin-ruptures"><b>' + UI.esc(B.t('fin_ruptures_titre')) + '</b>' + R.slice(0, 4).map(function (r) {
    return '<span>' + UI.esc(r.nom + ' : ' + B.t(r.cause, r.vars)) + '</span>';
  }).join('') + (R.length > 4 ? '<span>…</span>' : '') + '</div>';
};

UI.boucle = function (ts) {
  const dtReel = UI._dernier == null ? 0 : Math.min(250, ts - UI._dernier);
  UI._dernier = ts;
  const S = UI.S;
  if (S) {
    const v = UI.vitesseReelle();
    if (v > 0) {
      B.avancer(S, dtReel / 1000 * v * B.DATA.regles.minutesParSeconde);
      if (UI.derniereSauvegarde == null || S.minute - UI.derniereSauvegarde >= B.DATA.regles.sauvegarde.toutesLesMinutesDeJeu || S.minute < UI.derniereSauvegarde) UI.sauver();
    }
    if (S.finJour) UI.majFin();
    UI.majEvenement();
    UI.dessin.dynamique();
    if (!UI._tDetail || ts - UI._tDetail > 250) { UI._tDetail = ts; if (S.objectifs && B.objectifs.verifier(S).length) UI.sauver(); UI.majDetail(); UI.majBarre(); UI.majCalendrier(); }
  }
  UI.sons.surveiller(S);
  UI.majMessages(Date.now());
  requestAnimationFrame(UI.boucle);
};

UI.init = function () {
  document.title = B.t('jeu_nom') + (B.CANAL === 'test' ? ' (test)' : '');
  UI.chargerReglages();
  UI.initBarre();
  UI.dessin.fond();
  UI.dessin.initTouches();
  UI.initVolets();
  UI.initAccueil();
  UI.initEquipe();
  UI.initCarte();
  UI.initStocks();
  UI.initArgent();
  UI.initCalendrier();
  UI.initAide();
  UI.initPlacement();
  UI.initPortrait();
  UI.initSons();
  const r = UI.chargerPartie();
  if (r.partie) { UI.S = r.partie; B.message(UI.S, 'msg_reprise', { nom: UI.S.nom, jour: UI.S.jour }); }
  UI.erreurChargement = r.erreur || null;
  UI.montrerAccueil();
  UI.majBarre();
  UI.majDetail();
  document.addEventListener('visibilitychange', function () {
    UI.pause('cache', document.hidden);
    if (document.hidden) UI.sauver();
  });
  window.addEventListener('pagehide', UI.sauver);
  requestAnimationFrame(UI.boucle);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne indisponible, le jeu marche quand même */ });
  }
};

document.addEventListener('DOMContentLoaded', UI.init);

})();
</script>

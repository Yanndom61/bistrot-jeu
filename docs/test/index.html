/* ==== src/moteur/cuisine.js ==== */
/* cuisine.js — la cuisine prépare les commandes. Chaque personne en cuisine prépare 2 commandes à la fois (l'apprenti 1).
   S'il n'y a personne de libre, les commandes attendent leur tour (premier arrivé, premier servi).
   Sans plongeur, les cuisiniers font aussi la vaisselle et vont moins vite. */
B.cuisine = {};

B.cuisine.avancer = function (S) {
  const cuisiniers = B.equipe.actifs(S, 'cuisine');
  if (!cuisiniers.length) return;
  const plonge = B.equipe.facteurPlonge(S);
  const enCours = {};
  S.groupes.forEach(function (g) { if (g.etat === 'cuisine' && g.cuisinier) enCours[g.cuisinier] = (enCours[g.cuisinier] || 0) + 1; });
  const attente = S.groupes.filter(function (g) { return g.etat === 'cuisine' && !g.cuisinier; })
    .sort(function (a, b) { return a.depuis - b.depuis || a.id - b.id; });
  for (const g of attente) {
    let choix = null;
    for (const c of cuisiniers) {
      const n = enCours[c.id] || 0;
      if (n < B.equipe.capaciteCuisinier(c) && (!choix || n < (enCours[choix.id] || 0) || (n === (enCours[choix.id] || 0) && c.vitesse > choix.vitesse))) choix = c;
    }
    if (!choix) break;
    enCours[choix.id] = (enCours[choix.id] || 0) + 1;
    g.cuisinier = choix.id;
    g.pret = S.minute + B.duree(S, B.DATA.clients.durees.cuisine) * B.equipe.facteurCuisine(choix) * plonge * (g.refait ? B.DATA.carte.cuissons.refaireFacteur : 1);
  }
};

/* ==== src/moteur/service.js ==== */
/* service.js — les serveurs : prendre les commandes, servir, encaisser, débarrasser. */
B.service = {};

/* Ordre de priorité : plat prêt (il refroidit), addition, commande, puis table à débarrasser. */
B.service.choisir = function (S, w) {
  let best = null;
  const prop = function (prio, depuis, tache) {
    if (!best || prio < best.prio || (prio === best.prio && depuis < best.depuis)) best = { prio: prio, depuis: depuis, tache: tache };
  };
  for (const g of S.groupes) {
    if (g.serveur) continue;
    if (g.etat === 'pret') prop(0, g.depuis, { type: 'servir', groupe: g.id });
    else if (g.etat === 'addition') prop(1, g.depuis, { type: 'addition', groupe: g.id });
    else if (g.etat === 'commande') prop(2, g.depuis, { type: 'commande', groupe: g.id });
  }
  for (const t of S.tables) {
    if (t.sale && !t.serveur) prop(3, 9999, { type: 'debarrasser', table: t.id });
  }
  return best ? best.tache : null;
};

B.service.groupe = function (S, id) { return S.groupes.find(function (g) { return g.id === id; }); };

/* Prépare les étapes d'une tâche : aller quelque part, puis agir un certain temps. */
B.service.preparer = function (S, w, tache) {
  const D = B.DATA.clients.durees, A = B.DATA.salle.allee;
  const auBord = function (ids) { return { x: B.salle.centre(ids).x, y: A }; };
  tache.etapes = [];
  if (tache.type === 'debarrasser') {
    const t = B.salle.tableDe(S, tache.table);
    t.serveur = w.id;
    tache.etapes.push({ aller: auBord([t.id]) }, { agir: D.debarrasserParTable });
  } else {
    const g = B.service.groupe(S, tache.groupe);
    g.serveur = w.id;
    const nbB = (g.commande || []).filter(function (l) { return l.cat === 'boisson'; }).length;
    if (tache.type === 'servir') tache.etapes.push({ aller: { x: B.DATA.salle.passe.x, y: A } }, { agir: D.prendrePlatPasse + nbB * B.equipe.tempsBoisson(S) }, { aller: auBord(g.tables), porte: 'assiette' }, { agir: D.poserPlat, porte: 'assiette' });
    if (tache.type === 'commande') tache.etapes.push({ aller: auBord(g.tables) }, { agir: D.prendreCommande });
    if (tache.type === 'addition') tache.etapes.push({ aller: auBord(g.tables), porte: 'addition' }, { agir: D.addition, porte: 'addition' });
  }

B.service.terminer = function (S, w) {
  const tache = w.tache, D = B.DATA.clients.durees;
  w.tache = null;
  if (tache.type === 'debarrasser') {
    const t = B.salle.tableDe(S, tache.table);
    t.sale = false; t.serveur = null;
    return;
  }
  const g = B.service.groupe(S, tache.groupe);
  if (!g) return;
  g.serveur = null;
  if (tache.type === 'commande' || tache.type === 'addition') { g.amabS = (g.amabS || 0) + (w.amabilite || 5); g.amabN = (g.amabN || 0) + 1; }
  if (tache.type === 'commande') {
    S.stats.jour.attenteCommande += S.minute - g.depuis;
    S.stats.jour.nbCommandes++;
    g.attenteCommande = S.minute - g.depuis;
    if (!g.commande && !B.carte.commander(S, g)) {
      /* plus rien à manger (ruptures) : le groupe s'en va sans payer */
      g.commande = [];
      S.stats.jour.repartis += g.taille; S.stats.jour.partisRupture = (S.stats.jour.partisRupture || 0) + g.taille;
      B.message(S, 'msg_rien_a_manger', { table: g.tables[0] });
      B.clients.partir(S, g);
      return;
    }
    g.etat = 'cuisine'; g.depuis = S.minute; g.pret = null; g.cuisinier = null;
  } else if (tache.type === 'servir') {
    if (B.carte.verifierService(S, g)) return;
    const type = B.clients.type(g.type);
    g.etat = 'mange'; g.depuis = S.minute; g.duree = B.duree(S, type.repas); g.aMange = true;
  } else if (tache.type === 'addition') {
    B.carte.payer(S, g);
    B.clients.partir(S, g);
  }
};

B.service.avancer = function (S, h) {
  const resp = B.equipe.aLePoste(S, 'resp') ? B.DATA.equipe.effets.respVitesse : 1;
  B.equipe.salle(S).forEach(function (w) {
    const f = B.equipe.facteurSalle(w) * resp, v = B.DATA.clients.vitesses.serveurs * f;
    let reste = h;
    let garde = 0;
    while (reste > 1e-9 && garde++ < 20) {
      if (!w.tache) {
        if (w.partant) return;
        const t = B.service.choisir(S, w);
        if (t) B.service.preparer(S, w, t);
        else {
          const base = B.equipe.base(S, w);
          if (!w.chemin.length && (Math.abs(w.x - base.x) > 1 || Math.abs(w.y - base.y) > 1)) w.chemin = B.salle.chemin(w, base);
          B.salle.bouger(w, v * reste);
          return;
        }
      }
      const e = w.tache.etapes[0];
      if (!e) { B.service.terminer(S, w); continue; }
      if (e.aller) {
        if (!w.chemin.length) w.chemin = B.salle.chemin(w, e.aller);
        const besoin = B.service.longueur(w) / v;
        if (besoin <= reste) { reste -= besoin; w.x = e.aller.x; w.y = e.aller.y; w.chemin = []; w.tache.etapes.shift(); }
        else { B.salle.bouger(w, v * reste); reste = 0; }
      } else if (e.agir != null) {
        if (e.agir / f <= reste) { reste -= e.agir / f; w.tache.etapes.shift(); }
        else { e.agir -= reste * f; reste = 0; }
      }
    }
  });
};

B.service.longueur = function (w) {
  let x = w.x, y = w.y, L = 0;
  for (const p of w.chemin) { L += Math.hypot(p.x - x, p.y - y); x = p.x; y = p.y; }
  return L;
};

/* ==== src/moteur/partie.js ==== */
/* partie.js — créer une partie, faire passer le temps, finir la journée. */
B.statsVides = function () {
  return { groupes: 0, arrives: 0, servis: 0, repartis: 0, fileMax: 0, attenteCommande: 0, nbCommandes: 0,
    recettes: 0, pourboires: 0, couverts: 0, tickets: 0, coutMatiere: 0, platsRenvoyes: 0, platsVendus: {},
    achats: 0, gaspillage: 0, gaspillagePortions: 0, jetes: [], ruptures: 0, partisRupture: 0, mdjVendus: 0, emporter: 0, boissons: 0,
    formations: 0, partisSale: 0 };
};

B.nouvellePartie = function (o) {
  o = o || {};
  const R = B.DATA.regles, J = B.DATA.clients.journee, P = B.DATA.salle;
  const diff = R.difficultes.facile;
  return {
    format: 'bistrot',
    version: B.VERSION_SAUVEGARDE,
    jeu: B.VERSION_JEU,
    creeLe: o.date || null,
    calendrier: { debut: (o.debut || o.date || '2026-11-25').slice(0, 10) },
    nom: (o.nom || B.t('nouvelle_nom_defaut')).trim().slice(0, 40),
    lieu: B.lieu(o.lieu || 'paris').id,
    difficulte: 'facile',
    jour: 1,
    minute: J.ouverture,
    argent: diff.capitalDepart,
    note: diff.noteDepart,
    vitesse: 1,
    graine: (o.graine != null ? o.graine : Math.floor(Math.random() * 2147483647)) | 0,
    prochainId: 1,
    tables: P.tables.map(function (t) { return { id: t.id, places: t.places, groupe: null, sale: false, serveur: null }; }),
    groupes: [],
    equipe: [],
    candidats: [],
    ouvert: false,
    placement: 'auto',
    dejaOuvert: false,
    interimAuto: !!B.DATA.equipe.interim.autoParDefaut.facile,
    equipeReprise: 0,
    carte: null,
    stocks: null,
    cagnotte: 0,
    partages: [],
    proprete: B.DATA.equipe.effets.proprete.depart,
    tickets: [],
    stats: { jour: B.statsVides(), totalServis: 0, joursJoues: 0 },
    journal: [],
    finJour: false,
    bilan: null,
    origine: null
  };
};

/* Nouvelle partie complète : le patron seul, et des candidats qui attendent leur entretien. */
B.creerPartie = function (o) {
  const S = B.nouvellePartie(o);
  B.equipe.creerPatron(S);
  B.equipe.genererDepart(S);
  B.carte.creer(S);
  B.stock.creer(S);
  return S;
};

B.ouvrir = function (S) {
  if (S.ouvert || !B.equipe.peutOuvrir(S)) return false;
  S.ouvert = true;
  S.dejaOuvert = true;
  B.message(S, 'msg_ouverture');
  return true;
};

/* Fait passer dt minutes de jeu, par petits pas d'un quart de minute. */
B.avancer = function (S, dt) {
  while (dt > 1e-9 && !S.finJour && S.ouvert) {
    const h = Math.min(0.25, dt);
    dt -= h;
    B.pas(S, h);
  }
};

B.pas = function (S, h) {
  const avant = S.minute;
  S.minute += h;
  B.DATA.clients.annonces.forEach(function (a) {
    if (avant < a.minute && S.minute >= a.minute) B.message(S, a.texte);
  });
  const parMinute = B.clients.affluence(S, S.minute) / 60;
  if (parMinute > 0 && B.hasard(S) < parMinute * h) B.clients.arrivee(S);
  B.stock.livrer(S);
  B.menuJour.emporter(S, h);
  B.clients.placer(S);
  B.clients.avancer(S, h);
  B.cuisine.avancer(S);
  B.service.avancer(S, h);
  B.equipe.departs(S);
  B.finDeJournee(S);
};

B.finDeJournee = function (S) {
  const J = B.DATA.clients.journee;
  if (S.minute >= J.finForcee && S.groupes.length) {
    S.groupes.forEach(function (g) {
      if (g.aMange && g.etat !== 'depart') { S.stats.jour.servis += g.taille; B.carte.payer(S, g); }
    });
    S.groupes = [];
    S.tables.forEach(function (t) { t.groupe = null; t.sale = false; t.serveur = null; });
    S.equipe.forEach(function (w) { w.tache = null; w.chemin = []; });
    B.message(S, 'msg_fin_forcee');
  }
  const salePasFaite = S.tables.some(function (t) { return t.sale; });
  if (S.minute >= J.fermeture && !S.groupes.length && (!salePasFaite || S.minute >= J.finForcee)) {
    S.finJour = true;
    B.stock.soir(S);
    const st = S.stats.jour;
    const net = B.planning.nettoyageDuSoir(S);
    const partage = B.planning.dernierJourDuMois(S) ? B.planning.partager(S) : null;
    S.bilan = {
      jour: S.jour, servis: st.servis, repartis: st.repartis,
      attente: st.nbCommandes ? Math.round(st.attenteCommande / st.nbCommandes) : 0,
      recettes: st.recettes, couverts: st.couverts, tickets: st.tickets, pourboires: st.pourboires,
      ticketMoyen: st.tickets ? Math.round(st.recettes / st.tickets * 100) / 100 : 0,
      coutMatiere: Math.round(st.coutMatiere * 100) / 100, platsRenvoyes: st.platsRenvoyes,
      meilleurPlat: B.carte.meilleurPlat(S),
      achats: B.r2(st.achats), gaspillage: st.gaspillage, gaspillagePortions: st.gaspillagePortions, jetes: st.jetes,
      ruptures: Object.keys(S.stocks.ruptures).map(function (id) { const r = S.stocks.ruptures[id]; return { nom: r.nom, cause: r.cause, vars: r.vars, refus: r.refus, debut: r.debut, fin: r.fin, manque: r.manque }; }),
      partisRupture: st.partisRupture, mdjVendus: st.mdjVendus, emporter: st.emporter, boissons: st.boissons,
      resultat: B.r2(st.recettes - st.achats - (st.formations || 0)), formations: B.r2(st.formations || 0), partisSale: st.partisSale || 0,
      proprete: net, partage: partage, cagnotte: S.cagnotte,
      absents: S.equipe.filter(function (p) { return p.absent; }).map(function (p) { return { nom: p.nom, pourquoi: p.absent }; }),
      autoCommande: S.stocks.derniereAuto && S.stocks.derniereAuto.jour === S.jour ? S.stocks.derniereAuto.total : 0
    };
    S.stats.totalServis += st.servis;
    S.stats.joursJoues++;
    B.message(S, 'msg_fin_service');
  }
};

B.jourSuivant = function (S) {
  const P = B.DATA.salle;
  S.jour++;
  S.minute = B.DATA.clients.journee.ouverture;
  S.stats.jour = B.statsVides();
  S.finJour = false;
  B.stock.matin(S);
  S.bilan = null;
  S.groupes = [];
  B.equipe.matin(S);
  S.tables.forEach(function (t) { t.groupe = null; t.sale = false; t.serveur = null; });
  S.equipe.forEach(function (w) { const b = B.equipe.base(S, w); w.x = b.x; w.y = b.y; w.chemin = []; w.tache = null; });
  B.equipe.nouveauxCandidats(S);
  S.ouvert = B.equipe.peutOuvrir(S);
  void P;
};

/* Contrôle de cohérence, utilisé par le simulateur et les tests. Renvoie la liste des problèmes. */
B.verifier = function (S) {
  const pb = [];
  (function scan(o, chemin) {
    if (typeof o === 'number') {
      if (!isFinite(o)) pb.push('valeur impossible à ' + chemin);
      return;
    }
    if (o && typeof o === 'object') for (const k in o) scan(o[k], chemin + '.' + k);
  })(S, 'partie');
  const st = S.stats.jour;
  if (!isFinite(S.argent)) pb.push('argent impossible');
  if (S.stocks) for (const i in S.stocks.lots) S.stocks.lots[i].forEach(function (l) { if (!(l.q >= -1e-6)) pb.push('stock négatif : ' + i); });
  ['groupes', 'arrives', 'servis', 'repartis', 'fileMax', 'attenteCommande', 'nbCommandes', 'recettes', 'pourboires', 'couverts', 'coutMatiere', 'platsRenvoyes', 'achats', 'gaspillage'].forEach(function (k) {
    if (st[k] < 0) pb.push('compteur négatif : ' + k);
  });
  if (st.servis + st.repartis > st.arrives) pb.push('plus de clients sortis que de clients entrés');
  S.tables.forEach(function (t) {
    if (t.groupe) {
      const g = S.groupes.find(function (x) { return x.id === t.groupe; });
      if (!g) pb.push('table ' + t.id + ' occupée par un groupe disparu');
      else if (!g.tables || g.tables.indexOf(t.id) < 0) pb.push('table ' + t.id + ' et groupe ' + g.id + ' ne se correspondent pas');
    }
    if (t.groupe && t.sale) pb.push('table ' + t.id + ' occupée et sale à la fois');
  });
  S.groupes.forEach(function (g) {
    const assis = ['marche', 'carte', 'commande', 'cuisine', 'pret', 'mange', 'addition'].indexOf(g.etat) >= 0;
    if (assis && !(g.tables && g.tables.length)) pb.push('groupe ' + g.id + ' sans table');
    if (assis) {
      const places = g.tables.reduce(function (s, id) { return s + B.salle.geo(id).places; }, 0);
      if (places < g.taille) pb.push('groupe ' + g.id + ' trop nombreux pour sa table');
    }
    if (['commande', 'pret', 'addition', 'cuisine'].indexOf(g.etat) >= 0 && S.minute - g.depuis > 120) pb.push('groupe ' + g.id + ' oublié depuis plus de 90 min (' + g.etat + ')');
  });
  S.equipe.forEach(function (w) {
    if (w.tache && w.tache.groupe && !S.groupes.find(function (g) { return g.id === w.tache.groupe; })) pb.push('serveur ' + w.nom + ' sert un groupe disparu');
    if (w.service === 'salle' && w.salaire < 0) pb.push('salaire négatif');
  });
  if (S.equipe.filter(function (p) { return p.patron; }).length !== 1) pb.push('il faut exactement un patron');
  S.equipe.forEach(function (p) {
    if (p.absent && (p.tache || S.groupes.some(function (g) { return g.cuisinier === p.id && g.etat === 'cuisine'; }))) pb.push(p.nom + ' travaille alors qu’il est absent');
    if (!B.equipe.aDesRepos(p)) { if (p.absent) pb.push(p.nom + ' (patron ou intérim) ne devrait pas être absent'); return; }
    if (!p.repos || p.repos.length !== 2 || (p.repos[0] + 1) % 7 !== p.repos[1]) pb.push(p.nom + ' : les 2 jours de repos ne se suivent pas');
    if (p.absent === 'repos' && !B.planning.estRepos(p, B.jourSemaine(S))) pb.push(p.nom + ' en repos un jour travaillé');
  });
  if (!(S.cagnotte >= -0.001)) pb.push('cagnotte négative');
  if (!(S.proprete >= 0 && S.proprete <= 100)) pb.push('propreté hors limites');
  S.groupes.forEach(function (g) {
    if (g.cuisinier && !S.equipe.find(function (p) { return p.id === g.cuisinier && p.service === 'cuisine'; })) pb.push('groupe ' + g.id + ' attend un cuisinier absent');
  });
  if (S.argent < 0 && S.difficulte === 'facile') pb.push('argent négatif');
  return pb;
};

/* ==== src/moteur/sauvegarde.js ==== */
/* sauvegarde.js — enregistrer et relire une partie. Chaque sauvegarde porte un numéro de version.
   Quand le format change, on ajoute une étape dans B.MIGRATIONS (de la version n à n+1) :
   ainsi chaque nouvelle version du jeu sait relire toutes les anciennes. */
B.VERSION_SAUVEGARDE = 6;

B.MIGRATIONS = {
  /* v1 → v2 (Bistrot 0.2) : l'équipe arrive. Le patron démarre seul (Léa n'est plus là), avec des candidats.
     La journée en cours repart au matin, car le service ne peut pas continuer sans cuisine. */
  1: function (S) {
    delete S.serveurs;
    S.equipe = []; S.candidats = []; S.placement = 'auto';
    S.groupes = [];
    S.tables.forEach(function (t) { t.groupe = null; t.sale = false; t.serveur = null; });
    S.minute = B.DATA.clients.journee.ouverture;
    S.stats.jour = B.statsVides();
    S.finJour = false; S.bilan = null;
    B.equipe.creerPatron(S);
    B.equipe.genererDepart(S);
    S.ouvert = false;
    B.message(S, 'msg_lea_partie');
    S.version = 2;
    return S;
  },
  /* v2 → v3 (Bistrot 0.3) : effectif de 16, intérim et renvoi. L'option d'intérim automatique prend la valeur
     par défaut de la difficulté. Les « Intérimaire » repris par erreur de l'ancien jeu (remplaçants d'un jour) partent. */
  2: function (S) {
    S.dejaOuvert = !!S.ouvert || S.jour > 1;
    S.interimAuto = !!B.DATA.equipe.interim.autoParDefaut[S.difficulte || 'facile'];
    const avant = S.equipe.length;
    S.equipe = S.equipe.filter(function (p) { return p.patron || p.nom !== 'Intérimaire'; });
    if (S.equipe.length < avant) {
      B.equipe.replacer(S);
      S.groupes.forEach(function (g) { if (g.cuisinier && !S.equipe.some(function (p) { return p.id === g.cuisinier; })) { g.cuisinier = null; g.pret = null; } if (g.serveur && !S.equipe.some(function (p) { return p.id === g.serveur; })) g.serveur = null; });
      S.tables.forEach(function (t) { if (t.serveur && !S.equipe.some(function (p) { return p.id === t.serveur; })) t.serveur = null; });
      S.ouvert = S.ouvert && B.equipe.peutOuvrir(S);
    }
    S.version = 3;
    return S;
  },
  /* v3 → v4 (Bistrot 0.4) : la carte, les prix et le paiement arrivent. Carte de départ du lieu ;
     les clients déjà attablés reçoivent leur commande (sans erreur de cuisson) et paieront à la fin. */
  3: function (S) {
    B.carte.creer(S);
    S.cagnotte = 0; S.tickets = [];
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    S.groupes.forEach(function (g) {
      if (['cuisine', 'pret', 'mange', 'addition'].indexOf(g.etat) >= 0 && !g.commande) {
        B.carte.commander(S, g);
        g.commande.forEach(function (l) { if (l.cuisson) l.servie = l.cuisson; });
      }
    });
    S.version = 4;
    return S;
  },
  /* v4 → v5 (Bistrot 0.5) : stocks, boissons, plats de saison, menu du jour. Le calendrier démarre à la date de création ;
     la carte reçoit les boissons ; premières courses livrées et payées ; les commandes déjà prises ne touchent pas la réserve. */
  4: function (S) {
    S.calendrier = { debut: (S.creeLe || '2026-11-25').slice(0, 10) };
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    B.carte.catalogue(S).forEach(function (d) {
      if (!S.carte.plats[d.id]) S.carte.plats[d.id] = { on: d.cat === 'boisson' && !d.saison, prix: B.carte.prixConseille(S, d) };
    });
    B.carte.completer(S);
    B.stock.creer(S);
    S.version = 5;
    return S;
  },
  /* v5 → v6 (Bistrot 0.6) : étape Équipe. Barmans, plongeurs et agents de nettoyage (« rôle à venir ») prennent leur poste ;
     chacun reçoit 2 jours de repos qui se suivent (personne n'est absent le jour de la reprise) ; propreté de départ ;
     la cagnotte garde son montant ; un candidat pour chaque nouveau poste ouvert à l'embauche (s'il reste une place). */
  5: function (S) {
    S.equipe.forEach(function (p) {
      const P = B.equipe.poste(p.poste);
      if (P && !p.patron) p.service = P.service;
    });
    S.equipe.forEach(function (p) {
      if (!B.equipe.aDesRepos(p)) { p.absent = null; return; }
      p.absent = null; p.formation = null; p.formations = []; p.sommelier = false; p.pourboires = 0;
      p.repos = null;
    });
    S.equipe.forEach(function (p) { if (B.equipe.aDesRepos(p)) p.repos = B.planning.choisirRepos(S, p); });
    S.partages = [];
    S.proprete = B.DATA.equipe.effets.proprete.depart;
    S.cagnotte = B.r2(S.cagnotte || 0);
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    ['barman', 'plong', 'nett', 'appr'].forEach(function (poste) {
      if (B.equipe.placeLibre(S, poste) && !S.candidats.some(function (c) { return c.poste === poste; })) S.candidats.push(B.equipe.candidat(S, poste));
    });
    B.equipe.replacer(S);
    S.version = 6;
    return S;
  }
};

B.serialiser = function (S) { return JSON.stringify(S); };

/* Relit un texte de sauvegarde. Renvoie { partie } ou { erreur: 'cle_du_texte' }. Ne modifie jamais le texte d'origine. */
B.relire = function (texte) {
  let S;
  try { S = JSON.parse(texte); } catch (e) { return { erreur: 'erreur_sauvegarde_illisible' }; }
  if (!S || S.format !== 'bistrot' || typeof S.version !== 'number') return { erreur: 'erreur_sauvegarde_illisible' };
  if (S.version > B.VERSION_SAUVEGARDE) return { erreur: 'erreur_sauvegarde_recente' };
  while (S.version < B.VERSION_SAUVEGARDE) {
    const m = B.MIGRATIONS[S.version];
    if (!m) return { erreur: 'erreur_sauvegarde_illisible' };
    S = m(S);
  }
  S.jeu = B.VERSION_JEU;
  return { partie: S };
};

/* Noms des cases de rangement du téléphone. Le lien TEST et le lien OFFICIEL ont chacun les leurs. */
B.cles = function (canal) {
  const p = 'bistrotjeu.' + canal + '.';
  return { partie: p + 'partie', secours: p + 'partie-precedente', reglages: p + 'reglages', copieAncien: p + 'copie-ancien-jeu' };
};

/* ==== src/moteur/ancien.js ==== */
/* ancien.js — lecture des parties de l'ancien jeu « Chez YaYa » (v1 à v10.2).
   Règle d'or : on LIT seulement. Aucune écriture, aucune suppression sur les cases de l'ancien jeu. */
B.ancien = {};

/* Cases utilisées par l'ancien jeu : 5 emplacements + la sauvegarde principale. */
B.ancien.cles = ['bistrot_slot1', 'bistrot_slot2', 'bistrot_slot3', 'bistrot_slot4', 'bistrot_slot5', 'bistrot_save_v1'];
B.ancien.cleActive = 'bistrot_active_slot';

B.ancien.lire = function (texte) {
  try {
    const o = JSON.parse(texte);
    if (!o || typeof o !== 'object' || typeof o.t !== 'number' || typeof o.cash !== 'number') return null;
    return o;
  } catch (e) { return null; }
};

/* Résumé lisible d'une ancienne partie. */
B.ancien.resumer = function (o) {
  const lieu = B.lieu(o.v96loc || 'paris');
  return {
    nom: (o.rName || 'Chez YaYa').trim(),
    lieu: lieu.id,
    lieuNom: lieu.nom,
    jour: Math.floor(o.t / 1440) + 1,
    argent: Math.round(o.cash * 100) / 100,
    note: typeof o.rep === 'number' && isFinite(o.rep) ? Math.round(o.rep * 100) / 100 : 3,
    versionSauvegarde: o.v || 0
  };
};

/* Crée une partie Bistrot à partir d'une ancienne partie (copie, l'originale reste intacte). */
B.ancien.convertir = function (o, infos) {
  const r = B.ancien.resumer(o);
  const S = B.nouvellePartie({ nom: r.nom, lieu: r.lieu, graine: infos && infos.graine, date: infos && infos.date });
  B.equipe.creerPatron(S);
  const n = B.ancien.reprendreEquipe(S, o);
  const patron = B.equipe.patron(S);
  if (!B.equipe.salle(S).filter(function (p) { return !p.patron; }).length) patron.service = 'salle';
  else if (!B.equipe.cuisine(S).length) patron.service = 'cuisine';
  B.equipe.replacer(S);
  B.equipe.genererDepart(S);
  S.ouvert = B.equipe.peutOuvrir(S);
  S.dejaOuvert = S.ouvert;
  B.carte.creer(S);
  const carte = B.ancien.reprendreCarte(S, o);
  S.equipeReprise = n;
  S.jour = Math.max(1, r.jour);
  S.argent = r.argent;
  S.note = Math.max(0, Math.min(5, r.note));
  B.stock.creer(S, true);
  const stocks = B.ancien.reprendreStocks(S, o);
  if (!stocks.produits) { B.stock.premieresCourses(S); B.menuJour.calculer(S); }
  S.origine = {
    jeu: 'Chez YaYa', versionSauvegarde: r.versionSauvegarde,
    cle: infos && infos.cle || null, reprisLe: infos && infos.date || null,
    reprisPourLinstant: ['nom', 'lieu', 'jour', 'argent', 'note', 'equipe', 'carte', 'stocks'],
    carte: carte, stocks: stocks
  };
  return S;
};

/* Reprend les employés lisibles de l'ancien jeu. Salaire recalculé sur la grille HCR (poste + expérience).
   Bar, plonge et nettoyage gardent leur poste. Jours de repos choisis automatiquement. Renvoie le nombre repris. */
B.ancien.reprendreEquipe = function (S, o) {
  const staff = Array.isArray(o.staff) ? o.staff : [];
  const fem = B.DATA.equipe.prenomsFemininsAncienJeu.concat(B.DATA.equipe.prenoms.filter(function (p) { return p[1] === 'f'; }).map(function (p) { return p[0]; }));
  const borne = function (v, d) { v = Math.round(+v); return isFinite(v) ? Math.max(1, Math.min(10, v)) : d; };
  const persos = { 'sérieux': 'serieux', 'souriant': 'souriant', 'ambitieux': 'ambitieux', 'discret': 'discret', 'stressé': 'stresse', 'blagueur': 'blagueur', 'posé': 'pose' };
  let n = 0;
  staff.forEach(function (s) {
    if (!s || typeof s.name !== 'string' || !s.name.trim()) return;
    if (s.tmp || (s.ct && s.ct.k === 'interim')) return; /* intérimaires d'un jour : pas repris */
    let poste = B.DATA.equipe.postes[s.post] ? s.post : (s.role === 'cook' ? 'commis' : s.role === 'waiter' ? 'serv' : null);
    if (!poste) return;
    const sub = s.sub || {}, note = borne(s.skill, 5), exp = Math.max(0, Math.min(45, Math.round(+s.exp) || 0));
    B.equipe.nouveauMembre(S, {
      nom: s.name.trim().slice(0, 40), genre: fem.indexOf(s.name.split(' ')[0]) >= 0 ? 'f' : 'm', poste: poste,
      note: note, vitesse: borne(sub.vit, note), amabilite: borne(sub.ami, note), qualite: borne(sub.qua, note),
      salaire: B.equipe.minimum(S, poste, exp), experience: exp, perso: persos[s.pers] || null
    });
    n++;
  });
  return n;
};

/* Reprend la carte de l'ancienne partie : plats présents dans Bistrot (mêmes identifiants), à la carte ou non, et leur prix.
   Les plats de saison, du menu du jour et les boissons de l'ancien jeu ne sont pas encore dans Bistrot. */
B.ancien.reprendreCarte = function (S, o) {
  const m = o && o.menu && typeof o.menu === 'object' ? o.menu : null;
  const r = { lus: 0, ignores: 0, ajustes: 0 };
  if (!m) return r;
  const P = B.DATA.carte.prix;
  let touche = false;
  B.carte.catalogue(S).forEach(function (d) {
    const a = m[d.id];
    if (!a || typeof a !== 'object' || typeof a.on !== 'boolean') return;
    if (!touche) {
      /* on repart de zéro pour chaque catégorie présente dans l'ancienne carte */
      const presentes = {};
      B.carte.catalogue(S).forEach(function (x) { if (m[x.id] && typeof m[x.id].on === 'boolean') presentes[x.cat] = 1; });
      B.carte.TOUTES.forEach(function (c) { if (presentes[c]) B.carte.surCarte(S, c).forEach(function (id) { S.carte.plats[id].on = false; }); });
      touche = true;
    }
    S.carte.plats[d.id].on = a.on && B.carte.enSaison(S, d);
    const conseille = B.carte.prixConseille(S, d), prix = +a.price;
    if (isFinite(prix) && prix >= P.minimum && prix <= conseille * P.maxFoisConseille) S.carte.plats[d.id].prix = Math.round(prix * 2) / 2;
    r.lus++;
  });
  if (!touche) return r;
  Object.keys(m).forEach(function (id) { if (m[id] && m[id].on && !S.carte.plats[id]) r.ignores++; });
  const avant = JSON.stringify(B.carte.surCarte(S));
  B.carte.completer(S);
  if (JSON.stringify(B.carte.surCarte(S)) !== avant) r.ajustes = 1;
  return r;
};

/* Reprend la réserve de l'ancienne partie : quantités, dates limites (lots), prix payés, commandes en route,
   commande automatique. Les produits que Bistrot ne connaît pas sont ignorés. Renvoie un résumé. */
B.ancien.reprendreStocks = function (S, o) {
  const r = { produits: 0, portions: 0, perimes: 0, commandes: 0 };
  if (!o || !o.stock || typeof o.stock !== 'object') return r;
  const jourAncien = Math.floor((+o.t || 0) / 1440);
  S.stocks.lots = {};
  for (const i in o.stock) {
    const st = o.stock[i];
    if (!B.DATA.stocks.ingredients[i] || !st || !(+st.q >= 1)) continue;
    const prix = isFinite(+st.cost) && +st.cost > 0 ? B.r2(+st.cost) : B.stock.prixAchat(S, i, 'grossiste');
    const lots = Array.isArray(o.lots && o.lots[i]) ? o.lots[i].filter(function (l) { return l && +l.q > 0 && isFinite(+l.exp); }) : [];
    let reste = Math.floor(+st.q);
    lots.sort(function (a, b) { return a.exp - b.exp; }).forEach(function (l) {
      const q = Math.min(reste, Math.floor(+l.q));
      if (q <= 0) return;
      const dlc = S.jour + (Math.floor(+l.exp) - jourAncien);
      if (dlc < S.jour) { r.perimes += q; reste -= q; return; }
      B.stock.lots(S, i).push({ q: q, dlc: dlc, prix: prix, four: 'grossiste' });
      reste -= q;
    });
    if (reste > 0) B.stock.lots(S, i).push({ q: reste, dlc: S.jour + B.stock.info(i).dlc - 1, prix: prix, four: 'grossiste' });
    B.stock.lots(S, i).sort(function (a, b) { return a.dlc - b.dlc; });
    r.produits++; r.portions += Math.floor(+st.q) - 0;
  }
  r.portions -= r.perimes;
  const F = { marche: 'marche', gros: 'grossiste', disc: 'discount', bio: 'bio' };
  (Array.isArray(o.orders) ? o.orders : []).forEach(function (c) {
    if (!c || !c.items) return;
    const lignes = {}, prix = {};
    for (const i in c.items) if (B.DATA.stocks.ingredients[i] && +c.items[i] > 0) { lignes[i] = Math.floor(+c.items[i]); prix[i] = B.r2(+(c.unit && c.unit[i]) || B.stock.prixAchat(S, i, 'grossiste')); }
    if (!Object.keys(lignes).length) return;
    S.stocks.commandes.push({ id: S.prochainId++, four: F[c.sup] || 'grossiste', lignes: lignes, prix: prix, cout: B.r2(+c.cost || 0), passee: B.maintenant(S), arrivee: B.maintenant(S), auto: false });
    r.commandes++;
  });
  if (o.auto && typeof o.auto === 'object') S.stocks.auto = Object.keys(o.auto).some(function (i) { return o.auto[i] && o.auto[i].on; });
  B.stock.livrer(S, true);
  B.menuJour.calculer(S);
  return r;
};

/* Liste les anciennes parties trouvées, sans doublon (la sauvegarde principale recopie souvent un emplacement). */
B.ancien.trouver = function (lireCase) {
  const vues = {}, out = [];
  let active = null;
  try { active = lireCase(B.ancien.cleActive); } catch (e) { active = null; }
  B.ancien.cles.forEach(function (cle) {
    let txt = null;
    try { txt = lireCase(cle); } catch (e) { txt = null; }
    if (!txt) return;
    const o = B.ancien.lire(txt);
    if (!o) return;
    if (vues[txt]) return;
    vues[txt] = true;
    const n = cle.indexOf('slot') >= 0 ? +cle.slice(-1) : null;
    out.push({ cle: cle, emplacement: n, derniere: n === null || String(n) === String(active), texte: txt, resume: B.ancien.resumer(o) });
  });
  return out;
};

      bas += '<circle cx="' + (geo.x - 12) + '" cy="' + (geo.y - 8) + '" r="9" fill="#f4f4f4" stroke="#999" stroke-width="2"/><circle cx="' + (geo.x + 14) + '" cy="' + (geo.y + 10) + '" r="9" fill="#f4f4f4" stroke="#999" stroke-width="2"/>';
    }
    if (tablesChoisies.indexOf(t.id) >= 0) {
      const c = B.salle.taille(geo.places) + 14;
      haut += '<rect x="' + (geo.x - c / 2) + '" y="' + (geo.y - c / 2) + '" width="' + c + '" height="' + c + '" rx="12" fill="none" stroke="#1d6fd8" stroke-width="5"/>';
    }
  });
  /* Numéros de table */
  P.tables.forEach(function (t) {
    haut += '<text x="' + t.x + '" y="' + (t.y + 11) + '" class="num">' + t.id + '</text>';
  });
  /* Clients */
  let rangFile = 0, nbFile = 0, touchesFile = '';
  const manuel = S.placement === 'manuel' && S.ouvert;
  S.groupes.forEach(function (g) {
    const assis = ['carte', 'commande', 'cuisine', 'pret', 'mange', 'addition'].indexOf(g.etat) >= 0;
    if (g.etat === 'file') {
      nbFile++;
      const yf = UI.dessin.yFile(S, rangFile), demi = Math.ceil(g.taille / 2) * 11;
      if (yf + demi <= 428) {
        if (UI.groupeChoisi === g.id) haut += '<rect x="' + (P.file.x - 30) + '" y="' + (yf - demi - 8) + '" width="60" height="' + (2 * demi + 16) + '" rx="10" fill="none" stroke="#1d6fd8" stroke-width="5"/>';
        bas += UI.dessin.paquet(g, P.file.x, yf);
        if (manuel) touchesFile += '<rect data-groupe="' + g.id + '" x="' + (P.file.x - 40) + '" y="' + (yf - demi - 11) + '" width="80" height="' + (2 * demi + 22) + '" fill="transparent"/>';
      }
      rangFile++;
    } else if (assis) {
      const places = [];
      g.tables.forEach(function (id) { B.salle.places(id).forEach(function (p) { places.push(p); }); });
      for (let i = 0; i < g.taille; i++) bas += UI.dessin.client(places[i].x, places[i].y, UI.dessin.couleur(g));
      if (g.etat === 'mange') g.tables.forEach(function (id) {
        const geo = B.salle.geo(id);
        bas += '<circle cx="' + geo.x + '" cy="' + (geo.y - 22) + '" r="10" fill="#fff" stroke="#ccc" stroke-width="2"/>';
      });
      const c = B.salle.centre(g.tables), geo = B.salle.geo(g.tables[0]);
      const y = geo.y < P.allee ? geo.y - 85 : geo.y + 89;
      etiq += UI.dessin.etiquette(c.x, y, B.t('etat_court_' + g.etat), UI.dessin.couleurs[UI.classeAttente(g)]);
    } else {
      bas += UI.dessin.paquet(g, g.x, g.y);
    }
  });
  S.tables.forEach(function (t) {
    if (!t.sale) return;
    const geo = B.salle.geo(t.id), y = geo.y < P.allee ? geo.y - 85 : geo.y + 89;
    etiq += UI.dessin.etiquette(geo.x, y, B.t('etat_court_sale'), UI.dessin.couleurs.sale);
  });
  if (nbFile) etiq += '<text x="22" y="' + (P.file.y - 30) + '" class="petit-txt gauche">' + UI.esc(B.t('salle_file', { n: nbFile })) + '</text>';
  /* Cuisine : veste blanche et toque */
  B.equipe.cuisine(S).forEach(function (w) {
    const x = w.x, y = w.y, occupe = S.groupes.some(function (g) { return g.cuisinier === w.id; });
    haut += '<rect x="' + (x - 11) + '" y="' + (y - 33) + '" width="22" height="14" rx="4" fill="#fff" stroke="#555" stroke-width="2"/>';
    haut += '<circle cx="' + x + '" cy="' + y + '" r="16" fill="' + (w.patron ? '#8e2a22' : '#ffffff') + '" stroke="' + (occupe ? '#d9811c' : '#555') + '" stroke-width="3"/>';
  });
  /* Bar : rond foncé cerclé de bleu, avec un verre ; plonge : rond blanc cerclé de bleu */
  B.equipe.duService(S, 'bar').forEach(function (w) {
    haut += '<circle cx="' + w.x + '" cy="' + w.y + '" r="16" fill="#1f1f1f" stroke="#5fb3d9" stroke-width="3"/>';
    haut += '<path d="M' + (w.x - 5) + ' ' + (w.y - 6) + ' h10 l-3 9 h-4 z" fill="#fff"/>';
  });
  B.equipe.duService(S, 'plonge').forEach(function (w) {
    haut += '<circle cx="' + w.x + '" cy="' + w.y + '" r="16" fill="#ffffff" stroke="#2f7fbf" stroke-width="3"/>';
    haut += '<rect x="' + (w.x - 7) + '" y="' + (w.y - 2) + '" width="14" height="12" rx="2" fill="#2f7fbf"/>';
  });
  /* Salle : rond foncé avec tablier blanc (le patron en rouge foncé) */
  B.equipe.salle(S).forEach(function (w) {
    const x = w.x.toFixed(1), y = w.y.toFixed(1);
    haut += '<circle cx="' + x + '" cy="' + y + '" r="17" fill="' + (w.patron ? '#8e2a22' : '#1f1f1f') + '" stroke="#f2c14e" stroke-width="3"/>';
    haut += '<rect x="' + (w.x - 7).toFixed(1) + '" y="' + (w.y - 2).toFixed(1) + '" width="14" height="14" rx="2" fill="#fff"/>';
    const e = w.tache && w.tache.etapes[0];
    if (e && e.porte === 'assiette') haut += '<circle cx="' + (w.x + 20).toFixed(1) + '" cy="' + (w.y - 14).toFixed(1) + '" r="10" fill="#fff" stroke="#bbb" stroke-width="2"/>';
    if (e && e.porte === 'addition') haut += '<rect x="' + (w.x + 12).toFixed(1) + '" y="' + (w.y - 26).toFixed(1) + '" width="14" height="20" fill="#fff" stroke="#bbb" stroke-width="2"/>';
  });
  const tf = UI.$('touches-file');
  if (tf._html !== touchesFile) { tf.innerHTML = touchesFile; tf._html = touchesFile; }
  const html = bas + haut + etiq;
  const dyn = UI.$('dyn');
  if (dyn._html !== html) { dyn.innerHTML = html; dyn._html = html; }
};

UI.dessin.initTouches = function () {
  UI.$('touches-file').addEventListener('click', function (e) {
    const r = e.target.closest('[data-groupe]');
    if (!r || !UI.S) return;
    const id = +r.dataset.groupe;
    UI.groupeChoisi = UI.groupeChoisi === id ? null : id;
    UI.selection = null;
    UI.majDetail(); UI.dessin.dynamique();
  });
  UI.$('touches').addEventListener('click', function (e) {
    const r = e.target.closest('[data-table]');
    if (!r || !UI.S) return;
    const id = +r.dataset.table;
    if (UI.groupeChoisi) {
      const res = B.clients.placerManuel(UI.S, UI.groupeChoisi, id);
      if (res.ok) UI.groupeChoisi = null;
      else B.flux.push({ jour: UI.S.jour, minute: Math.floor(UI.S.minute), texte: B.t(res.erreur, res.vars) });
      UI.majDetail(); UI.dessin.dynamique();
      return;
    }
    UI.selection = UI.selection === id ? null : id;
    UI.majDetail();
    UI.dessin.dynamique();
  });
};

/* ==== src/interface/messages.js ==== */
/* messages.js — notifications dans leur zone réservée (jamais sur un bouton) et Journal complet. */
UI.toasts = [];
UI.DUREE_MESSAGE = 6000;
UI.MAX_VISIBLES = 3;

UI.majMessages = function (maintenant) {
  while (B.flux.length) UI.toasts.push({ m: B.flux.shift(), fin: maintenant + UI.DUREE_MESSAGE });
  UI.toasts = UI.toasts.filter(function (t) { return t.fin > maintenant; });
  const el = UI.$('messages');
  /* On affiche jusqu'à 3 messages, moins s'ils ne tiennent pas en entier dans la zone. */
  for (let n = Math.min(UI.MAX_VISIBLES, UI.toasts.length); n >= 0; n--) {
    const visibles = UI.toasts.slice(UI.toasts.length - n).reverse();
    const caches = UI.toasts.length - n;
    let html = visibles.map(function (t) {
      return '<div class="msg"><span class="h">' + B.heure(t.m.minute) + '</span> ' + UI.esc(t.m.texte) + '</div>';
    }).join('');
    if (caches > 0) html += '<div class="msg-plus">' + UI.esc(B.t('msg_plus', { n: caches })) + '</div>';
    if (el._html === html) return;
    el.innerHTML = html;
    if (el.scrollHeight <= el.clientHeight + 1 || n === 0) { el._html = html; return; }
  }
};

UI.htmlJournal = function () {
  const J = UI.S ? UI.S.journal.slice().reverse() : [];
  if (!J.length) return '<p>' + UI.esc(B.t('journal_vide')) + '</p>';
  return '<ul class="journal">' + J.map(function (m) {
    return '<li><span class="h">' + UI.esc(B.t('journal_ligne', { jour: m.jour, heure: B.heure(m.minute) })) + '</span>' + UI.esc(m.texte) + '</li>';
  }).join('') + '</ul>';
};

/* ==== src/interface/volets.js ==== */
/* volets.js — panneaux qui s'ouvrent par-dessus la salle (Journal, Menu) et se ferment d'un geste.
   Le jeu se met en pause pendant la lecture (réglage), et reprend à la fermeture. */
UI.voletOuvert = null;

UI.ouvrirVolet = function (quoi) {
  UI.voletOuvert = quoi;
  const v = UI.$('volet');
  v.classList.toggle('large', quoi === 'equipe' || quoi === 'carte' || quoi === 'stocks');
  if (quoi === 'equipe') { UI.candidatCourant = null; UI.renvoiCourant = null; UI.renvoiRefus = null; UI.ficheCourante = null; UI.eqMsg = null; UI.eqOnglet = UI.S && UI.S.dejaOuvert ? 'equipe' : 'embauche'; UI.rafraichirEquipe(true); }
  else if (quoi === 'carte') { UI.platCourant = null; UI.carteRefus = null; UI.rafraichirCarte(true); }
  else if (quoi === 'stocks') { UI.stMsg = null; UI.rafraichirStocks(true); }
  else if (quoi === 'ticket') {
    const g = UI.S.groupes.find(function (x) { return x.id === UI.ticketGroupe; });
    UI.$('volet-titre').textContent = B.t('ticket_titre');
    UI.$('volet-corps').innerHTML = g ? UI.htmlTicket(g) : '';
  }
  else {
    UI.$('volet-titre').textContent = B.t(quoi === 'journal' ? 'journal_titre' : 'menu_titre');
    UI.$('volet-corps').innerHTML = quoi === 'journal' ? UI.htmlJournal() : UI.htmlMenu();
  }
  clearTimeout(UI._cacheVolet);
  UI.$('voile').hidden = false;
  v.hidden = false;
  requestAnimationFrame(function () { v.classList.add('ouvert'); if (quoi === 'equipe') UI.$('volet-corps').scrollTop = 0; });
  if (UI.reglages.pauseAuto) UI.pause('volet', true);
  UI.sauver();
};

UI.fermerVolet = function () {
  const v = UI.$('volet');
  v.classList.remove('ouvert');
  UI.$('voile').hidden = true;
  clearTimeout(UI._cacheVolet);
  UI._cacheVolet = setTimeout(function () { if (!v.classList.contains('ouvert')) v.hidden = true; }, 220);
  UI.voletOuvert = null;
  UI.candidatCourant = null;
  UI.renvoiCourant = null;
  UI.renvoiRefus = null;
  UI.ficheCourante = null;
  UI.eqMsg = null;
  UI.platCourant = null;
  UI.carteRefus = null;
  UI.ticketGroupe = null;
  UI.stMsg = null;
  UI.mdjChoix = null;
  UI.mdjMsg = null;
  UI.pause('volet', false);
  UI.majDetail();
};

UI.initVolets = function () {
  UI.$('volet-fermer').textContent = B.t('btn_fermer');
  UI.$('volet-fermer').addEventListener('click', UI.fermerVolet);
  UI.$('voile').addEventListener('click', UI.fermerVolet);
  UI.$('volet-corps').addEventListener('click', function (e) {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    if (b.dataset.action === 'pause-auto') {
      UI.reglages.pauseAuto = !UI.reglages.pauseAuto;
      UI.sauverReglages();
      if (!UI.reglages.pauseAuto) UI.pause('volet', false);
      UI.$('volet-corps').innerHTML = UI.htmlMenu();
    } else if (b.dataset.action === 'placement' && UI.S) {
      UI.S.placement = UI.S.placement === 'manuel' ? 'auto' : 'manuel';
      UI.groupeChoisi = null;
      UI.majPlacement(); UI.sauver();
      UI.$('volet-corps').innerHTML = UI.htmlMenu();
    } else if (b.dataset.action === 'accueil') {
      UI.fermerVolet();
      UI.sauver();
      UI.montrerAccueil();
    }
  });
  /* Glisser le volet vers la droite pour le fermer */
  let x0 = null;
  const v = UI.$('volet');
  v.addEventListener('pointerdown', function (e) { x0 = e.clientX; });
  v.addEventListener('pointerup', function (e) { if (x0 != null && e.clientX - x0 > 60) UI.fermerVolet(); x0 = null; });
  v.addEventListener('pointercancel', function () { x0 = null; });

/* Planning : qui travaille chaque jour de la semaine, et les 2 jours de repos de chacun. */
UI.htmlPlanning = function () {
  const S = UI.S, J = B.DATA.textes.jours_semaine, auj = B.jourSemaine(S);
  const jours = [1, 2, 3, 4, 5, 6, 0];
  let h = '<p>' + UI.esc(B.t('eq_planning_intro')) + '</p>';
  h += '<table class="planning"><thead><tr><th></th>' + jours.map(function (j) { return '<th' + (j === auj ? ' class="auj"' : '') + '>' + UI.esc(J[j].slice(0, 3)) + '</th>'; }).join('') + '</tr></thead><tbody>';
  const cv = {}; jours.forEach(function (j) { cv[j] = B.planning.couverture(S, j); });
  ['salle', 'bar', 'cuisine', 'plonge', 'nettoyage'].forEach(function (sv) {
    h += '<tr><th>' + UI.esc(B.t('eq_service_court_' + sv)) + '</th>' + jours.map(function (j) {
      const n = cv[j][sv] || 0, rouge = n === 0 && (sv === 'salle' || sv === 'cuisine');
      return '<td class="' + (rouge ? 'vide' : '') + (j === auj ? ' auj' : '') + '">' + n + '</td>';
    }).join('') + '</tr>';
  });
  h += '</tbody></table>';
  const trous = jours.filter(function (j) { return !cv[j].salle || !cv[j].cuisine; });
  if (trous.length) h += '<div class="alerte">' + UI.esc(B.t(S.interimAuto ? 'eq_planning_trou_interim' : 'eq_planning_trou', { jours: trous.map(function (j) { return J[j]; }).join(', ') })) + '</div>';
  const gens = S.equipe.filter(function (p) { return B.equipe.aDesRepos(p) && !p.partant; });

      '<button type="button" class="petit-btn mini gros-mini" data-eq="repos-moins" data-id="' + p.id + '" aria-label="' + UI.esc(B.t('eq_repos_avant')) + '">◀</button>' +

UI.dernierSoirDuMois = function (S) {
  for (let d = 0; d < 32; d++) if (B.mois(S, d + 1) !== B.mois(S, d)) return d;

};

UI.rafraichirEquipe = function (enHaut) {
  if (UI.voletOuvert !== 'equipe') return;
  const r = UI.renvoiCourant != null && UI.S && UI.S.equipe.find(function (x) { return x.id === UI.renvoiCourant; });
  const f = UI.ficheCourante != null && UI.S && UI.S.equipe.find(function (x) { return x.id === UI.ficheCourante; });
  UI.$('volet-titre').textContent = UI.candidatCourant ? B.t('entretien_titre', { nom: UI.candidatCourant.nom }) : r ? B.t('renvoi_titre', { nom: r.nom }) : f ? B.t('eq_fiche_titre', { nom: f.nom }) : B.t('equipe_titre');
  const corps = UI.$('volet-corps'), y = corps.scrollTop;
  corps.innerHTML = UI.htmlEquipe();
  corps.scrollTop = enHaut ? 0 : y;
};

UI.initEquipe = function () {
  UI.$('volet-corps').addEventListener('click', function (e) {
    const o = e.target.closest('[data-eq-onglet]');
    if (o && UI.voletOuvert === 'equipe') { UI.eqOnglet = o.dataset.eqOnglet; UI.eqMsg = null; UI.renvoiRefus = null; UI.rafraichirEquipe(true); return; }
    const b = e.target.closest('[data-eq]');
    if (!b || !UI.S || b.disabled) return;
    const S = UI.S, a = b.dataset.eq, c = UI.candidatCourant;
    if (a === 'ouvrir') {
      if (B.ouvrir(S)) { UI.sauver(); UI.fermerVolet(); UI.majBarre(); UI.majDetail(); }
      return;
    }
    const pid = b.dataset.id != null ? S.equipe.find(function (x) { return x.id === +b.dataset.id; }) : null;
    if (a === 'fiche') { if (pid) { UI.ficheCourante = pid.id; UI.eqMsg = null; UI.renvoiRefus = null; } UI.rafraichirEquipe(true); return; }
    if (a === 'fiche-retour') { UI.ficheCourante = null; UI.eqMsg = null; UI.renvoiRefus = null; UI.rafraichirEquipe(true); return; }
    if (a === 'repos-moins' || a === 'repos-plus') {
      if (pid && B.planning.decaler(S, pid, a === 'repos-plus' ? 1 : -1)) UI.eqMsg = { ok: true, texte: B.t('eq_repos_change', { prenom: UI.prenom(pid), a: B.DATA.textes.jours_semaine[pid.repos[0]], b: B.DATA.textes.jours_semaine[pid.repos[1]] }) };
      UI.sauver(); UI.rafraichirEquipe(); return;
    }
    if (a === 'form-inscrire' && pid) {
      const r = B.planning.inscrire(S, pid, b.dataset.f);
      UI.eqMsg = r.ok ? { ok: true, texte: B.t('eq_formation_ok', { prenom: UI.prenom(pid), formation: B.t('form_nom_' + b.dataset.f), jour: UI.prochainJourTravaille(S, pid) }) } : { ok: false, texte: B.t(r.erreur) };
      UI.sauver(); UI.majBarre(); UI.rafraichirEquipe(true); return;
    }
    if (a === 'form-annuler' && pid) {
      if (B.planning.annuler(S, pid)) UI.eqMsg = { ok: true, texte: B.t('eq_formation_annulee', { prenom: UI.prenom(pid) }) };
      UI.sauver(); UI.majBarre(); UI.rafraichirEquipe(true); return;
    }
    if (a === 'patron') { UI.renvoiRefus = null; B.equipe.changerPatron(S); UI.sauver(); UI.rafraichirEquipe(); return; }
    if (a === 'renvoyer') {
      const p = S.equipe.find(function (x) { return x.id === +b.dataset.id; });
      if (!p) return;
      const non = B.equipe.peutRenvoyer(S, p);
      if (non) { UI.renvoiRefus = { id: p.id, texte: UI.tGenre(non, p, { prenom: UI.prenom(p) }) }; UI.rafraichirEquipe(); return; }
      UI.renvoiRefus = null; UI.renvoiCourant = p.id; UI.rafraichirEquipe(true); return;
    }
    if (a === 'interim') { B.equipe.appelerInterim(S, b.dataset.sv, false); UI.sauver(); UI.rafraichirEquipe(); UI.majBarre(); UI.dessin.dynamique(); return; }
    if (a === 'interim-auto') { S.interimAuto = !S.interimAuto; UI.sauver(); UI.rafraichirEquipe(); return; }
    if (a === 'renvoi-non') { UI.renvoiCourant = null; UI.rafraichirEquipe(true); return; }
    if (a === 'renvoi-oui') {
      const p = S.equipe.find(function (x) { return x.id === UI.renvoiCourant; });
      UI.renvoiCourant = null;
      if (p) {
        const non = B.equipe.peutRenvoyer(S, p);
        if (non) UI.renvoiRefus = { id: p.id, texte: UI.tGenre(non, p, { prenom: UI.prenom(p) }) };
        else { B.equipe.renvoyer(S, p); if (UI.ficheCourante === p.id) UI.ficheCourante = null; }
      }
      UI.sauver(); UI.rafraichirEquipe(true); UI.majBarre(); UI.majDetail(); UI.dessin.dynamique();
      return;
    }
    if (a === 'entretien') {
      UI.candidatCourant = S.candidats.find(function (x) { return x.id === +b.dataset.id; }) || null;
      if (UI.candidatCourant) UI.candidatCourant.dernierMot = null;
      UI.rafraichirEquipe(true); return;
    }
    if (a === 'retour') { UI.candidatCourant = null; UI.rafraichirEquipe(true); return; }
    if (!c) return;
    if (a === 'question') B.equipe.repondre(S, c, b.dataset.q);
    else if (a === 'moins') c.offre = Math.max(c.minimum, Math.round((c.offre - 0.1) * 100) / 100);
    else if (a === 'plus') c.offre = Math.round((c.offre + 0.1) * 100) / 100;
    else if (a === 'proposer') B.equipe.proposer(S, c, c.offre);
    UI.sauver();
    UI.rafraichirEquipe(a === 'proposer');
  });
};

UI.initCarte = function () {
  UI.$('volet-corps').addEventListener('click', function (e) {
    const o = e.target.closest('[data-ca-onglet]');
    if (o && UI.voletOuvert === 'carte') { UI.carteOnglet = o.dataset.caOnglet; UI.platCourant = null; UI.carteRefus = null; UI.mdjChoix = null; UI.mdjMsg = null; UI.rafraichirCarte(true); return; }
    const b = e.target.closest('[data-ca]');
    if (!b || !UI.S || b.disabled) return;
    const S = UI.S, a = b.dataset.ca, id = b.dataset.id;
    if (a === 'mdj-changer') { UI.mdjChoix = id; UI.mdjMsg = null; UI.rafraichirCarte(true); return; }
    if (a === 'mdj-retour') { UI.mdjChoix = null; UI.mdjMsg = null; UI.rafraichirCarte(true); return; }
    if (a === 'mdj-prendre') {
      const r = B.menuJour.choisir(S, b.dataset.cat, b.dataset.id || null);
      if (r.erreur) { UI.mdjMsg = { texte: B.t(r.erreur, r.vars) }; UI.rafraichirCarte(true); return; }
      const d = b.dataset.id && B.menuJour.plat(S, b.dataset.id);
      UI.mdjChoix = null;
      UI.mdjMsg = { ok: r.portions >= B.DATA.stocks.menuDuJour.minPortions, texte: d ? B.t(r.portions >= B.DATA.stocks.menuDuJour.minPortions ? 'mdj_ok_change' : 'mdj_ok_peu', { plat: d.nom, n: r.portions }) : B.t('mdj_ok_sans_' + b.dataset.cat, { n: r.portions }) };
      UI.sauver(); UI.rafraichirCarte(true); return;
    }
    if (a === 'mdj-auto') { B.menuJour.revenirAuto(S); UI.mdjMsg = { ok: true, texte: B.t('mdj_ok_auto') }; UI.sauver(); UI.rafraichirCarte(true); return; }
    if (a === 'mdj-prix-auto') { B.menuJour.prixConseillesRemettre(S); UI.sauver(); UI.rafraichirCarte(); return; }
    if (a === 'mdj-on') { S.stocks.mdjOn = S.stocks.mdjOn === false; UI.sauver(); UI.rafraichirCarte(); return; }
    if (a === 'mdj-plus' || a === 'mdj-moins') { B.menuJour.changerPrix(S, id, a === 'mdj-plus' ? 1 : -1); UI.sauver(); UI.rafraichirCarte(); return; }
    if (a === 'fiche') { UI.platCourant = id; UI.carteRefus = null; UI.rafraichirCarte(true); return; }
    if (a === 'retour') { UI.platCourant = null; UI.carteRefus = null; UI.rafraichirCarte(true); return; }
    if (a === 'moins' || a === 'plus') { B.carte.changerPrix(S, id, a === 'plus' ? 1 : -1); UI.carteRefus = null; }
    if (a === 'basculer') {
      const non = B.carte.basculer(S, id);
      UI.carteRefus = non ? { id: id, texte: B.t(non) } : null;
    }
    UI.sauver(); UI.rafraichirCarte();
  });
  UI.$('detail').addEventListener('click', function (e) {
    const b = e.target.closest('[data-ticket]');

/* ==== src/interface/stocks.js ==== */
/* stocks.js (écran) — volet Stocks : la réserve (par rangement), passer une commande, réglages (commande automatique, marge).
   Le volet Carte reçoit aussi deux onglets : Boissons et Menu du jour. */
UI.stOnglet = 'reserve';   /* reserve | commander | reglages */
UI.panier = null;          /* { four, lignes: { ingrédient: portions } } */
UI.stMsg = null;           /* résultat de la dernière action (texte) */

UI.onglets = function (attr, liste, actif) {
  return '<div class="onglets">' + liste.map(function (o) {
    return '<button type="button" class="onglet' + (o[0] === actif ? ' actif' : '') + '" ' + attr + '="' + o[0] + '">' + UI.esc(o[1]) + '</button>';
  }).join('') + '</div>';
};
UI.jaugeHtml = function (n, max) {
  const p = Math.min(100, Math.round(n / max * 100));
  return '<span class="jauge"><i style="width:' + p + '%" class="' + (p > 90 ? 'rouge' : p > 70 ? 'orange' : '') + '"></i></span>';
};

UI.htmlStocks = function () {
  const S = UI.S;
  let h = UI.onglets('data-st-onglet', [['reserve', B.t('st_onglet_reserve')], ['commander', B.t('st_onglet_commander')], ['reglages', B.t('st_onglet_reglages')]], UI.stOnglet);

UI.htmlReserve = function () {
  const S = UI.S, R = B.DATA.stocks.rangements, I = B.DATA.stocks.ingredients;
  let h = '<p class="sous">' + UI.esc(B.t('st_reserve_intro', { date: B.texteDate(S), auto: B.t(S.stocks.auto ? 'st_auto_oui' : 'st_auto_non') })) + '</p>';

  const rup = Object.keys(S.stocks.ruptures).map(function (k) { return S.stocks.ruptures[k]; });
  if (rup.length) {
    h += '<h3>' + UI.esc(B.t('st_ruptures')) + '</h3>';
    rup.forEach(function (r) {
      h += '<div class="alerte' + (r.fin != null ? ' finie' : '') + '"><b>' + UI.esc(r.nom) + '</b> · ' + UI.esc(B.t(r.fin != null ? 'st_rupture_finie' : 'st_rupture_en_cours', { debut: B.heure(r.debut), fin: r.fin != null ? B.heure(r.fin) : '', refus: r.refus, manque: r.manque.map(function (i) { return B.stock.ing(i).nom.toLowerCase(); }).join(', ') })) +
        '<br><span class="sous">' + UI.esc(B.t(r.cause, r.vars)) + '</span></div>';
    });
  }
  /* commandes en route */
  if (S.stocks.commandes.length) {
    h += '<h3>' + UI.esc(B.t('st_en_route')) + '</h3>';
    S.stocks.commandes.slice().sort(function (a, b) { return a.arrivee - b.arrivee; }).forEach(function (c) {
      const n = Object.keys(c.lignes).reduce(function (s, i) { return s + c.lignes[i]; }, 0);
      h += '<div class="ligne-st"><span>' + UI.esc(B.DATA.stocks.fournisseurs[c.four].emoji + ' ' + B.stock.nomFournisseur(S, c.four) + (c.auto ? ' · ' + B.t('st_auto_court') : '')) + '</span><span>' +
        UI.esc(B.t('st_route_val', { n: n, total: B.euros(c.cout), heure: B.stock.texteArrivee(S, c.arrivee) })) + '</span></div>';
    });
  }
  const P = B.stock.prevision(S);
  Object.keys(R).forEach(function (r) {
    const occ = B.stock.occupation(S, r);
    h += '<h3>' + UI.esc(R[r].emoji + ' ' + R[r].nom) + ' <span class="sous">· ' + UI.esc(B.t('st_place', { n: Math.round(occ), max: R[r].capacite })) + '</span>' + UI.jaugeHtml(occ, R[r].capacite) + '</h3>';
    const ids = Object.keys(S.stocks.lots).filter(function (i) { return B.stock.info(i).rangement === r && B.stock.quantite(S, i) >= 1; }).sort(function (a, b) { return B.stock.ing(a).nom.localeCompare(B.stock.ing(b).nom); });
    if (!ids.length) { h += '<p class="sous">' + UI.esc(B.t('st_vide')) + '</p>'; return; }
    ids.forEach(function (i) {
      const q = Math.round(B.stock.quantite(S, i)), lot = S.stocks.lots[i][0], ec = Math.round(B.stock.aEcouler(S, i));
      const jours = lot.dlc - S.jour, p = P[i] || 0;
      let badges = '';
      if (ec >= 1) badges += '<span class="badge rouge">' + UI.esc(B.t('st_badge_ecouler', { n: ec })) + '</span>';
      if (p && q < p) badges += '<span class="badge orange">' + UI.esc(B.t('st_badge_bas')) + '</span>';
      if (B.stock.enSaison(S, i)) badges += '<span class="badge veg">' + UI.esc(B.t('st_badge_saison')) + '</span>';
      h += '<div class="ligne-st"><span><b>' + UI.esc(B.stock.ing(i).emoji ? B.stock.ing(i).emoji + ' ' : '') + UI.esc(B.stock.ing(i).nom) + '</b> ' + badges + '<br><span class="sous">' +
        UI.esc(B.t('st_lot', { dlc: jours <= 0 ? B.t('st_dlc_aujourdhui') : jours === 1 ? B.t('st_dlc_demain') : B.t('st_dlc_jours', { n: jours }), prix: B.prix(lot.prix), four: B.stock.nomFournisseur(S, lot.four) })) +

};

/* Panier proposé : ce qu'il manque pour tenir jusqu'à la prochaine commande, chez ce fournisseur. */
UI.proposer = function (four) {
  const S = UI.S, b = B.stock.besoins(S), l = {};
  for (const i in b) if (B.stock.fourOk(four, i)) l[i] = Math.ceil(b[i] / 5) * 5;
  return l;
};
UI.totalPanier = function () {
  const S = UI.S, F = B.DATA.stocks.fournisseurs[UI.panier.four];
  let t = 0, n = 0;
  for (const i in UI.panier.lignes) { const q = UI.panier.lignes[i]; if (q > 0) { t += q * B.stock.prixAchat(S, i, UI.panier.four); n += q; } }
  return { total: B.r2(t + (n ? F.frais : 0)), n: n };
};

  const S = UI.S, FS = B.DATA.stocks.fournisseurs, R = B.DATA.stocks.rangements;

  let h = '<div class="fours">';
  Object.keys(FS).forEach(function (f) {
    const F = FS[f];
    h += '<button type="button" class="four' + (f === four ? ' actif' : '') + '" data-st-four="' + f + '"><b>' + UI.esc(F.emoji + ' ' + B.stock.nomFournisseur(S, f)) + '</b>' +
      '<span class="sous">' + UI.esc(B.t('st_four_val', { type: F.type, delai: B.t('st_delai_' + f), frais: B.euros(F.frais), origine: B.stock.origine(S, f) || '' })) + '</span></button>';
  });
  h += '</div>';
  const off = (S.stocks.offres || []).filter(function (o) { return o.jour === S.jour; });
  if (off.length) h += '<p class="offres">' + UI.esc(B.t('st_offres', { liste: off.map(function (o) { return B.stock.ing(o.ing).nom + ' −' + Math.round(o.remise * 100) + ' % (' + B.stock.nomFournisseur(S, o.four) + ')'; }).join(' · ') })) + '</p>';
  const t = UI.totalPanier();
  h += '<div class="pied-st"><span>' + UI.esc(B.t('st_total', { n: t.n, total: B.euros(t.total), frais: B.euros(FS[four].frais), heure: B.stock.texteArrivee(S, B.maintenant(S) + FS[four].delai) })) + '</span>' +
    '<button type="button" class="gros principal" data-st="commander"' + (t.n ? '' : ' disabled') + '>' + UI.esc(B.t('st_commander')) + '</button></div>';
  h += '<div class="actions-st"><button type="button" class="petit-btn" data-st="proposer">' + UI.esc(B.t('st_proposer')) + '</button>' +
    '<button type="button" class="petit-btn" data-st="vider">' + UI.esc(B.t('st_vider')) + '</button></div>';
  const P = B.stock.prevision(S), ids = Object.keys(B.DATA.stocks.ingredients).filter(function (i) { return P[i] || UI.panier.lignes[i] || B.stock.quantite(S, i) >= 1; });

    h += '<h3>' + UI.esc(R[r].emoji + ' ' + R[r].nom) + ' <span class="sous">· ' + UI.esc(B.t('st_place_libre', { n: Math.floor(B.stock.place(S, r)) })) + '</span></h3>';
    L.forEach(function (i) {
      const ok = B.stock.fourOk(four, i), q = UI.panier.lignes[i] || 0, o = B.stock.offre(S, i, four);
      h += '<div class="ligne-st' + (ok ? '' : ' grise') + '"><span><b>' + UI.esc(B.stock.ing(i).nom) + '</b>' + (o ? ' <span class="badge rouge">−' + Math.round(o * 100) + ' %</span>' : '') +
        '<br><span class="sous">' + UI.esc(ok ? B.t('st_cmd_val', { prix: B.prix(B.stock.prixAchat(S, i, four)), stock: Math.round(B.stock.quantite(S, i)), route: Math.round(B.stock.enRoute(S, i)), jour: Math.round(P[i] || 0), dlc: B.stock.info(i).dlc }) : B.t('st_pas_chez')) + '</span></span>';
      if (ok) h += '<span class="plat-prix"><button type="button" class="petit-btn mini" data-st="moins" data-id="' + i + '">−</button><b>' + q + '</b><button type="button" class="petit-btn mini" data-st="plus" data-id="' + i + '">+</button></span>';

UI.rafraichirStocks = function (enHaut) {
  if (UI.voletOuvert !== 'stocks') return;
  UI.$('volet-titre').textContent = B.t('st_titre');
  const corps = UI.$('volet-corps'), y = corps.scrollTop;
  corps.innerHTML = UI.htmlStocks();
  corps.scrollTop = enHaut ? 0 : y;

UI.initStocks = function () {
  UI.$('btn-stocks').textContent = B.t('btn_stocks');
  UI.$('btn-stocks').addEventListener('click', function () { UI.ouvrirVolet('stocks'); });
  UI.$('volet-corps').addEventListener('click', function (e) {
    if (UI.voletOuvert !== 'stocks' || !UI.S) return;
    const S = UI.S, b = e.target.closest('[data-st],[data-st-onglet],[data-st-four],[data-st-habituel]');
    if (!b || b.disabled) return;
    let haut = false;
    if (b.dataset.stOnglet) { UI.stOnglet = b.dataset.stOnglet; UI.stMsg = null; haut = true; }
    else if (b.dataset.stFour) { UI.panier = { four: b.dataset.stFour, lignes: UI.panier ? UI.panier.lignes : {} }; }
    else if (b.dataset.stHabituel) { S.stocks.habituel = b.dataset.stHabituel; }
    else {
      const a = b.dataset.st, id = b.dataset.id, A = B.DATA.stocks.auto;
      if (a === 'plus' || a === 'moins') { const q = (UI.panier.lignes[id] || 0) + (a === 'plus' ? 5 : -5); UI.panier.lignes[id] = Math.max(0, q); UI.stMsg = null; }
      else if (a === 'proposer') { UI.panier.lignes = UI.proposer(UI.panier.four); UI.stMsg = null; }
      else if (a === 'vider') { UI.panier.lignes = {}; UI.stMsg = null; }
      else if (a === 'commander') {
        const r = B.stock.commander(S, UI.panier.four, UI.panier.lignes, false);
        if (r.erreur) UI.stMsg = { texte: B.t(r.erreur) };
        else {
          UI.stMsg = { ok: true, texte: B.t('st_commande_ok', { total: B.euros(r.cout), heure: B.stock.texteArrivee(S, r.arrivee) }) + (r.coupes ? ' ' + B.t('st_commande_coupee') : '') };
          UI.panier.lignes = {};
          UI.majBarre();
        }
        haut = true;
      }
      else if (a === 'auto') S.stocks.auto = !S.stocks.auto;
      else if (a === 'marge-plus' || a === 'marge-moins') S.stocks.marge = Math.max(0, Math.min(A.max, S.stocks.marge + (a === 'marge-plus' ? A.pas : -A.pas)));
    }
    UI.sauver(); UI.rafraichirStocks(haut);
  });
};

/* ==== src/interface/stockage.js ==== */
/* stockage.js — rangement de la partie sur le téléphone. Cases propres à ce lien (TEST ou OFFICIEL).
   Les cases de l'ancien jeu (« bistrot_… ») sont seulement lues, jamais écrites. */
UI.cles = function () { return B.cles(B.CANAL); };

UI.lireCase = function (cle) { try { return localStorage.getItem(cle); } catch (e) { return null; } };
UI.ecrireCase = function (cle, valeur) {
  if (cle.indexOf('bistrotjeu.') !== 0) throw new Error('écriture interdite hors des cases de Bistrot');
  localStorage.setItem(cle, valeur);
};

UI.sauver = function () {
  if (!UI.S) return;
  const K = UI.cles();
  try {
    const avant = UI.lireCase(K.partie);
    const txt = B.serialiser(UI.S);
    if (avant && avant !== txt) UI.ecrireCase(K.secours, avant);
    UI.ecrireCase(K.partie, txt);
    UI.derniereSauvegarde = UI.S.minute;
  } catch (e) {
    if (!UI._alerteStockage) { UI._alerteStockage = true; B.message(UI.S, 'erreur_stockage'); }
  }
};

/* Renvoie { partie } ou { erreur } ; essaie la copie de secours si la sauvegarde principale est abîmée. */
UI.chargerPartie = function () {
  const K = UI.cles();
  const txt = UI.lireCase(K.partie);
  if (!txt) return {};
  const r = B.relire(txt);
  if (r.partie || r.erreur === 'erreur_sauvegarde_recente') return r;
  const sec = UI.lireCase(K.secours);
  if (sec) { const r2 = B.relire(sec); if (r2.partie) return r2; }
  return r;
};

UI.chargerReglages = function () {
  try { const r = JSON.parse(UI.lireCase(UI.cles().reglages) || '{}'); if (typeof r.pauseAuto === 'boolean') UI.reglages.pauseAuto = r.pauseAuto; } catch (e) { /* réglages par défaut */ }
};
UI.sauverReglages = function () {
  try { UI.ecrireCase(UI.cles().reglages, JSON.stringify(UI.reglages)); } catch (e) { /* tant pis */ }
};

    const a = b.dataset.a;
    if (a === 'continuer') { UI.cacherAccueil(); UI.majPlacement(); UI.majFin(); if (!UI.S.ouvert) UI.ouvrirVolet('equipe'); }
    else if (a === 'nouvelle' || a === 'ancien' || a === 'menu') UI.montrerAccueil(a);
    else if (a === 'ouvrir') {
      if (!UI.remplacerOk()) return;
      const S = B.creerPartie({ nom: UI.$('n-nom').value || B.t('nouvelle_nom_defaut'), lieu: UI.$('n-lieu').value, date: new Date().toISOString() });
      UI.erreurChargement = null;
      UI.demarrer(S, 'msg_bienvenue', { chez: B.chezNom(S.nom), heure: B.heure(B.DATA.clients.affluence[0].de) });
    } else if (a === 'importer') {
      const choix = UI.anciennes()[+b.dataset.i];
      if (!choix || !UI.remplacerOk()) return;
      const S = B.ancien.convertir(JSON.parse(choix.texte), { cle: choix.cle, date: new Date().toISOString(), graine: Math.floor(Math.random() * 2147483647) });
      try { UI.ecrireCase(UI.cles().copieAncien, choix.texte); } catch (err) { /* la copie de réserve est un plus, pas une obligation */ }
      UI.erreurChargement = null;
      if (S.equipeReprise) B.message(S, 'msg_equipe_reprise', { n: S.equipeReprise });
      UI.demarrer(S, 'msg_import', { nom: S.nom, jour: S.jour });
    }
  });
};

/* ==== src/interface/boucle.js ==== */
/* boucle.js — démarrage, écran portrait, fin de journée, et la boucle qui fait vivre la salle. */
UI.initPortrait = function () {
  UI.$('portrait').innerHTML = '<div class="tel"></div><h2>' + UI.esc(B.t('portrait_titre')) + '</h2><p>' + UI.esc(B.t('portrait_texte')) + '</p>';
  const mq = window.matchMedia('(orientation: portrait)');
  const maj = function () { UI.pause('portrait', mq.matches); if (mq.matches) UI.sauver(); };
  if (mq.addEventListener) mq.addEventListener('change', maj); else mq.addListener(maj);
  maj();
};

UI.majFin = function () {
  const S = UI.S, el = UI.$('fin');
  if (!S || !S.finJour || !S.bilan) { el.hidden = true; return; }
  if (!el.hidden) return;
  const b = S.bilan;
  el.innerHTML = '<div class="carte-fin"><h2>' + UI.esc(B.t('fin_titre', { jour: b.jour })) + '</h2><div class="chiffres">' +
    '<div><b>' + b.servis + '</b><span>' + UI.esc(B.t('fin_servis')) + '</span></div>' +
    '<div><b>' + UI.esc(B.euros(b.recettes || 0)) + '</b><span>' + UI.esc(B.t('fin_recettes')) + '</span></div>' +
    '<div><b>' + UI.esc(B.prix(b.ticketMoyen || 0)) + '</b><span>' + UI.esc(B.t('fin_ticket_moyen')) + '</span></div></div>' +
    '<div class="fin-detail">' + [
      B.t('fin_d_repartis', { n: b.repartis }), B.t('fin_d_attente', { n: b.attente }),
      B.t('fin_d_cout', { cout: B.euros(b.coutMatiere || 0) }), B.t('fin_d_marge', { marge: B.euros((b.recettes || 0) - (b.coutMatiere || 0)) }),
      B.t('fin_d_renvois', { n: b.platsRenvoyes || 0 }), B.t('fin_d_pourboires', { total: B.prix(b.pourboires || 0) }),
      b.meilleurPlat ? B.t('fin_d_meilleur', { nom: b.meilleurPlat.nom, n: b.meilleurPlat.n }) : '',
      B.t('fin_d_achats', { total: B.euros(b.achats || 0) }), B.t('fin_d_resultat', { total: B.euros(b.resultat || 0) }),
      B.t('fin_d_gaspillage', { n: b.gaspillagePortions || 0, valeur: B.euros(b.gaspillage || 0) }),
      B.t('fin_d_mdj', { n: b.mdjVendus || 0, e: b.emporter || 0 }), B.t('fin_d_boissons', { n: b.boissons || 0 }),
      B.t('fin_d_ruptures', { n: (b.ruptures || []).length, partis: b.partisRupture || 0 }),
      b.formations ? B.t('fin_d_formations', { total: B.euros(b.formations) }) : '',
      b.proprete ? B.t('fin_d_proprete', { avant: b.proprete.avant, apres: b.proprete.apres }) : '',
      b.partisSale ? B.t('fin_d_partis_sale', { n: b.partisSale }) : '',
      (b.absents || []).length ? B.t('fin_d_absents', { n: b.absents.map(function (x) { return x.nom.split(' ')[0]; }).join(', ') }) : '',
      b.partage ? B.t('fin_d_partage', { total: B.prix(b.partage.total), n: b.partage.n, part: B.prix(b.partage.part) }) : ''
    ].filter(Boolean).map(function (x) { return '<span>' + UI.esc(x) + '</span>'; }).join('') + '</div>' + UI.htmlFinRuptures(b) +
    '<button type="button" class="gros principal" id="fin-suivant">' + UI.esc(B.t('fin_suivant', { jour: b.jour + 1 })) + '</button></div>';
  el.hidden = false;
  UI.sauver();
  UI.$('fin-suivant').addEventListener('click', function () {
    B.jourSuivant(UI.S);
    el.hidden = true;
    UI.sauver();
    UI.majBarre();
    if (!UI.S.ouvert) UI.ouvrirVolet('equipe');
  });
};

UI.htmlFinRuptures = function (b) {
  const R = b.ruptures || [];
  if (!R.length) return '';
  return '<div class="fin-ruptures"><b>' + UI.esc(B.t('fin_ruptures_titre')) + '</b>' + R.slice(0, 4).map(function (r) {
    return '<span>' + UI.esc(r.nom + ' : ' + B.t(r.cause, r.vars)) + '</span>';
  }).join('') + (R.length > 4 ? '<span>…</span>' : '') + '</div>';
};

UI.boucle = function (ts) {
  const dtReel = UI._dernier == null ? 0 : Math.min(250, ts - UI._dernier);
  UI._dernier = ts;
  const S = UI.S;
  if (S) {
    const v = UI.vitesseReelle();
    if (v > 0) {
      B.avancer(S, dtReel / 1000 * v * B.DATA.regles.minutesParSeconde);
      if (UI.derniereSauvegarde == null || S.minute - UI.derniereSauvegarde >= B.DATA.regles.sauvegarde.toutesLesMinutesDeJeu || S.minute < UI.derniereSauvegarde) UI.sauver();
    }
    if (S.finJour) UI.majFin();
    UI.dessin.dynamique();
    if (!UI._tDetail || ts - UI._tDetail > 250) { UI._tDetail = ts; UI.majDetail(); UI.majBarre(); }
  }
  UI.majMessages(Date.now());
  requestAnimationFrame(UI.boucle);
};

UI.init = function () {
  document.title = B.t('jeu_nom') + (B.CANAL === 'test' ? ' (test)' : '');
  UI.chargerReglages();
  UI.initBarre();
  UI.dessin.fond();
  UI.dessin.initTouches();
  UI.initVolets();
  UI.initAccueil();
  UI.initEquipe();
  UI.initCarte();
  UI.initStocks();
  UI.initPlacement();
  UI.initPortrait();
  const r = UI.chargerPartie();
  if (r.partie) { UI.S = r.partie; B.message(UI.S, 'msg_reprise', { nom: UI.S.nom, jour: UI.S.jour }); }
  UI.erreurChargement = r.erreur || null;
  UI.montrerAccueil();
  UI.majBarre();
  UI.majDetail();
  document.addEventListener('visibilitychange', function () {
    UI.pause('cache', document.hidden);
    if (document.hidden) UI.sauver();
  });
  window.addEventListener('pagehide', UI.sauver);
  requestAnimationFrame(UI.boucle);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne indisponible, le jeu marche quand même */ });
  }
};

document.addEventListener('DOMContentLoaded', UI.init);

})();
</script>

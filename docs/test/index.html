<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2a22">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Bistrot</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2b211c; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #2a211b; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button { font: inherit; cursor: pointer; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* Barre du haut */
#barre { flex: none; height: 46px; display: flex; align-items: center; gap: 6px; padding: 1px 8px; padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); background: #3a2a22; color: #fff6e8; }
.infos { flex: 1; min-width: 0; line-height: 1.25; }
.infos .l1, .infos .l2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.infos .l1 { font-size: 14px; }
.infos .l2 { font-size: 14px; color: #f6deb0; }
#vitesses { display: flex; gap: 4px; flex: none; }
#vitesses button { min-width: 46px; height: 44px; border: 0; border-radius: 9px; background: #5a463b; color: #fff6e8; font-size: 15px; font-weight: 600; }
#vitesses button.actif { background: #f2c14e; color: #2a211b; }
.btn-barre { flex: none; height: 44px; min-width: 60px; padding: 0 9px; border: 0; border-radius: 9px; background: #6d5546; color: #fff6e8; font-size: 14px; font-weight: 600; }

/* Salle et colonne de droite */
#jeu { flex: 1; display: flex; min-height: 0; }
#salle-zone { flex: 1; min-width: 0; position: relative; background: #3a2a22; }
#salle { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#cote { flex: none; width: 160px; display: flex; flex-direction: column; gap: 4px; padding: 4px; padding-right: max(4px, env(safe-area-inset-right)); background: #f3eadb; min-height: 0; }
#messages { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.msg { font-size: 12px; line-height: 1.25; background: #fff; border-left: 4px solid #f2c14e; padding: 3px 6px; border-radius: 4px; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; flex: none; animation: arrive .25s ease-out; }
.msg .h, .journal .h { color: #8a6a50; font-weight: 600; }
.msg-plus { font-size: 12px; color: #6d5546; padding: 0 4px; font-weight: 600; }
@keyframes arrive { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
#detail { flex: none; background: #fff; border-radius: 6px; padding: 5px 7px; font-size: 12px; line-height: 1.35; min-height: 92px; }
#detail b { font-size: 14px; }
#detail .aide { color: #6d5546; margin-bottom: 2px; }
#btn-placement { flex: none; height: 44px; border: 2px solid #8a6a50; border-radius: 9px; background: #fff; color: #3a2a22; font-size: 13px; font-weight: 700; }
#btn-placement.manuel { background: #1d6fd8; border-color: #1d6fd8; color: #fff; }
#detail .choisi { color: #1d6fd8; font-weight: 700; }
#detail .ferme { color: #b8322a; font-weight: 700; }
#detail .vert { color: #2f8f55; font-weight: 600; } #detail .orange { color: #b8650c; font-weight: 600; } #detail .rouge { color: #c73a3a; font-weight: 600; }

/* Dessin de la salle */
#salle text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-anchor: middle; pointer-events: none; }
#salle .num { font-size: 30px; font-weight: 800; fill: #fff; stroke: #5a3a22; stroke-width: 1px; }
#salle .etiq { font-size: 22px; font-weight: 700; fill: #fff; }
#salle .petit-txt { font-size: 22px; font-weight: 700; fill: #5a4636; }
#salle .gauche { text-anchor: start; }
#salle .lieu-txt { font-size: 24px; font-weight: 700; fill: #57656b; }
#touches rect { cursor: pointer; }

/* Volets */
#voile { position: fixed; inset: 0; background: rgba(20, 12, 8, .4); z-index: 20; }
#volet { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 78vw); max-width: 100vw; background: #fffaf2; z-index: 21; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s ease-out; box-shadow: -4px 0 18px rgba(0,0,0,.3); padding-right: env(safe-area-inset-right); }
#volet.ouvert { transform: none; }
#volet.large { width: min(640px, 94vw); }
.alerte-equipe { background: #fbe6e3; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
.ok-equipe { background: #e7f4ea; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
.personne { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eadfcd; padding: 5px 0; }
.personne > div { flex: 1; min-width: 0; }
.personne .nom { font-weight: 700; }
.personne .sous { font-size: 13px; color: #6d5546; }
.petit-btn { flex: none; min-height: 44px; min-width: 96px; padding: 0 12px; border: 2px solid #8a6a50; border-radius: 10px; background: #fff; color: #3a2a22; font-weight: 700; font-size: 14px; }
.petit-btn.principal { background: #b8322a; border-color: #b8322a; color: #fff; }
.petit-btn:disabled { opacity: .45; }
.fiche { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; margin: 4px 0 8px; }
.fiche span:nth-child(odd) { color: #6d5546; }
.questions { display: flex; flex-wrap: wrap; gap: 6px; }
.questions .petit-btn { flex: 1 1 45%; text-align: left; font-weight: 600; }
.reponse { background: #f3eadb; border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
.reponse .q { font-weight: 700; font-size: 13px; color: #6d5546; display: block; }
.offre { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.offre b { font-size: 18px; min-width: 80px; text-align: center; }
.mot { font-style: italic; background: #fff3d6; border-radius: 8px; padding: 6px 10px; }
.volet-tete { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 4px 14px; background: #3a2a22; color: #fff6e8; flex: none; }
.volet-tete h2 { font-size: 17px; margin: 0; }
#volet-fermer { height: 44px; min-width: 84px; border: 0; border-radius: 9px; background: #f2c14e; color: #2a211b; font-weight: 700; font-size: 15px; }
#volet-corps { overflow-y: auto; padding: 8px 14px 16px; font-size: 14px; line-height: 1.4; user-select: text; -webkit-user-select: text; }
#volet-corps h3 { font-size: 15px; margin: 10px 0 6px; }
.journal { list-style: none; margin: 0; padding: 0; }
.journal li { padding: 6px 0; border-bottom: 1px solid #eadfcd; }
.journal .h { display: block; font-size: 12px; }
.ligne-reglage { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bascule { min-width: 72px; height: 44px; border-radius: 22px; border: 2px solid #8a6a50; background: #fff; font-weight: 700; color: #6d5546; }
.bascule.on { background: #2f8f55; border-color: #2f8f55; color: #fff; }
.version { color: #8a6a50; font-size: 12px; margin-top: 14px; }

/* Boutons communs */
.gros { display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 8px 14px; border: 2px solid #8a6a50; border-radius: 12px; background: #fff; color: #3a2a22; font-size: 16px; font-weight: 700; }
.gros.principal { background: #b8322a; border-color: #b8322a; color: #fff; }
.rang { display: flex; gap: 10px; } .rang .gros { flex: 1; }

/* Accueil */
#accueil { position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: radial-gradient(circle at 30% 20%, #6b3a2a, #2b1a14); display: flex; justify-content: center; align-items: flex-start; padding: 10px; }
.carte-accueil { width: min(560px, 100%); background: #fffaf2; border-radius: 16px; padding: 10px 20px 12px; margin: auto 0; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.carte-accueil h1 { font-family: Georgia, "Times New Roman", serif; font-size: 34px; margin: 0; color: #8e2a22; text-align: center; }
.carte-accueil h2 { font-size: 18px; margin: 6px 0; }
.carte-accueil .sous { text-align: center; margin: 0 0 6px; color: #6d5546; font-size: 14px; }
.carte-accueil label { display: block; font-weight: 700; font-size: 14px; margin: 6px 0; }
.carte-accueil input, .carte-accueil select { display: block; width: 100%; height: 44px; margin-top: 3px; font-size: 16px; padding: 0 10px; border: 2px solid #c9b59c; border-radius: 10px; background: #fff; }
.carte-accueil p { font-size: 14px; margin: 6px 0; }
.carte-accueil .petit { font-size: 13px; color: #6d5546; }
.carte-accueil .rassure { background: #e7f4ea; border-radius: 8px; padding: 6px 10px; }
.carte-accueil .alerte { background: #fbe6e3; border-radius: 8px; padding: 6px 10px; }
.ancienne { display: flex; align-items: center; gap: 12px; border: 1px solid #e0d2bd; border-radius: 10px; padding: 4px 10px; margin: 6px 0; font-size: 14px; }
.ancienne > div { flex: 1; }
.ancienne .gros { width: auto; margin: 4px 0; }

/* Fin de journée */
#fin { position: fixed; inset: 0; z-index: 25; background: rgba(20, 12, 8, .55); display: flex; align-items: center; justify-content: center; padding: 10px; }
#fin[hidden], #accueil[hidden], #voile[hidden], #volet[hidden] { display: none; }
.carte-fin { background: #fffaf2; border-radius: 16px; padding: 12px 22px; width: min(520px, 100%); text-align: center; }
.carte-fin h2 { margin: 0 0 8px; font-size: 20px; }
.chiffres { display: flex; gap: 10px; }
.chiffres div { flex: 1; background: #f3eadb; border-radius: 10px; padding: 6px; }
.chiffres b { display: block; font-size: 28px; color: #8e2a22; }
.chiffres span { font-size: 12px; }

/* Portrait : on demande de tourner le téléphone */
#portrait { display: none; position: fixed; inset: 0; z-index: 100; background: #2b1a14; color: #fff6e8; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; }
#portrait h2 { font-size: 24px; margin: 24px 0 8px; }
#portrait p { font-size: 17px; max-width: 300px; line-height: 1.4; }
#portrait .tel { width: 70px; height: 120px; border: 6px solid #f2c14e; border-radius: 14px; animation: tourne 2.2s ease-in-out infinite; }
@keyframes tourne { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) { #portrait { display: flex; } }

.personne .partant { color: #b8322a; font-style: italic; }
.personne .refus { margin-top: 4px; background: #fbe6e3; border-radius: 6px; padding: 4px 8px; font-size: 14px; color: #8e2a22; font-weight: 600; }
.confirmation p { margin: 6px 0; }

.plat { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #eadfcd; padding: 4px 0; }
.plat.on { background: #f6efe2; }
.plat-nom { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 2px; min-height: 44px; color: inherit; font: inherit; }
.plat-nom .nom { display: block; font-weight: 700; }
.plat-nom .sous { display: block; font-size: 13px; color: #6d5546; }
.plat-prix { display: flex; align-items: center; gap: 4px; flex: none; }
.plat-prix b { min-width: 66px; text-align: center; font-size: 15px; }
.petit-btn.mini { min-width: 44px; padding: 0; font-size: 20px; }
.plat .bascule { min-width: 96px; font-size: 13px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 0 7px; margin-right: 4px; background: #eadfcd; color: #3a2a22; }
.badge.local { background: #1597a8; color: #fff; }
.badge.fm { background: #fff; border: 1.5px solid #8e2a22; color: #8e2a22; }
.badge.veg { background: #2f8f55; color: #fff; }
.gros-prix { font-size: 22px; min-width: 90px; text-align: center; }
.ticket { background: #fff; border: 1px dashed #8a6a50; border-radius: 6px; padding: 10px 14px; max-width: 460px; margin: 4px auto; font-size: 15px; }
.t-tete { text-align: center; font-weight: 700; margin: 0 0 8px; }
.t-ligne { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.t-note { font-size: 13px; color: #b8322a; padding-left: 10px; }
.t-total { border-top: 1px solid #3a2a22; margin-top: 6px; padding-top: 6px; font-size: 17px; }
.t-pied { text-align: center; margin: 8px 0 0; font-size: 14px; color: #6d5546; }
.btn-ticket { margin-top: 4px; min-width: 0; width: 100%; }
.fin-detail { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; margin: 8px 0; font-size: 13px; }

/* Étape 3 : stocks, boissons, menu du jour */
.btn-barre { min-width: 54px; padding: 0 7px; }
.carte-fin { max-height: 100%; overflow-y: auto; }
.fin-ruptures { background: #fbe6e3; border-radius: 8px; padding: 4px 10px; margin: 0 0 8px; font-size: 13px; text-align: left; display: flex; flex-direction: column; gap: 1px; color: #6a1f19; }
.onglets { display: flex; gap: 6px; margin: 0 0 6px; }
.onglet { flex: 1; min-height: 44px; border: 0; border-radius: 9px; background: #eadfcd; color: #3a2a22; font-weight: 700; font-size: 15px; }
.onglet.actif { background: #3a2a22; color: #fff6e8; }
.refus { margin: 4px 0; background: #fbe6e3; border-radius: 6px; padding: 4px 8px; font-size: 14px; color: #8e2a22; font-weight: 600; }
.refus.ok { background: #e1f2e6; color: #1d5e35; }
.badge.rouge { background: #b8322a; color: #fff; }
.badge.orange { background: #e08a1e; color: #fff; }
.badge.gris { background: #bdb3a6; color: #fff; }
.ligne-st { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid #eadfcd; padding: 4px 0; min-height: 44px; font-size: 14px; }
.ligne-st > span:first-child { flex: 1; min-width: 0; }
.ligne-st .sous { font-size: 12.5px; color: #6d5546; }
.ligne-st.grise { opacity: .45; }
.ligne-st .qte { text-align: right; flex: none; display: flex; flex-direction: column; }
.ligne-st .qte b { font-size: 17px; }
.jauge { display: inline-block; vertical-align: middle; width: 90px; height: 9px; border-radius: 5px; background: #eadfcd; margin-left: 8px; overflow: hidden; }
.jauge i { display: block; height: 100%; background: #2f8f55; }
.jauge i.orange { background: #e08a1e; }
.jauge i.rouge { background: #b8322a; }
.alerte { background: #fbe6e3; border-left: 4px solid #b8322a; border-radius: 6px; padding: 4px 8px; margin: 3px 0; font-size: 14px; }
.alerte.finie { background: #f3eadb; border-left-color: #8a6a50; }
.fours { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.four { flex: 1 1 45%; text-align: left; border: 2px solid #eadfcd; background: #fff; border-radius: 10px; padding: 5px 8px; min-height: 44px; color: inherit; }
.four.actif { border-color: #3a2a22; background: #f6efe2; }
.four b { display: block; font-size: 14px; }
.four .sous { display: block; font-size: 12px; color: #6d5546; }
.offres { background: #fff4d6; border-radius: 6px; padding: 4px 8px; font-size: 13px; margin: 4px 0; }
.actions-st { display: flex; gap: 6px; margin: 4px 0; }
.actions-st .petit-btn { flex: 1; }
.pied-st { background: #f6efe2; border-radius: 8px; padding: 6px 6px 6px 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
.pied-st span { flex: 1; }
.pied-st .gros { width: auto; margin: 0; padding: 0 16px; }
.t-inclus { font-size: 13px; color: #6d5546; padding-left: 8px; }
.gros:disabled { opacity: .45; }
#fin-suivant { position: sticky; bottom: 0; margin-bottom: 0; }
.carte-fin { padding-bottom: 8px; }
.chiffres b { font-size: 22px; }
.fin-detail { font-size: 12.5px; margin: 6px 0; }

/* v0.5.1 : modifier le menu du jour (gros textes, grosses touches) */
.gros-texte { font-size: 16px; line-height: 1.35; }
.mdj-place { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eadfcd; padding: 6px 0; }
.mdj-texte { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mdj-texte .sous { font-size: 13px; color: #6d5546; }
.mdj-nom { font-size: 18px; }
.mdj-btn { min-height: 52px; min-width: 110px; font-size: 16px; }
.alerte-mdj { margin-top: 3px; background: #fbe6e3; color: #8e2a22; border-radius: 6px; padding: 3px 7px; font-size: 14px; font-weight: 700; }
.mdj-choix { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 60px; margin: 6px 0; padding: 8px 12px; text-align: left; border: 2px solid #2f8f55; border-radius: 12px; background: #fff; color: #2a211b; }
.mdj-choix b { font-size: 18px; }
.mdj-choix > span { font-size: 15px; color: #1d5e35; }
.mdj-choix.actuel { background: #e1f2e6; border-width: 3px; }
.mdj-choix.peu { border-color: #e08a1e; }
.mdj-choix.peu > span { color: #9a5a0c; font-weight: 700; }
.mdj-choix.impossible { border-color: #cfc4b5; background: #f3eee6; color: #8a7d6e; }
.mdj-choix.impossible > span { color: #8e2a22; font-weight: 700; }

/* v0.6 : équipe (plannings, formations, cagnotte) — gros textes, grosses touches */
#volet-corps .gros-texte .personne { padding: 7px 0; }
.gros-texte .personne .nom { font-size: 17px; }
.gros-texte .personne .sous { font-size: 14px; }
.gros-texte .petit-btn { min-height: 52px; font-size: 15px; }
.personne .etat { font-size: 15px; font-weight: 600; color: #2f5e3e; }
.personne.absent .etat { color: #8e2a22; }
.personne.absent .nom { opacity: .75; }
.petit-btn.gros-mini { min-width: 56px; min-height: 52px; font-size: 22px; }
.rouge-txt { color: #b8322a; }
table.planning { border-collapse: collapse; width: 100%; margin: 4px 0 8px; font-size: 16px; }
table.planning th, table.planning td { border: 1px solid #eadfcd; text-align: center; padding: 5px 2px; }
table.planning th:first-child { text-align: left; padding-left: 6px; white-space: nowrap; }
table.planning td { font-weight: 700; font-size: 17px; }
table.planning td.vide { background: #fbe6e3; color: #b8322a; }
table.planning .auj { background: #fff3d6; }
table.planning td.vide.auj { background: #f6c9c2; }
.qualites { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.qualite { display: grid; grid-template-columns: 150px 60px 1fr; align-items: center; gap: 8px; background: #f6efe2; border-radius: 8px; padding: 6px 10px; }
.qualite b { font-size: 20px; color: #8e2a22; }
.q-effet { font-size: 14px; color: #4a3a30; }
.ligne-st.form { min-height: 60px; font-size: 16px; }
.form-btn { min-width: 150px; }
.cagnotte { display: flex; align-items: baseline; justify-content: space-between; background: #f6efe2; border-radius: 10px; padding: 8px 12px; margin: 4px 0; }
.cagnotte b { font-size: 28px; color: #8e2a22; }
.onglet { font-size: 15px; padding: 0 4px; }

/* v0.7 : argent (caisse, comptes, bilans, faillite, niveaux) — gros textes, grosses touches */
button.infos { display: block; height: 44px; padding: 0 4px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 8px; }
button.infos .l1, button.infos .l2 { display: block; }
button.infos:active { background: rgba(255,255,255,.08); }
#b-argent { display: inline-block; padding: 0 3px; border: 1.5px solid #f2c14e; border-radius: 6px; color: #ffe39a; line-height: 1.15; }
#b-argent.negatif { border-color: #ff8b7e; color: #ffb3a8; }
.caisse b { font-size: 30px; }
.caisse small { font-size: 14px; color: #6d5546; font-weight: 400; }
.ligne-ag { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 2px; border-bottom: 1px solid #eadfcd; font-size: 16px; }
.ligne-ag b { font-size: 17px; white-space: nowrap; }
.ligne-ag.plus b { color: #2f8f55; }
.ligne-ag.total { border-bottom: 0; border-top: 2px solid #3a2a22; font-weight: 700; font-size: 17px; }
.ligne-ag.total b { font-size: 20px; }
.vert-txt { color: #2f8f55; }
.chiffres b.vert-txt { color: #2f8f55; } .chiffres b.rouge-txt { color: #b8322a; }
.alerte-ag { background: #fbe6e3; color: #8e2a22; border-left: 5px solid #b8322a; border-radius: 8px; padding: 6px 10px; margin: 6px 0; font-size: 15px; font-weight: 700; text-align: left; }
.alerte-ag span { font-weight: 400; color: #5a2a24; }
.fin-argent { text-align: left; margin: 6px auto; max-width: 420px; }
.fin-argent .ligne-ag { font-size: 15px; padding: 3px 2px; }
.fin-argent .ligne-ag b { font-size: 15px; }

ssis !","aide_titre":"Aide et objectifs","aide_onglet_objectifs":"🎯 Objectifs","aide_onglet_aide":"❓ Aide","aide_intro":"Touche un sujet pour lire l'explication.","aide_relancer":"▶ Revoir le guide pas à pas","menu_aide":"❓ Aide et objectifs","aide_salle_titre":"🪑 La salle et le temps","aide_salle_texte":"Les clients entrent, attendent à la porte, puis s'assoient. Les serveurs prennent la commande, la cuisine prépare, les clients mangent et paient.|Touche une table pour voir ce qui s'y passe.|En haut : Pause, 1×, 2×, 4× pour faire passer le temps plus ou moins vite.|« Placement : auto » : les clients sont placés tout seuls. Touche-le pour les placer toi-même.","aide_carte_titre":"📋 La carte","aide_carte_texte":"Bouton « Carte » en haut.|Tu choisis les plats proposés (entrées, plats, desserts, boissons) et leur prix.|Un prix trop haut fait venir moins de clients ; un prix trop bas fait perdre de l'argent.|Le menu du jour est proposé chaque matin : tu peux changer ses plats.","aide_stocks_titre":"📦 Les stocks","aide_stocks_texte":"Bouton « Stocks » en haut.|Chaque plat a besoin de produits. Sans produits, le plat manque (« rupture ») et des clients repartent.|Tu commandes chez les fournisseurs ; la livraison arrive plus tard.|La commande automatique commande pour toi chaque soir (activée d'office en Facile).|Les produits frais ont une date limite : trop commander, c'est jeter.","aide_equipe_titre":"🧑‍🍳 L'équipe","aide_equipe_texte":"Bouton « Équipe » en haut.|Embauche : reçois les candidats en entretien et propose un salaire.|Il faut au moins une personne en salle et une en cuisine pour ouvrir.|Planning : chacun a 2 jours de repos. L'intérim remplace les absents.|Formations : rendent un employé meilleur. Cagnotte : les pourboires partagés chaque mois.","aide_argent_titre":"💶 L'argent","aide_argent_texte":"Touche la caisse en haut à gauche.|Tu vois les recettes et les dépenses du jour, ligne par ligne, et le bilan de chaque semaine.|Les salaires, le loyer et les charges sont payés chaque soir, un peu chaque jour.|Si la caisse reste sous zéro 7 soirs de suite, c'est la faillite. Une alerte te prévient chaque soir avant.","aide_calendrier_titre":"📅 Le calendrier","aide_calendrier_texte":"Bouton avec la météo, à droite.|Aujourd'hui : pourquoi il y a plus ou moins de clients (météo, jour, fêtes, vacances) et les effets en cours.|7 jours et Le mois : la météo et les fêtes à venir.|Fêtes et événements : les menus de fête et les événements privés à accepter.","aide_evenements_titre":"⚡ Les événements","aide_evenements_texte":"Certains matins, un événement arrive : inspection, critique, panne, grève, bus de touristes…|Une grande fenêtre s'ouvre et le jeu attend ta réponse. Chaque bouton dit ce qui va se passer.|Les événements privés (anniversaires, séminaires…) se décident dans le Calendrier : tu fixes le prix, le client accepte ou discute.","aide_proprete_titre":"🧽 La propreté","aide_proprete_texte":"La salle se salit un peu à chaque client.|Les agents de nettoyage la gardent propre ; le soir, l'équipe nettoie un peu.|Une salle sale fait baisser les pourboires, puis fait fuir des clients.|Lors d'une inspection, une salle propre (75 ou plus) rapporte des clients ; une salle sale coûte une amende.|La propreté est dans le bilan du soir.","tuto_suivant":"Suivant ▶","tuto_retour":"◀ Retour","tuto_passer":"Passer le guide","tuto_fin":"C'est parti !","tuto_etape":"Étape {n} sur {sur}","tuto_0_titre":"🥖 Bienvenue dans ton bistrot !","tuto_0_texte":"Ce petit guide te montre les boutons, en quelques étapes. Tu peux le passer, et le revoir quand tu veux dans Menu → Aide et objectifs.","tuto_1_titre":"⏱️ Le temps","tuto_1_texte":"Ces boutons font passer le temps : Pause, 1× (normal), 2× et 4× (plus vite). Le jeu se met en pause tout seul quand tu ouvres un volet.","tuto_2_titre":"🧑‍🍳 L'équipe","tuto_2_texte":"Au début, tu es seul avec le patron. Pour ouvrir, il faut quelqu'un en cuisine : touche « Équipe », puis « Embauche », et reçois un candidat.","tuto_3_titre":"🪑 La salle","tuto_3_texte":"Les clients arrivent par l'entrée et s'assoient seuls. Touche une table pour voir ce qui s'y passe : attente, commande, addition.","tuto_4_titre":"📋 La carte","tuto_4_texte":"Touche « Carte » pour choisir tes plats, leurs prix et le menu du jour.","tuto_5_titre":"📦 Les stocks","tuto_5_texte":"Les plats ont besoin de produits. « Stocks » sert à les commander. En Facile, la commande automatique le fait pour toi.","tuto_6_titre":"💶 L'argent","tuto_6_texte":"En haut à gauche : le jour, l'heure et ta caisse. Touche-la pour voir l'argent jour par jour.","tuto_7_titre":"📅 Calendrier et événements","tuto_7_texte":"Ici : la météo et ce qui se passe aujourd'hui. Quand un événement arrive, une grande fenêtre te demande de choisir.","tuto_8_titre":"📰 Journal et Menu","tuto_8_texte":"« Journal » garde tous les messages. « Menu » contient les réglages, l'aide et tes objectifs.","tuto_9_titre":"🎯 Ton premier objectif","tuto_9_texte":"{objectif}. Les objectifs suivants arrivent un par un. Bonne chance !","msg_ev_critic_top":"🧐 Le critique a adoré ({etoiles} ★) : ta réputation monte, et +15 % de clients pendant {jours} jours.","avis_1":"À éviter ! Le plat « {plat} » était immangeable.|Une catastrophe du début à la fin.|Jamais vu un service aussi mauvais. Plus jamais.|Très mauvaise soirée, rien à sauver.","avis_2":"Déçu : le plat « {plat} » manquait de goût.|Service brouillon, dommage.|Trop cher pour ce qu’on mange.|Un repas décevant.","avis_3":"Correct, sans plus. Le plat « {plat} » était honnête.|Sympathique, mais un peu long.|Un repas moyen.|On a connu mieux, on a connu pire.","avis_4":"Très bon repas, le plat « {plat} » était savoureux.|Bonne adresse, service efficace. Je recommande.|Bon moment, on reviendra.|Presque parfait.|Un bistrot sympathique et une cuisine sincère.","avis_5":"Un vrai bistrot comme on les aime ! Cuisine généreuse, service souriant.|Le plat « {plat} » était délicieux, on reviendra !|Super adresse : ambiance chale /* ==== src/moteur/outils.js ==== */
/* outils.js — petites fonctions communes : hasard reproductible, textes, heures, euros. */
B.VERSION_JEU = '1.0-test';

/* Hasard reproductible : la graine est rangée dans la partie, donc une partie rechargée continue pareil. */
B.hasard = function (S) {
  let a = (S.graine | 0) + 0x6D2B79F5 | 0;
  S.graine = a;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
B.entre = function (S, a, b) { return a + (b - a) * B.hasard(S); };
B.entier = function (S, a, b) { return Math.floor(a + (b - a + 1) * B.hasard(S)); };
B.duree = function (S, v) { return Array.isArray(v) ? B.entre(S, v[0], v[1]) : v; };

/* Textes : tous viennent de donnees/textes.json. */
B.t = function (cle, vars) {
  const s = B.DATA.textes[cle];
  if (s == null) { B.textesManquants[cle] = true; return cle; }
  return String(s).replace(/\{(\w+)\}/g, function (m, k) {
    return vars && vars[k] != null ? vars[k] : m;
  });
};
B.textesManquants = {};

B.heure = function (minute) {
  const m = Math.floor(minute) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
};
B.euros = function (n) {
  const r = Math.round(n);
  const s = String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');
  return (r < 0 ? '-' : '') + s + '\u00A0€';
};

/* Prix au centime : « 19,50 € ». */
B.prix = function (n) {
  const r = Math.round(n * 100) / 100, e = Math.floor(Math.abs(r)), c = Math.round((Math.abs(r) - e) * 100);
  return (r < 0 ? '-' : '') + String(e).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F') + ',' + String(c).padStart(2, '0') + '\u00A0€';
};

/* « Bienvenue chez YaYa », « Bienvenue au Petit Zinc », « Bienvenue à la Brasserie »… */
B.chezNom = function (nom) {
  const n = String(nom || '').trim();
  if (/^chez\s+/i.test(n)) return 'chez ' + n.replace(/^chez\s+/i, '');
  if (/^le\s+/i.test(n)) return 'au ' + n.replace(/^le\s+/i, '');
  if (/^les\s+/i.test(n)) return 'aux ' + n.replace(/^les\s+/i, '');
  if (/^la\s+/i.test(n)) return 'à la ' + n.replace(/^la\s+/i, '');
  if (/^l['’]\s*/i.test(n)) return 'à l’' + n.replace(/^l['’]\s*/i, '');
  return 'chez ' + n;
};

B.lieu = function (id) {
  const L = B.DATA.lieux.lieux;
  return L.find(function (l) { return l.id === id; }) || L[0];
};

/* Messages : rangés dans le journal de la partie, et transmis à l'écran (B.flux). */
B.flux = [];
/* Note dans le journal seulement (sans bulle à l'écran), pour les événements fréquents comme les paiements. */
B.noter = function (S, cle, vars) {
  S.journal.push({ jour: S.jour, minute: Math.floor(S.minute), texte: B.t(cle, vars) });
  if (S.journal.length > 300) S.journal.splice(0, S.journal.length - 300);
};
B.message = function (S, cle, vars) {
  const m = { jour: S.jour, minute: Math.floor(S.minute), texte: B.t(cle, vars) };
  S.journal.push(m);
  if (S.journal.length > 300) S.journal.splice(0, S.journal.length - 300);
  B.flux.push(m);
};

/* ==== src/moteur/salle.js ==== */
/* salle.js — le plan de la salle : tables, places, rallonges, chemins. */
B.salle = {};

B.salle.plan = function () { return B.DATA.salle; };
B.salle.geo = function (id) {
  return B.DATA.salle.tables.find(function (t) { return t.id === id; });
};
B.salle.taille = function (places) { return places <= 2 ? 60 : 84; };

/* Places autour d'une table : sur les côtés pour 2, dessus/dessous pour 4. */
B.salle.places = function (id) {
  const g = B.salle.geo(id), d = B.salle.taille(g.places) / 2 + 16;
  if (g.places <= 2) return [{ x: g.x - d, y: g.y }, { x: g.x + d, y: g.y }];
  return [
    { x: g.x - 21, y: g.y - d }, { x: g.x + 21, y: g.y - d },
    { x: g.x - 21, y: g.y + d }, { x: g.x + 21, y: g.y + d }
  ];
};

/* Centre d'un groupe de tables (une table seule, ou deux tables rapprochées). */
B.salle.centre = function (ids) {
  let x = 0, y = 0;
  ids.forEach(function (id) { const g = B.salle.geo(id); x += g.x; y += g.y; });
  return { x: x / ids.length, y: y / ids.length };
};
B.salle.nomTables = function (ids) { return ids.slice().sort(function (a, b) { return a - b; }).join('-'); };

/* Chemin simple : on rejoint l'allée centrale, on la longe, puis on va au but. */
B.salle.chemin = function (de, vers) {
  const A = B.DATA.salle.allee, pts = [];
  if (Math.abs(de.y - A) > 1) pts.push({ x: de.x, y: A });
  pts.push({ x: vers.x, y: A });
  if (Math.abs(vers.y - A) > 1) pts.push({ x: vers.x, y: vers.y });
  return pts;
};

/* Fait avancer une personne le long de son chemin. Renvoie vrai quand elle est arrivée. */
B.salle.bouger = function (p, dist) {
  while (dist > 0 && p.chemin.length) {
    const c = p.chemin[0], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy);
    if (d <= dist) { p.x = c.x; p.y = c.y; p.chemin.shift(); dist -= d; }
    else { p.x += dx / d * dist; p.y += dy / d * dist; dist = 0; }
  }
  return p.chemin.length === 0;
};

/* Cherche une table libre : la plus petite qui suffit, sinon deux tables rapprochées. */
B.salle.chercher = function (S, taille) {
  const libre = function (id) {
    const t = S.tables.find(function (x) { return x.id === id; });
    return t && !t.groupe && !t.sale && !t.reserve;
  };
  const seules = S.tables.filter(function (t) { return libre(t.id) && t.places >= taille; })
    .sort(function (a, b) { return a.places - b.places || a.id - b.id; });
  if (seules.length) return [seules[0].id];
  for (const r of B.DATA.salle.rallonges) {
    const total = r.reduce(function (s, id) { return s + B.salle.geo(id).places; }, 0);
    if (total >= taille && r.every(libre)) return r.slice();
  }
  return null;
};
B.salle.tableDe = function (S, id) { return S.tables.find(function (t) { return t.id === id; }); };

/* ==== src/moteur/clients.js ==== */
/* clients.js — arrivée des groupes, file à la porte, repas, départ. */
B.clients = {};

B.clients.type = function (id) {
  return B.DATA.clients.types.find(function (t) { return t.id === id; });
};

/* Nombre moyen de groupes qui arrivent par heure à cette minute de la journée. */
B.clients.affluence = function (S, minute) {
  const tr = B.DATA.clients.affluence.find(function (a) { return minute >= a.de && minute < a.a; });
  if (!tr) return 0;
  return tr.groupesParHeure * B.lieu(S.lieu).affluence * B.argent.niveau(S).affluence * (S.carte ? B.carte.facteurAffluence(S) : 1) * (S.cal ? B.cal.facteur(S, minute) : 1) * B.rep.facteurAffluence(S);
};

/* v0.8 : la part de touristes dépend du lieu, de la saison et des vacances ; les familles viennent plus
   les jours fériés, pendant les vacances et pour les fêtes des mères et des pères (ancien jeu). */
B.clients.poidsTypes = function (S) {
  const T = B.DATA.clients.types;
  if (!S.cal) return T.map(function (t) { return t.poids; });
  const n = B.cal.serieDuJour(S, 0), pt = B.cal.partTouristes(S, n), ff = B.cal.facteurFamilles(S, n, S.minute);
  const autres = T.filter(function (t) { return t.id !== 'touristes'; });
  let tot = 0; autres.forEach(function (t) { tot += t.poids * (t.id === 'famille' ? ff : 1); });
  return T.map(function (t) { return t.id === 'touristes' ? (pt >= 1 ? 1 : tot * pt / (1 - pt)) : t.poids * (t.id === 'famille' ? ff : 1); });
};
B.clients.tirerType = function (S) {
  const T = B.DATA.clients.types, W = B.clients.poidsTypes(S);
  let tot = 0; W.forEach(function (w) { tot += w; });
  let r = B.hasard(S) * tot;
  for (let k = 0; k < T.length; k++) { r -= W[k]; if (r < 0) return T[k]; }
  return T[T.length - 1];
};

B.clients.arrivee = function (S, o) {
  o = o || {};
  const type = o.type ? B.clients.type(o.type) : B.clients.tirerType(S);
  const taille = B.entier(S, type.taille[0], type.taille[1]);
  const noms = B.lieu(S.lieu).nomsClients;
  const e = B.DATA.salle.entree;
  const g = {
    id: S.prochainId++, type: type.id, taille: taille,
    nom: noms[B.entier(S, 0, noms.length - 1)],
    etat: 'file', depuis: S.minute, arrivee: S.minute,
    patience: B.duree(S, B.DATA.clients.durees.patienceFile) * (o.patience || 1),
    tables: null, x: e.x, y: e.y, chemin: [], duree: 0, serveur: null, cuisinier: null, pret: null, aMange: false
  };
  S.groupes.push(g);
  S.stats.jour.groupes++;
  S.stats.jour.arrives += taille;
  /* salle sale : certains font demi-tour en entrant */
  const fuite = B.planning.fuiteProprete(S);
  if (fuite > 0 && B.hasard(S) < fuite) {
    g.etat = 'repart';
    g.chemin = [{ x: B.DATA.salle.dehors.x, y: B.DATA.salle.dehors.y }];
    S.stats.jour.repartis += taille; S.stats.jour.partisSale = (S.stats.jour.partisSale || 0) + taille;
    B.rep.parti(S, 'sale');
    B.noter(S, 'msg_repart_sale', { taille: taille });
    return;
  }
  if (taille >= 5) B.message(S, 'msg_grand_groupe', { taille: taille, groupe: B.t('groupe_' + type.id, { nom: g.nom }) });
};

/* Place les groupes qui attendent à la porte, dans l'ordre d'arrivée, dès qu'une table convient. */
B.clients.placer = function (S) {
  let enFile = 0;
  for (const g of S.groupes) {
    if (g.etat !== 'file') continue;
    const ids = S.placement === 'manuel' ? null : B.salle.chercher(S, g.taille);
    if (ids) {
      B.clients.installer(S, g, ids);
    } else if (S.minute - g.depuis > g.patience) {
      g.etat = 'repart';
      g.chemin = [{ x: B.DATA.salle.dehors.x, y: B.DATA.salle.dehors.y }];
      S.stats.jour.repartis += g.taille;
      B.rep.parti(S, 'file');
      B.message(S, 'msg_repart', { taille: g.taille });
    } else enFile++;
  }
  S.stats.jour.fileMax = Math.max(S.stats.jour.fileMax, enFile);
};

B.clients.installer = function (S, g, ids) {
  ids.forEach(function (id) { B.salle.tableDe(S, id).groupe = g.id; });
  g.tables = ids;
  g.etat = 'marche';
  g.depuis = S.minute;
  g.chemin = B.salle.chemin(g, B.salle.centre(ids));
  if (ids.length > 1) B.message(S, 'msg_installe_rallonge', { num: B.salle.nomTables(ids), taille: g.taille });
};

/* Placement par le joueur : un groupe de la file sur une table touchée. Renvoie { ok } ou { erreur, vars }. */
B.clients.placerManuel = function (S, groupeId, tableId) {
  const g = S.groupes.find(function (x) { return x.id === groupeId && x.etat === 'file'; });
  const t = B.salle.tableDe(S, tableId);
  if (!g || !t) return { erreur: 'placement_occupee', vars: { num: tableId } };
  const libre = function (id) { const x = B.salle.tableDe(S, id); return x && !x.groupe && !x.sale && !x.reserve; };
  if (!libre(tableId)) return { erreur: 'placement_occupee', vars: { num: tableId } };
  if (t.places >= g.taille) { B.clients.installer(S, g, [tableId]); return { ok: true }; }
  const r = B.DATA.salle.rallonges.find(function (r) { return r.indexOf(tableId) >= 0; });
  if (r) {
    const total = r.reduce(function (s, id) { return s + B.salle.tableDe(S, id).places; }, 0);
    if (total >= g.taille && r.every(libre)) { B.clients.installer(S, g, r.slice()); return { ok: true }; }
    if (total >= g.taille) { const autre = r.find(function (id) { return id !== tableId; }); return { erreur: 'placement_occupee', vars: { num: autre } }; }
  }
  if (g.taille >= 5) return { erreur: 'placement_rallonge', vars: { taille: g.taille } };
  return { erreur: 'placement_trop_petite', vars: { num: tableId, places: t.places, taille: g.taille } };
};

/* Le groupe quitte sa table : la table devient à débarrasser. */
B.clients.partir = function (S, g) {
  (g.tables || []).forEach(function (id) {
    const t = B.salle.tableDe(S, id);
    t.groupe = null; t.sale = true;
  });
  const c = B.salle.centre(g.tables);
  g.x = c.x; g.y = c.y;
  g.etat = 'depart';
  g.chemin = B.salle.chemin(g, B.DATA.salle.entree).concat([{ x: B.DATA.salle.dehors.x, y: B.DATA.salle.dehors.y }]);
  if (g.aMange) S.stats.jour.servis += g.taille;
};

B.clients.avancer = function (S, h) {
  const D = B.DATA.clients.durees, v = B.DATA.clients.vitesses.clients * h;
  for (const g of S.groupes) {
    const ecoule = S.minute - g.depuis;
    if (g.etat === 'marche') {
      if (B.salle.bouger(g, v)) { g.etat = 'carte'; g.depuis = S.minute; g.duree = B.duree(S, D.lireCarte); }
    } else if (g.etat === 'carte') {
      if (ecoule >= g.duree) { g.etat = 'commande'; g.depuis = S.minute; }
    } else if (g.etat === 'cuisine') {
      if (g.cuisinier && g.pret != null && S.minute >= g.pret) { B.carte.finirCuisson(S, g); g.etat = 'pret'; g.depuis = S.minute; g.cuisinier = null; }
    } else if (g.etat === 'mange') {
      if (ecoule >= g.duree) { g.etat = 'addition'; g.depuis = S.minute; }
    } else if (g.etat === 'depart' || g.etat === 'repart') {
      if (B.salle.bouger(g, v)) g.parti = true;
    }
  }
  S.groupes = S.groupes.filter(function (g) { return !g.parti; });
};

/* ==== src/moteur/equipe.js ==== */
/* equipe.js — l'équipe : le patron, les employés, les candidats, les entretiens et l'embauche.
   Plannings, formations, cagnotte et effets des postes : voir planning.js. */
B.equipe = {};

B.equipe.D = function () { return B.DATA.equipe; };
B.equipe.poste = function (id) { return B.DATA.equipe.postes[id]; };
B.equipe.nomPoste = function (p) {
  const P = B.equipe.poste(p.poste);
  if (!P) return p.poste;
  return p.genre === 'f' ? P.nomF : P.nom;
};

/* Texte au choix dans une liste de textes.json, avec accords selon le genre. */
B.tChoix = function (cle, n, vars, genre) {
  let s = B.DATA.textes[cle];
  if (s == null) { B.textesManquants[cle] = true; return ''; }
  if (Array.isArray(s)) s = s[Math.abs(n | 0) % s.length];
  const f = genre === 'f';
  const accords = { e: f ? 'e' : '', ere: f ? 'ère' : 'er', le: f ? 'la' : 'le', nerveux: f ? 'nerveuse' : 'nerveux', il: f ? 'elle' : 'il', Il: f ? 'Elle' : 'Il' };
  return String(s).replace(/\{(\w+)\}/g, function (m, k) {
    if (vars && vars[k] != null) return vars[k];
    if (accords[k] != null) return accords[k];
    return m;
  });
};

/* ---------- Salaires : grille officielle HCR × coefficient du lieu ---------- */
B.equipe.echelon = function (exp) {
  for (const e of B.DATA.equipe.echelonSelonExperience) if (exp <= e.jusqua) return e.echelon;
  return 3;
};
B.equipe.minimum = function (S, poste, exp) {
  const P = B.equipe.poste(poste), G = B.DATA.equipe.grilleHCR;
  let h = G[P.niveauHCR][B.equipe.echelon(exp) - 1];
  if (P.partDuMinimum) h = G.I[0] * P.partDuMinimum;
  return Math.round(h * Math.max(1, B.lieu(S.lieu).salaires) * 100) / 100;
};
B.equipe.parMois = function (horaire) { return horaire * B.DATA.equipe.heuresParMois39h; };
B.equipe.euroHeure = function (n) { return n.toFixed(2).replace('.', ',') + '\u00A0€'; };

/* ---------- Composition ---------- */
/* Ceux qui sont au travail aujourd'hui (pas en repos ni en formation). */
B.equipe.salle = function (S) { return S.equipe.filter(function (p) { return p.service === 'salle' && !p.absent; }); };
B.equipe.cuisine = function (S) { return S.equipe.filter(function (p) { return p.service === 'cuisine' && !p.absent; }); };
B.equipe.duService = function (S, service) { return S.equipe.filter(function (p) { return p.service === service && !p.absent; }); };
/* Ceux qui restent (sans compter les absents du jour ni les personnes renvoyées qui finissent leur tâche). */
B.equipe.actifs = function (S, service) { return S.equipe.filter(function (p) { return p.service === service && !p.partant && !p.absent; }); };
B.equipe.patron = function (S) { return S.equipe.find(function (p) { return p.patron; }); };
B.equipe.peutOuvrir = function (S) { return B.equipe.actifs(S, 'salle').length > 0 && B.equipe.actifs(S, 'cuisine').length > 0; };
B.equipe.coutMensuel = function (S) {
  return S.equipe.reduce(function (s, p) { return s + (p.patron || p.partant || p.interim ? 0 : B.equipe.parMois(p.salaire)); }, 0);
};

/* Place de repos d'une personne de salle (près de la passe) ou de cuisine (près des fourneaux). */
B.equipe.base = function (S, p) {
  const P = B.DATA.salle;
  if (p.service === 'salle') {
    const i = B.equipe.salle(S).indexOf(p);
    return { x: P.passe.x - 12 - Math.floor(i / 2) * 36, y: i % 2 ? P.allee + 20 : P.allee - 20 };
  }
  const k = P.cuisine;
  if (p.service === 'bar') { const b = Math.max(0, B.equipe.duService(S, 'bar').indexOf(p)); return { x: P.passe.x - 22 + (b % 2) * 44, y: 50 + Math.floor(b / 2) * 40 }; }
  if (p.service === 'plonge') { const b = Math.max(0, B.equipe.duService(S, 'plonge').indexOf(p)); return { x: k.x + 36 + (b % 2) * 60, y: k.y + k.hauteur - 34 }; }
  if (p.service === 'nettoyage') { const b = Math.max(0, B.equipe.duService(S, 'nettoyage').indexOf(p)); return { x: 60 + b * 44, y: 40 }; }
  const j = Math.max(0, B.equipe.cuisine(S).indexOf(p));
  return { x: k.x + 36 + (j % 2) * 60, y: k.y + 178 + Math.floor(j / 2) * 58 };
};

B.equipe.nouveauMembre = function (S, o) {
  const p = {
    id: S.prochainId++, nom: o.nom, genre: o.genre || 'm', poste: o.poste, patron: !!o.patron,
    service: o.service || (B.equipe.poste(o.poste) ? B.equipe.poste(o.poste).service : 'salle'),
    note: o.note, vitesse: o.vitesse, amabilite: o.amabilite, qualite: o.qualite,
    salaire: o.salaire || 0, experience: o.experience || 0, perso: o.perso || null,
    x: 0, y: 0, chemin: [], tache: null
  };
  if (o.interim) { p.interim = true; p.jourInterim = S.jour; }
  else if (!p.patron) p.embauche = S.jour;
  if (B.equipe.aDesRepos(p)) {
    p.repos = B.planning.choisirRepos(S, p); p.absent = null; p.formation = null; p.formations = []; p.sommelier = false; p.pourboires = 0;
  }
  S.equipe.push(p);
  const b = B.equipe.base(S, p); p.x = b.x; p.y = b.y;
  return p;
};

B.equipe.creerPatron = function (S) {
  const d = B.DATA.equipe.patron;
  return B.equipe.nouveauMembre(S, { nom: d.nom, poste: 'patron', patron: true, service: 'salle', note: 5, vitesse: d.vitesse, qualite: d.qualite, amabilite: d.amabilite });
};

/* Le patron change de poste (salle ↔ cuisine), sauf s'il laisserait un poste vide. */
B.equipe.patronPeutChanger = function (S) {
  const p = B.equipe.patron(S);
  if (!p) return false;
  return B.equipe.actifs(S, p.service).length > 1;
};
B.equipe.changerPatron = function (S) {
  const p = B.equipe.patron(S);
  if (!B.equipe.patronPeutChanger(S)) return false;
  B.equipe.liberer(S, p);
  p.service = p.service === 'salle' ? 'cuisine' : 'salle';
  B.equipe.replacer(S);
  return true;
};

/* ---------- Effectif : les 16 places fixées dans Chez YaYa (le patron et les intérimaires en plus) ---------- */
B.equipe.place = function (poste) {
  return B.DATA.equipe.effectif.places.find(function (pl) { return pl.postes.indexOf(poste) >= 0; }) || null;
};
B.equipe.placeRecrutable = function (pl) { return pl.postes.some(function (k) { return B.equipe.poste(k).recrutable; }); };
B.equipe.titulaires = function (S) { return S.equipe.filter(function (p) { return !p.patron && !p.interim && !p.partant; }); };
B.equipe.occupes = function (S, pl) { return B.equipe.titulaires(S).filter(function (p) { return pl.postes.indexOf(p.poste) >= 0; }).length; };
B.equipe.placeLibre = function (S, poste) { const pl = B.equipe.place(poste); return !pl || B.equipe.occupes(S, pl) < pl.nombre; };
B.equipe.effectif = function (S) {
  const E = B.DATA.equipe.effectif, r = { n: 0, total: E.total, groupes: {} };
  Object.keys(E.groupes).forEach(function (g) { r.groupes[g] = 0; });
  E.places.forEach(function (pl) { const n = B.equipe.occupes(S, pl); r.groupes[pl.groupe] += n; r.n += n; });
  return r;
};

/* ---------- Intérim : un remplaçant pour la journée, sur une place vide ---------- */
/* Places vides ou dont le titulaire est absent aujourd'hui, pour les postes de ce service (salle ou cuisine). */
B.equipe.placesVides = function (S, service) {
  return B.DATA.equipe.effectif.places.reduce(function (s, pl) {
    if (!pl.postes.some(function (k) { return B.equipe.poste(k).service === service; })) return s;
    const la = B.equipe.titulaires(S).filter(function (p) { return pl.postes.indexOf(p.poste) >= 0 && !p.absent; }).length;
    return s + Math.max(0, pl.nombre - la);
  }, 0);
};
B.equipe.interimaires = function (S, service) { return S.equipe.filter(function (p) { return p.interim && !p.partant && (!service || p.service === service); }); };
B.equipe.salaireInterim = function (S, service) {
  return Math.round(B.equipe.minimum(S, B.DATA.equipe.interim.postes[service], B.DATA.equipe.interim.experience) * (1 + B.DATA.equipe.interim.majoration) * 100) / 100;
};
/* Renvoie null si on peut appeler un intérimaire pour ce service, sinon la clé du texte qui explique pourquoi. */
B.equipe.interimPossible = function (S, service) {
  if (!S.dejaOuvert) return 'interim_jour1';
  if (B.equipe.placesVides(S, service) <= B.equipe.interimaires(S, service).length) return 'interim_complet_' + service;
  return null;
};
B.equipe.appelerInterim = function (S, service, auto) {
  if (B.equipe.interimPossible(S, service)) return null;
  const I = B.DATA.equipe.interim, D = B.DATA.equipe, poste = I.postes[service];
  const pr = D.prenoms[B.entier(S, 0, D.prenoms.length - 1)];
  const noms = D.noms.concat(B.lieu(S.lieu).nomsClients);
  const p = B.equipe.nouveauMembre(S, {
    nom: pr[0] + ' ' + noms[B.entier(S, 0, noms.length - 1)], genre: pr[1], poste: poste, service: service,
    note: I.note, vitesse: I.vitesse, qualite: I.qualite, amabilite: I.amabilite, experience: I.experience,
    salaire: B.equipe.salaireInterim(S, service), interim: true
  });
  B.equipe.replacer(S);
  if (auto) B.message(S, 'msg_interim_auto', { nom: p.nom });
  else B.message(S, 'msg_interim', { nom: p.nom, poste: B.equipe.nomPoste(p), salaire: B.equipe.euroHeure(p.salaire) });
  return p;
};
/* Le matin : les intérimaires de la veille repartent, on regarde qui est en repos ou en formation ;
   si l'option est active et qu'il manque quelqu'un pour ouvrir, un intérimaire est appelé automatiquement (dernier recours). */
B.equipe.matin = function (S) {
  S.equipe.filter(function (p) { return p.demission && !p.partant && !p.interim; }).forEach(function (p) { if (p.formation) B.planning.annuler(S, p); B.message(S, 'msg_ev_raise_parti', { nom: p.nom }); });
  S.equipe = S.equipe.filter(function (p) { return !p.partant && !p.interim && !p.demission; });
  B.planning.matin(S);
  B.equipe.replacer(S);
  if (S.proprete != null && S.proprete < B.DATA.equipe.effets.proprete.seuilEtoiles) B.message(S, 'msg_salle_sale', { n: S.proprete });
  if (S.interimAuto && S.dejaOuvert) {
    ['salle', 'cuisine'].forEach(function (sv) {
      if (!B.equipe.actifs(S, sv).length) B.equipe.appelerInterim(S, sv, true);
    });
  }
};

/* ---------- Renvoyer un employé ---------- */
B.equipe.enService = function (S) { return !!S.ouvert && !S.finJour; };
/* Renvoie null si c'est possible, sinon la clé du texte qui explique pourquoi. */
B.equipe.peutRenvoyer = function (S, p) {
  if (!p || p.patron) return 'renvoi_patron';
  if (p.partant) return 'renvoi_deja';
  if (B.equipe.enService(S) && (p.service === 'salle' || p.service === 'cuisine') &&
      B.equipe.actifs(S, p.service).length <= 1) return p.service === 'salle' ? 'renvoi_salle_vide' : 'renvoi_cuisine_vide';
  return null;
};
/* Hors service, il part tout de suite. En plein service, il finit sa tâche en cours puis part. */
B.equipe.renvoyer = function (S, p) {
  if (B.equipe.peutRenvoyer(S, p)) return false;
  const ind = B.argent.indemnite(S, p);
  /* sa journée lui est payée tout de suite (le soir, on ne paie que ceux qui restent), puis l'indemnité */
  if (S.dejaOuvert && S.ouvert && !S.finJour) B.argent.payer(S, p.interim ? 'interim' : 'salaires', B.r2(B.argent.salaireJour(p)));
  if (ind.montant > 0) B.argent.payer(S, 'indemnites', ind.montant);
  p.partant = true;
  B.message(S, 'msg_renvoi', { nom: p.nom, e: p.genre === 'f' ? 'e' : '' });
  if (ind.montant > 0) B.message(S, 'msg_indemnite', { nom: p.nom, montant: B.euros(ind.montant) });
  if (!B.equipe.enService(S) || !B.equipe.occupe(S, p)) B.equipe.retirer(S, p, false);
  return true;
};
B.equipe.occupe = function (S, p) {
  if (p.service === 'salle') return !!p.tache;
  if (p.service === 'cuisine') return S.groupes.some(function (g) { return g.etat === 'cuisine' && g.cuisinier === p.id; });
  return false;
};
B.equipe.retirer = function (S, p, apresTache) {
  B.equipe.liberer(S, p);
  if (p.formation && p.absent !== 'formation') B.planning.annuler(S, p);
  S.equipe = S.equipe.filter(function (x) { return x.id !== p.id; });
  B.equipe.replacer(S);
  if (apresTache) B.message(S, 'msg_renvoi_parti', { nom: p.nom });
};
/* Appelé à chaque pas : les personnes renvoyées qui ont fini leur tâche s'en vont. */
B.equipe.departs = function (S) {
  S.equipe.filter(function (p) { return p.partant && !B.equipe.occupe(S, p); })
    .forEach(function (p) { B.equipe.retirer(S, p, true); });
};

/* Quand quelqu'un quitte son poste : ce qu'il faisait est repris par les autres. */
B.equipe.liberer = function (S, p) {
  if (p.tache) {
    if (p.tache.groupe) { const g = S.groupes.find(function (x) { return x.id === p.tache.groupe; }); if (g) g.serveur = null; }
    if (p.tache.table) { const t = B.salle.tableDe(S, p.tache.table); if (t) t.serveur = null; }
  }
  p.tache = null; p.chemin = [];
  S.groupes.forEach(function (g) { if (g.cuisinier === p.id && g.etat === 'cuisine') { g.cuisinier = null; g.pret = null; } });
};
B.equipe.replacer = function (S) {
  S.equipe.forEach(function (p) {
    if (p.service !== 'salle') { const b = B.equipe.base(S, p); p.x = b.x; p.y = b.y; p.chemin = []; p.tache = null; }
    else if (p.x > B.DATA.salle.cuisine.x - 20) { p.x = B.DATA.salle.passe.x; p.y = B.DATA.salle.allee; p.chemin = []; }
  });
};

/* ---------- Candidats ---------- */
B.equipe.candidat = function (S, poste) {
  const D = B.DATA.equipe, P = D.postes[poste];
  const noms = D.noms.concat(B.lieu(S.lieu).nomsClients);
  const pris = S.equipe.map(function (x) { return x.nom; }).concat(S.candidats.map(function (x) { return x.nom; }));
  let pr, nom, essai = 0;
  do { pr = D.prenoms[B.entier(S, 0, D.prenoms.length - 1)]; nom = pr[0] + ' ' + noms[B.entier(S, 0, noms.length - 1)]; } while (pris.indexOf(nom) >= 0 && ++essai < 8);
  const note = B.entier(S, P.niveauJeu[0], P.niveauJeu[1]);
  const age = B.entier(S, 19, 55);
  const exp = Math.max(0, Math.min(age - 18, Math.round((note - 2) * 1.6 + B.entre(S, -2, 3))));
  const varie = function () { return Math.max(1, Math.min(10, note + B.entier(S, -2, 2))); };
  const perso = D.personnalites[B.entier(S, 0, D.personnalites.length - 1)];
  const min = B.equipe.minimum(S, poste, exp);
  const demande = Math.round(min * (1 + Math.max(0, (note - 4) * 0.03) + perso.exigence + B.entre(S, 0, 0.06)) * 10) / 10;
  return {
    id: S.prochainId++, nom: nom, genre: pr[1], poste: poste,
    age: age, experience: exp, note: note, vitesse: varie(), amabilite: varie(), qualite: varie(),
    perso: perso.id, minimum: min, demande: Math.max(min, demande), offre: min,
    reponses: [], revele: {}, refus: 0, dernierMot: null, graineTexte: B.entier(S, 0, 9999)
  };
};

B.equipe.genererDepart = function (S) {
  S.candidats = [];
  B.DATA.equipe.candidatsDepart.forEach(function (p) { S.candidats.push(B.equipe.candidat(S, p)); });
};

B.equipe.nouveauxCandidats = function (S) {
  const N = B.DATA.equipe.nouveauxCandidatsParJour;
  let n = Math.min(B.entier(S, N.min, N.max), Math.max(0, N.plafond - S.candidats.length));
  const postes = Object.keys(B.DATA.equipe.postes).filter(function (k) { return B.DATA.equipe.postes[k].recrutable && B.equipe.placeLibre(S, k); });
  if (!postes.length) n = 0;
  for (let i = 0; i < n; i++) S.candidats.push(B.equipe.candidat(S, postes[B.entier(S, 0, postes.length - 1)]));
  if (n > 0) B.message(S, 'msg_nouveaux_candidats', { n: n });
};

B.equipe.perso = function (id) { return B.DATA.equipe.personnalites.find(function (p) { return p.id === id; }) || B.DATA.equipe.personnalites[0]; };
B.equipe.adj = function (c) { const p = B.equipe.perso(c.perso); return c.genre === 'f' ? p.adjF : p.adj; };
B.equipe.texteExperience = function (c) {
  if (c.experience === 0) return B.t(c.genre === 'f' ? 'equipe_experience_0F' : 'equipe_experience_0');
  if (c.experience === 1) return B.t('equipe_experience_1');
  return B.t('equipe_experience_n', { n: c.experience });
};

/* ---------- Entretien ---------- */
B.equipe.questions = function (c) {
  const service = B.equipe.famille(B.equipe.poste(c.poste).service);
  return ['parcours', 'rush', service === 'cuisine' ? 'qualite_cuisine' : 'qualite_salle', 'salaire'];
};
B.equipe.niveau3 = function (v) { return v <= 3 ? 0 : v <= 6 ? 1 : 2; };

B.equipe.repondre = function (S, c, q) {
  if (c.reponses.some(function (r) { return r.q === q; })) return null;
  const service = B.equipe.famille(B.equipe.poste(c.poste).service), g = c.genre, n = c.graineTexte + c.reponses.length * 7;
  let corps;
  if (q === 'parcours') corps = B.tChoix('r_parcours_' + service + '_' + (c.experience === 0 ? 0 : c.experience < 5 ? 1 : 2), n, { exp: c.experience }, g);
  else if (q === 'rush') { corps = B.tChoix('r_rush_' + B.equipe.niveau3(c.vitesse), n, null, g); c.revele.vitesse = true; }
  else if (q === 'qualite_salle') { corps = B.tChoix('r_qualite_salle_' + B.equipe.niveau3(c.amabilite), n, null, g); c.revele.amabilite = true; }
  else if (q === 'qualite_cuisine') { corps = B.tChoix('r_qualite_cuisine_' + B.equipe.niveau3(c.qualite), n, null, g); c.revele.qualite = true; }
  else if (q === 'salaire') { corps = B.tChoix('r_salaire', n, { salaire: B.equipe.euroHeure(c.demande) }, g); c.revele.salaire = true; c.offre = Math.max(c.offre, c.demande); }
  else return null;
  const intro = B.tChoix('intro_' + c.perso, n + 1, null, g);
  if (intro && !/[.!?…]\s*$/.test(intro)) corps = corps.charAt(0).toLowerCase() + corps.slice(1);
  const fin = B.DATA.textes['fin_' + c.perso] ? B.tChoix('fin_' + c.perso, n + 2, null, g) : '';
  const texte = '« ' + intro + corps + fin + ' »';
  c.reponses.push({ q: q, texte: texte });
  return texte;
};

/* Le joueur propose un salaire horaire. Réponse : accepte, contre-proposition ou refus. */
B.equipe.proposer = function (S, c, offre) {
  if (!B.equipe.placeLibre(S, c.poste)) { c.dernierMot = B.t('entretien_complet'); return { r: 'complet' }; }
  offre = Math.max(c.minimum, Math.round(offre * 100) / 100);
  c.offre = offre;
  const perso = B.equipe.perso(c.perso);
  if (offre >= c.demande * (1 - perso.souplesse) - 0.001) {
    const p = B.equipe.nouveauMembre(S, { nom: c.nom, genre: c.genre, poste: c.poste, note: c.note, vitesse: c.vitesse, amabilite: c.amabilite, qualite: c.qualite, salaire: offre, experience: c.experience, perso: c.perso });
    S.candidats = S.candidats.filter(function (x) { return x.id !== c.id; });
    B.message(S, 'msg_embauche', { nom: c.nom, poste: B.equipe.nomPoste(p), salaire: B.equipe.euroHeure(offre) });
    c.dernierMot = B.t('entretien_accepte');
    return { r: 'accepte', membre: p };
  }
  if (offre >= c.demande * 0.92) {
    c.dernierMot = B.t('entretien_contre', { salaire: B.equipe.euroHeure(c.demande) });
    c.revele.salaire = true;
    return { r: 'contre' };
  }
  c.refus++;
  if (c.refus >= B.DATA.equipe.refusAvantDepart) {
    S.candidats = S.candidats.filter(function (x) { return x.id !== c.id; });
    B.message(S, 'msg_candidat_parti', { nom: c.nom });
    c.dernierMot = B.t('entretien_part');
    return { r: 'part' };
  }
  c.dernierMot = B.t('entretien_refus');
  return { r: 'refus' };
};

/* Facteur de vitesse d'une personne : 1 pour une vitesse de 5, plus rapide au-dessus. */
B.equipe.facteurSalle = function (p) { return 0.8 + 0.04 * (p.vitesse || 5); };
B.equipe.facteurCuisine = function (p) { return 1.25 - 0.05 * (p.vitesse || 5); };

/* ==== src/moteur/planning.js ==== */
/* planning.js — étape 4 (équipe) : jours de repos, absences, formations, cagnotte des pourboires,
   propreté, et effet des postes et des qualités sur le service. Données : donnees/equipe.json. */
B.planning = {};

/* Jour de la semaine (0 = dimanche) du jour de jeu n (par défaut aujourd'hui). */
B.jourSemaine = function (S, n) { return B.dateDuJour(S, (n == null ? S.jour : n) - S.jour).getUTCDay(); };
B.equipe.famille = function (service) { return B.DATA.equipe.familles[service] || 'cuisine'; };
B.equipe.present = function (p) { return !p.absent; };
B.equipe.aDesRepos = function (p) { return !p.patron && !p.interim; };

/* ---------- Jours de repos : 2 jours qui se suivent ---------- */
B.planning.paires = function () { return B.DATA.equipe.planning.ordrePreference; };
B.planning.estRepos = function (p, js) { return !!(p.repos && p.repos.indexOf(js) >= 0); };
/* Choisit les 2 jours de repos qui gênent le moins : le moins de collègues du même service déjà absents ces jours-là. */
B.planning.choisirRepos = function (S, p) {
  let best = null, bestScore = Infinity;
  B.planning.paires().forEach(function (pr, k) {
    let meme = 0, tous = 0;
    S.equipe.forEach(function (x) {
      if (x === p || !B.equipe.aDesRepos(x) || x.partant || !x.repos) return;
      const n = pr.filter(function (j) { return x.repos.indexOf(j) >= 0; }).length;
      tous += n; if (x.service === p.service) meme += n;
    });
    const score = meme * 100 + tous * 10 + k;
    if (score < bestScore) { bestScore = score; best = pr; }
  });
  return best.slice();
};
/* Décale les jours de repos d'un jour (sens +1 ou −1). Prend effet dès le lendemain. */
B.planning.decaler = function (S, p, sens) {
  if (!B.equipe.aDesRepos(p) || !p.repos) return false;
  const a = (p.repos[0] + (sens < 0 ? 6 : 1)) % 7;
  p.repos = [a, (a + 1) % 7];
  return true;
};
/* Combien de personnes travaillent ce jour de la semaine, par service (le patron compte dans le sien). */
B.planning.couverture = function (S, js) {
  const r = { salle: 0, bar: 0, cuisine: 0, plonge: 0, nettoyage: 0 };
  S.equipe.forEach(function (p) {
    if (p.interim || p.partant) return;
    if (B.planning.estRepos(p, js)) return;
    r[p.service] = (r[p.service] || 0) + 1;
  });
  return r;
};

/* Le matin : formations terminées, puis qui est absent aujourd'hui (repos ou formation). */
B.planning.matin = function (S) {
  const js = B.jourSemaine(S);
  const repos = [], formation = [];
  S.equipe.forEach(function (p) {
    if (p.absent === 'formation' && p.formation) B.planning.finirFormation(S, p);
    p.absent = null;
    if (!B.equipe.aDesRepos(p)) return;
    if (!p.repos) p.repos = B.planning.choisirRepos(S, p);
    if (B.planning.estRepos(p, js)) { p.absent = 'repos'; repos.push(B.prenom(p)); }
    else if (p.formation) { p.absent = 'formation'; p.formation.jour = S.jour; formation.push(B.prenom(p)); }
  });
  if (repos.length) B.message(S, 'msg_repos_du_jour', { liste: repos.join(', ') });
  if (formation.length) B.message(S, 'msg_formation_du_jour', { liste: formation.join(', ') });
};
B.prenom = function (p) { return String(p.nom).split(' ')[0]; };

/* ---------- Formations ---------- */
B.planning.formation = function (id) { return B.DATA.equipe.formations.liste.find(function (f) { return f.id === id; }); };
/* Formations proposées à une personne, avec leur prix et pourquoi elles ne sont pas possibles (clé de texte) . */
B.planning.formationsPour = function (S, p) {
  const F = B.DATA.equipe.formations;
  return F.liste.filter(function (f) { return f.services.indexOf(p.service) >= 0; }).map(function (f) {
    let prix, non = null;
    if (f.stat) {
      prix = f.prixParPoint * ((p[f.stat] || 5) + 1);
      if ((p[f.stat] || 0) >= F.max) non = 'form_non_max';
    } else { prix = f.prix; if (p.sommelier) non = 'form_non_deja'; }
    if (!non && p.formation) non = 'form_non_inscrit';
    if (!non && p.partant) non = 'form_non_partant';
    if (!non && S.argent < prix) non = 'form_non_argent';
    return { id: f.id, stat: f.stat || null, prix: prix, non: non };
  });
};
B.planning.inscrire = function (S, p, id) {
  if (!B.equipe.aDesRepos(p)) return { erreur: 'form_non_partant' };
  const o = B.planning.formationsPour(S, p).find(function (x) { return x.id === id; });
  if (!o) return { erreur: 'form_non_partant' };
  if (o.non) return { erreur: o.non };
  B.argent.payer(S, 'formations', o.prix);
  p.formation = { id: id, prix: o.prix, jour: null };
  B.message(S, 'msg_formation_inscrit', { nom: p.nom, formation: B.t('form_nom_' + id), prix: B.euros(o.prix) });
  return { ok: true };
};
/* Annuler avant qu'elle commence : remboursée. */
B.planning.annuler = function (S, p) {
  if (!p.formation || p.absent === 'formation') return false;
  B.argent.payer(S, 'formations', -p.formation.prix);
  B.message(S, 'msg_formation_annulee', { nom: p.nom, prix: B.euros(p.formation.prix) });
  p.formation = null;
  return true;
};
B.planning.finirFormation = function (S, p) {
  const f = B.planning.formation(p.formation.id);
  p.formations = (p.formations || []).concat([p.formation.id]);
  if (f && f.stat) {
    p[f.stat] = Math.min(B.DATA.equipe.formations.max, (p[f.stat] || 5) + 1);
    p.note = Math.max(p.note || 0, Math.min(10, Math.round((p.vitesse + p.amabilite + p.qualite) / 3)));
  } else if (f) p.sommelier = true;
  B.message(S, 'msg_formation_finie', { nom: p.nom, formation: B.t('form_nom_' + p.formation.id) });
  p.formation = null;
};

/* ---------- Cagnotte des pourboires : partagée le dernier soir du mois ---------- */
B.planning.beneficiaires = function (S) { return S.equipe.filter(function (p) { return B.equipe.aDesRepos(p) && !p.partant; }); };
B.planning.dernierJourDuMois = function (S) { return B.mois(S, 1) !== B.mois(S); };
B.planning.partager = function (S) {
  const pot = B.r2(S.cagnotte || 0), gens = B.planning.beneficiaires(S);
  if (!(pot > 0) || !gens.length) return null;
  const part = Math.floor(pot / gens.length * 100) / 100;
  if (!(part > 0)) return null;
  gens.forEach(function (p) { p.pourboires = B.r2((p.pourboires || 0) + part); });
  S.cagnotte = B.r2(pot - part * gens.length);
  const d = B.dateDuJour(S);
  const r = { jour: S.jour, mois: d.getUTCMonth(), annee: d.getUTCFullYear(), total: pot, n: gens.length, part: part, reste: S.cagnotte, noms: gens.map(function (p) { return p.nom; }) };
  S.partages = [r].concat(S.partages || []).slice(0, B.DATA.equipe.cagnotte.historique);
  B.message(S, 'msg_cagnotte_partagee', { total: B.prix(pot), n: gens.length, part: B.prix(part) });
  return r;
};

/* ---------- Propreté du restaurant (0 à 100) ---------- */
B.planning.nettoyageDuSoir = function (S) {
  const P = B.DATA.equipe.effets.proprete;
  const sale = (S.stats.jour.couverts || 0) * P.salissureParCouvert;
  let propre = P.nettoyageEquipe;
  B.equipe.presents(S, 'nettoyage').forEach(function (p) { propre += P.agentBase + P.agentParVitesse * (p.vitesse || 5) + P.agentParQualite * (p.qualite || 5); });
  const avant = S.proprete == null ? P.depart : S.proprete;
  S.proprete = Math.round(Math.max(0, Math.min(100, avant - sale + propre)));
  return { avant: avant, apres: S.proprete, sale: Math.round(sale), propre: Math.round(propre) };
};
/* Étoiles perdues quand la salle est sale (0 au-dessus du seuil). */
B.planning.malusProprete = function (S) {
  const P = B.DATA.equipe.effets.proprete, v = S.proprete == null ? P.depart : S.proprete;
  return v >= P.seuilEtoiles ? 0 : P.etoilesMax * (P.seuilEtoiles - v) / P.seuilEtoiles;
};
/* Chance qu'un groupe qui arrive fasse demi-tour en voyant la salle sale. */
B.planning.fuiteProprete = function (S) {
  const P = B.DATA.equipe.effets.proprete, v = S.proprete == null ? P.depart : S.proprete;
  return v >= P.seuilDepart ? 0 : P.departMax * (P.seuilDepart - v) / P.seuilDepart;
};

/* ---------- Effets des postes et des qualités ---------- */
B.equipe.presents = function (S, service) { return S.equipe.filter(function (p) { return p.service === service && !p.absent && !p.partant; }); };
B.equipe.aLePoste = function (S, poste) { return S.equipe.some(function (p) { return p.poste === poste && !p.absent && !p.partant; }); };
/* Bonus de qualité en cuisine : le chef relit les assiettes des autres ; le second le remplace s'il n'est pas là. */
B.equipe.qualiteCuisson = function (S, cuisinier) {
  const E = B.DATA.equipe.effets;
  if (!cuisinier) return 5;
  let q = cuisinier.qualite || 5;
  const chef = B.equipe.aLePoste(S, 'chef'), second = B.equipe.aLePoste(S, 'second');
  if ((chef && cuisinier.poste !== 'chef') || (!chef && second && cuisinier.poste !== 'second')) q += E.chefBonusQualite;
  return Math.min(10, q);
};
/* Plonge : sans plongeur, les cuisiniers lavent eux-mêmes la vaisselle et vont moins vite. */
B.equipe.facteurPlonge = function (S) {
  const E = B.DATA.equipe.effets;
  const v = B.equipe.presents(S, 'plonge').reduce(function (s, p) { return s + (p.vitesse || 5); }, 0);
  return E.sansPlongeur - (E.sansPlongeur - 1) * Math.min(1, v / E.plongeVitessePleine);
};
/* Bar : un barman prépare les boissons, le serveur n'a plus qu'à les prendre. */
B.equipe.tempsBoisson = function (S) {
  const T = B.DATA.stocks.boissons.tempsParBoisson, bar = B.equipe.presents(S, 'bar');
  if (!bar.length) return T;
  const v = Math.max.apply(null, bar.map(function (p) { return p.vitesse || 5; }));
  return T * B.DATA.equipe.effets.barmanTempsBoisson * B.equipe.facteurCuisine({ vitesse: v });
};
B.equipe.sommelierPresent = function (S) {
  return S.equipe.some(function (p) { return p.sommelier && !p.absent && !p.partant && (p.service === 'salle' || p.service === 'bar'); });
};
B.equipe.capaciteCuisinier = function (p) { return p.poste === 'appr' ? B.DATA.equipe.effets.apprentiCommandes : B.DATA.equipe.commandesParCuisinier; };

/* ==== src/moteur/argent.js ==== */
/* argent.js — étape 5 « Argent » : niveaux de difficulté, salaires payés, loyer, charges, cotisations, TVA, prêt,
   indemnités de renvoi, découvert et faillite, bilans du jour et de la semaine.
   Tout ce qui coûte chaque mois est payé chaque soir, au jour le jour (1 mois = 30,42 jours). */
B.argent = {};
B.argent.D = function () { return B.DATA.argent; };
B.argent.niveau = function (S) { return B.DATA.argent.niveaux[S.difficulte] || B.DATA.argent.niveaux.facile; };
B.argent.POSTES = ['achats', 'salaires', 'interim', 'cotisations', 'loyer', 'charges', 'tva', 'pret', 'indemnites', 'formations', 'divers'];

/* ---------- Salaires ---------- */
/* Salaire d'une journée : 1/30,42 du salaire du mois (39 h) pour un employé (repos compris) ; une journée de 7 h 53 pour un intérimaire. */
B.argent.salaireJour = function (p) {
  if (!p || p.patron) return 0;
  if (p.interim) return p.salaire * B.DATA.argent.heuresInterimParJour;
  return p.salaire * B.DATA.equipe.heuresParMois39h / B.DATA.argent.joursParMois;
};
B.argent.payes = function (S) { return S.equipe.filter(function (p) { return !p.patron && !p.partant; }); };

/* ---------- Loyer, charges, prêt ---------- */
B.argent.loyerMois = function (S) {
  if (B.argent.niveau(S).proprietaire) return 0;
  return Math.round(B.lieu(S.lieu).valeurLocal * B.DATA.argent.loyer.partDeLaValeurParAn / 12);
};
B.argent.chargesMois = function (S) {
  const k = B.lieu(S.lieu).prix;
  return B.DATA.argent.charges.liste.map(function (c) { return { id: c.id, mois: Math.round(c.mois * k) }; });
};
B.argent.mensualite = function (montant, tauxAnnuel, mois) {
  const r = tauxAnnuel / 12;
  if (!r) return montant / mois;
  return montant * r / (1 - Math.pow(1 + r, -mois));
};
B.argent.creerPret = function (S) {
  const P = B.argent.niveau(S).pret;
  if (!P) return null;
  return { montant: P.montant, restant: P.montant, taux: P.tauxAnnuel, mois: P.mois,
    mensualite: B.r2(B.argent.mensualite(P.montant, P.tauxAnnuel, P.mois)), interets: 0, jourDebut: S.jour };
};

/* Ce que coûte une journée avec l'équipe d'aujourd'hui (sans les achats, la TVA ni les intérimaires). */
B.argent.prevision = function (S) {
  const N = B.argent.niveau(S), jm = B.DATA.argent.joursParMois;
  const sal = B.argent.payes(S).filter(function (p) { return !p.interim; }).reduce(function (s, p) { return s + B.argent.salaireJour(p); }, 0);
  const ch = B.argent.chargesMois(S).reduce(function (s, c) { return s + c.mois; }, 0);
  const o = { salaires: B.r2(sal), cotisations: B.r2(sal * N.cotisations), loyer: B.r2(B.argent.loyerMois(S) / jm), charges: B.r2(ch / jm),
    pret: S.pret && S.pret.restant > 0 ? B.r2(S.pret.mensualite / jm) : 0 };
  o.total = B.r2(o.salaires + o.cotisations + o.loyer + o.charges + o.pret);
  return o;
};

/* ---------- Dépenses ponctuelles (achats, formations, indemnités) ---------- */
/* Une fois le bilan du soir fait, ce qui est payé dans la nuit compte pour le lendemain. */
B.argent.compter = function (S, cle, montant) {
  if (S.finJour && S.bilan) {
    S.reporte = S.reporte || {};
    S.reporte[cle] = B.r2((S.reporte[cle] || 0) + montant);
  } else {
    S.stats.jour[cle] = B.r2((S.stats.jour[cle] || 0) + montant);
  }
};
B.argent.payer = function (S, cle, montant) {
  S.argent = B.r2(S.argent - montant);
  B.argent.compter(S, cle, montant);
};
/* Peut-on payer cette somme ? Les achats de produits peuvent aller jusqu'au découvert autorisé par la banque. */
B.argent.peutPayer = function (S, montant, avecDecouvert) {
  return S.argent - montant >= (avecDecouvert ? -B.DATA.argent.decouvertAutorise : 0) - 1e-9;
};

/* ---------- Indemnité de renvoi ---------- */
B.argent.anciennete = function (S, p) { return Math.max(0, S.jour - (p.embauche || S.jour)); };
B.argent.indemnite = function (S, p) {
  const I = B.DATA.argent.indemnites;
  if (!p || p.patron || p.interim) return { montant: 0, raison: 'indem_interim' };
  const anc = B.argent.anciennete(S, p);
  if (anc < I.essaiJours) return { montant: 0, raison: 'indem_essai', jours: I.essaiJours - anc };
  const jour = B.argent.salaireJour(p);
  let m = jour * I.joursDeSalaire, raison = 'indem_jours';
  if (anc >= I.loiApresJours) { m += B.equipe.parMois(p.salaire) * I.loiPartDeMoisParAn * anc / 365; raison = 'indem_loi'; }
  return { montant: B.r2(m), raison: raison, jours: I.joursDeSalaire, anciennete: anc };
};

/* ---------- Le soir : on paie la journée ---------- */
B.argent.soir = function (S) {
  const st = S.stats.jour, N = B.argent.niveau(S), jm = B.DATA.argent.joursParMois;
  let sal = 0, inter = 0;
  B.argent.payes(S).forEach(function (p) { if (p.interim) inter += B.argent.salaireJour(p); else sal += B.argent.salaireJour(p); });
  /* les personnes renvoyées aujourd'hui ont déjà reçu leur journée au moment du renvoi */
  const d = {
    salaires: B.r2(sal), interim: B.r2(inter), cotisations: B.r2(sal * N.cotisations),
    loyer: B.r2(B.argent.loyerMois(S) / jm),
    charges: B.r2(B.argent.chargesMois(S).reduce(function (s, c) { return s + c.mois; }, 0) / jm),
    tva: B.r2(st.recettes * N.tva / (1 + N.tva)), pret: 0
  };
  if (S.pret && S.pret.restant > 0.005) {
    const interet = B.r2(S.pret.restant * S.pret.taux / 12 / jm);
    const capital = Math.min(S.pret.restant, B.r2(S.pret.mensualite / jm - interet));
    S.pret.restant = B.r2(S.pret.restant - capital);
    S.pret.interets = B.r2(S.pret.interets + interet);
    d.pret = B.r2(interet + capital);
    if (S.pret.restant <= 0.005) { S.pret.restant = 0; B.message(S, 'msg_pret_fini'); }
  }
  let total = 0;
  for (const k in d) { st[k] = B.r2((st[k] || 0) + d[k]); total += d[k]; }
  S.argent = B.r2(S.argent - total);
  return B.argent.journee(S);
};
/* Les comptes de la journée (recettes, chaque dépense, bénéfice). */
B.argent.journee = function (S) {
  const st = S.stats.jour, dep = {};
  let tot = 0;
  B.argent.POSTES.forEach(function (k) { dep[k] = B.r2(st[k] || 0); tot += dep[k]; });
  return { recettes: B.r2(st.recettes), depenses: dep, totalDepenses: B.r2(tot), resultat: B.r2(st.recettes - tot), caisse: S.argent };
};

/* ---------- Découvert, faillite, semaine (après le paiement du soir) ---------- */
B.argent.semaineVide = function (S, numero, debut) {
  const dep = {};
  B.argent.POSTES.forEach(function (k) { dep[k] = 0; });
  return { numero: numero, debut: debut, fin: debut, jours: 0, servis: 0, repartis: 0, recettes: 0, depenses: dep, resultat: 0, caisseDebut: null, caisseFin: null };
};
B.argent.cloturer = function (S, j, servis, repartis) {
  const A = B.DATA.argent;
  /* historique des derniers jours */
  S.historique = S.historique || [];
  S.historique.push({ jour: S.jour, servis: servis, recettes: j.recettes, depenses: j.depenses, resultat: j.resultat, caisse: S.argent });
  if (S.historique.length > A.historiqueJours) S.historique.splice(0, S.historique.length - A.historiqueJours);
  /* semaine */
  if (!S.semaine) S.semaine = B.argent.semaineVide(S, 1, S.jour);
  const w = S.semaine;
  if (w.caisseDebut == null) w.caisseDebut = B.r2(S.argent + j.totalDepenses - j.recettes);
  w.jours++; w.fin = S.jour; w.servis += servis; w.repartis += repartis;
  w.recettes = B.r2(w.recettes + j.recettes);
  B.argent.POSTES.forEach(function (k) { w.depenses[k] = B.r2((w.depenses[k] || 0) + j.depenses[k]); });
  w.resultat = B.r2(w.resultat + j.resultat);
  w.caisseFin = S.argent;
  let semaine = null;
  if (w.jours >= A.semaine.jours) {
    semaine = JSON.parse(JSON.stringify(w));
    S.semaines = S.semaines || [];
    semaine.avant = S.semaines.length ? S.semaines[0].resultat : null;
    S.semaines.unshift(semaine);
    if (S.semaines.length > A.semaine.historique) S.semaines.length = A.semaine.historique;
    S.semaine = B.argent.semaineVide(S, w.numero + 1, S.jour + 1);
  }
  /* découvert et faillite */
  let alerte = null;
  if (S.argent < 0) {
    S.decouvert = (S.decouvert || 0) + 1;
    alerte = { soir: S.decouvert, max: A.faillite.soirsDeSuite, argent: S.argent };
    if (S.decouvert >= A.faillite.soirsDeSuite) S.faillite = B.argent.raisonsFaillite(S);
  } else S.decouvert = 0;
  return { semaine: semaine, alerte: alerte, faillite: S.faillite || null };
};
/* Les 3 plus grosses dépenses des derniers jours, pour expliquer la faillite. */
B.argent.raisonsFaillite = function (S) {
  const A = B.DATA.argent, H = (S.historique || []).slice(-A.faillite.soirsDeSuite), som = {};
  let rec = 0, res = 0;
  H.forEach(function (h) { rec += h.recettes; res += h.resultat; for (const k in h.depenses) som[k] = (som[k] || 0) + h.depenses[k]; });
  const top = Object.keys(som).filter(function (k) { return som[k] > 0.5; }).sort(function (a, b) { return som[b] - som[a]; }).slice(0, 3)
    .map(function (k) { return { poste: k, montant: B.r2(som[k]) }; });
  return { jour: S.jour, argent: S.argent, soirs: S.decouvert, jours: H.length, recettes: B.r2(rec), resultat: B.r2(res), top: top };
};

/* ==== src/moteur/carte.js ==== */
/* carte.js — la carte des plats, les prix, les commandes des clients, les cuissons et le paiement.
   Catalogue repris de l'ancien jeu (donnees/catalogue.json) ; règles dans donnees/carte.json. */
B.carte = {};
B.carte.CATS = ['entree', 'plat', 'dessert'];
B.carte.TOUTES = ['entree', 'plat', 'dessert', 'boisson'];
B.carte.R = function () { return B.DATA.carte; };

/* ---------- Catalogue du lieu : ses spécialités + les classiques du bistrot ---------- */
B.carte._cache = {};
B.carte.catalogue = function (S) {
  if (B.carte._cache[S.lieu]) return B.carte._cache[S.lieu];
  const C = B.DATA.catalogue, classiques = {}, out = [], vus = {};
  C.classiques.forEach(function (d) { classiques[d.id] = d; });
  (C.specialites[S.lieu] || []).forEach(function (s) {
    const d = s.classique ? classiques[s.classique] : s;
    if (!d || vus[d.id]) return;
    vus[d.id] = true;
    out.push(Object.assign({}, d, { local: true }));
  });
  C.classiques.forEach(function (d) { if (!vus[d.id]) { vus[d.id] = true; out.push(Object.assign({}, d, { local: false })); } });
  (C.saisonniers && C.saisonniers[S.lieu] || []).forEach(function (d) { out.push(Object.assign({}, d, { local: true })); });
  (C.boissonsLocales && C.boissonsLocales[S.lieu] || []).forEach(function (d) { out.push(Object.assign({}, d, { local: true })); });
  (C.boissons || []).forEach(function (d) { out.push(Object.assign({}, d, { local: false })); });
  /* v0.8 : plats des menus de fête (à la carte seulement pendant la fête, si tu as dit oui) */
  if (B.ev) B.ev.platsDeFete(S).forEach(function (d) { if (!vus[d.id]) { vus[d.id] = true; out.push(Object.assign({}, d, { local: false })); } });
  out.forEach(function (d, i) { d.ordre = i; });
  B.carte._cache[S.lieu] = out;
  return out;
};
B.carte.plat = function (S, id) {
  const cat = B.carte.catalogue(S);
  if (!cat._index) { cat._index = {}; cat.forEach(function (d) { cat._index[d.id] = d; }); }
  return cat._index[id] || null;
};
B.carte.coefPrix = function (S) { return B.lieu(S.lieu).prix || 1; };
B.carte.prixConseille = function (S, d) {
  const a = B.DATA.carte.prix.arrondiConseille;
  return Math.max(B.DATA.carte.prix.minimum, Math.round(d.prixRef * B.carte.coefPrix(S) / a) * a);
};
/* Coût matière du jour : recette × prix de gros (Rungis) chez le fournisseur habituel, saison comprise. */
B.carte.cout = function (S, d) {
  let c = 0;
  for (const k in d.recette) c += B.stock.prixAchat(S, k, B.stock.habituel(S, k)) * d.recette[k];
  return Math.round(c * 100) / 100;
};
B.carte.enSaison = function (S, d) { if (d.fete) return B.ev.feteActive(S, d.fete); return !d.saison || d.saison.indexOf(B.mois(S)) >= 0; };
/* Les plats de fête viennent en plus de la carte : ils ne comptent pas dans le maximum. */
B.carte.horsFete = function (S, cat) { return B.carte.surCarte(S, cat).filter(function (id) { return !B.carte.plat(S, id).fete; }); };
B.carte.disponible = function (S, id) { const d = B.carte.plat(S, id); return !!d && (!S.stocks || B.stock.peutFaire(S, d.recette)); };
B.carte.marge = function (S, id) {
  const d = B.carte.plat(S, id), prix = S.carte.plats[id].prix, cout = B.carte.cout(S, d);
  return { prix: prix, cout: cout, marge: Math.round((prix - cout) * 100) / 100, pct: prix > 0 ? Math.round((prix - cout) / prix * 100) : 0, pctCout: prix > 0 ? Math.round(cout / prix * 100) : 0 };
};
B.carte.origineViande = function (S, d) {
  const I = B.DATA.catalogue.ingredients;
  const viandes = Object.keys(d.recette).filter(function (k) { return I[k] && I[k].viande; });
  if (!viandes.length) return null;

    partages: [],
    proprete: B.DATA.equipe.effets.proprete.depart,
    tickets: [],
    stats: { jour: B.statsVides(), totalServis: 0, joursJoues: 0 },
    journal: [],
    finJour: false,
    bilan: null,
    origine: null,
    pret: null,
    decouvert: 0,
    faillite: null,
    historique: [],
    semaine: null,
    semaines: [],
    reporte: {},
    cal: B.ev.etatVide(),
    objectifs: { faits: {} },
    avis: [],
    totalAvis: 0,
    michelin: null
  };
};

/* Nouvelle partie complète : le patron seul, et des candidats qui attendent leur entretien. */
B.creerPartie = function (o) {
  const S = B.nouvellePartie(o);
  S.pret = B.argent.creerPret(S);
  S.semaine = B.argent.semaineVide(S, 1, S.jour);
  B.equipe.creerPatron(S);
  B.equipe.genererDepart(S);
  B.carte.creer(S);
  B.stock.creer(S);
  B.ev.matin(S);
  return S;
};

B.ouvrir = function (S) {
  if (S.ouvert || S.faillite || !B.equipe.peutOuvrir(S)) return false;
  S.ouvert = true;
  S.dejaOuvert = true;
  B.message(S, 'msg_ouverture');
  if (S.objectifs) B.objectifs.verifier(S);
  return true;
};

/* Fait passer dt minutes de jeu, par petits pas d'un quart de minute. */
B.avancer = function (S, dt) {
  while (dt > 1e-9 && !S.finJour && S.ouvert) {
    const h = Math.min(0.25, dt);
    dt -= h;
    B.pas(S, h);
  }
};

B.pas = function (S, h) {
  const avant = S.minute;
  S.minute += h;
  B.DATA.clients.annonces.forEach(function (a) {
    if (avant < a.minute && S.minute >= a.minute) B.message(S, a.texte);
  });
  const parMinute = B.clients.affluence(S, S.minute) / 60;
  if (parMinute > 0 && B.hasard(S) < parMinute * h) B.clients.arrivee(S);
  B.ev.pas(S);
  B.stock.livrer(S);
  B.menuJour.emporter(S, h);
  B.clients.placer(S);
  if (S.objectifs) B.objectifs.verifier(S);
  B.clients.avancer(S, h);
  B.cuisine.avancer(S);
  B.service.avancer(S, h);
  B.equipe.departs(S);
  B.finDeJournee(S);
};

B.finDeJournee = function (S) {
  const J = B.DATA.clients.journee;
  if (S.minute >= J.finForcee && S.groupes.length) {
    S.groupes.forEach(function (g) {
      if (g.aMange && g.etat !== 'depart') { S.stats.jour.servis += g.taille; B.carte.payer(S, g); }
      else if (!g.aMange && g.etat !== 'depart' && g.etat !== 'repart') S.stats.jour.repartis += g.taille;   /* v0.8.1 : pas encore mangé à la fermeture forcée = reparti */
    });
    S.groupes = [];
    S.tables.forEach(function (t) { t.groupe = null; t.sale = false; t.serveur = null; t.reserve = null; });
    S.equipe.forEach(function (w) { w.tache = null; w.chemin = []; });
    B.message(S, 'msg_fin_forcee');
  }
  const salePasFaite = S.tables.some(function (t) { return t.sale; });
  if (S.minute >= J.fermeture && !S.groupes.length && (!salePasFaite || S.minute >= J.finForcee)) {
    S.finJour = true;
    B.stock.soir(S);
    const st = S.stats.jour;
    const net = B.planning.nettoyageDuSoir(S);
    const partage = B.planning.dernierJourDuMois(S) ? B.planning.partager(S) : null;
    const compte = B.argent.soir(S);
    S.bilan = {
      jour: S.jour, servis: st.servis, repartis: st.repartis,
      attente: st.nbCommandes ? Math.round(st.attenteCommande / st.nbCommandes) : 0,
      recettes: st.recettes, couverts: st.couverts, tickets: st.tickets, pourboires: st.pourboires,
      ticketMoyen: st.tickets ? Math.round(st.recettes / st.tickets * 100) / 100 : 0,
      coutMatiere: Math.round(st.coutMatiere * 100) / 100, platsRenvoyes: st.platsRenvoyes,
      meilleurPlat: B.carte.meilleurPlat(S),
      achats: B.r2(st.achats), gaspillage: st.gaspillage, gaspillagePortions: st.gaspillagePortions, jetes: st.jetes,
      ruptures: Object.keys(S.stocks.ruptures).map(function (id) { const r = S.stocks.ruptures[id]; return { nom: r.nom, cause: r.cause, vars: r.vars, refus: r.refus, debut: r.debut, fin: r.fin, manque: r.manque }; }),
      prives: st.prives || 0,
      partisRupture: st.partisRupture, mdjVendus: st.mdjVendus, emporter: st.emporter, boissons: st.boissons,
      resultat: compte.resultat, depenses: compte.depenses, totalDepenses: compte.totalDepenses, caisse: S.argent,
      formations: B.r2(st.formations || 0), partisSale: st.partisSale || 0,
      proprete: net, partage: partage, cagnotte: S.cagnotte,
      absents: S.equipe.filter(function (p) { return p.absent; }).map(function (p) { return { nom: p.nom, pourquoi: p.absent }; }),
      reputation: B.rep.note(S), repDelta: st.repDelta || 0, nbAvis: st.avis || 0,
      avisJour: (S.avis || []).filter(function (a) { return a.jour === S.jour; }),
      autoCommande: S.stocks.derniereAuto && S.stocks.derniereAuto.jour === S.jour ? S.stocks.derniereAuto.total : 0
    };
    const cl = B.argent.cloturer(S, compte, st.servis, st.repartis);
    S.bilan.semaine = cl.semaine; S.bilan.alerte = cl.alerte; S.bilan.faillite = cl.faillite;
    S.stats.totalServis += st.servis;
    S.stats.joursJoues++;
    B.message(S, 'msg_fin_service');
    if (cl.faillite) { S.ouvert = false; B.message(S, 'msg_faillite'); }
    else if (cl.alerte) B.message(S, 'msg_decouvert', { soir: cl.alerte.soir, max: cl.alerte.max });
    if (S.objectifs) B.objectifs.verifier(S);
  }
};

B.jourSuivant = function (S) {
  const P = B.DATA.salle;
  if (S.faillite) return false;
  S.jour++;
  S.minute = B.DATA.clients.journee.ouverture;
  S.stats.jour = B.statsVides();
  for (const k in (S.reporte || {})) S.stats.jour[k] = B.r2((S.stats.jour[k] || 0) + S.reporte[k]);
  S.reporte = {};
  S.finJour = false;
  B.stock.matin(S);
  S.bilan = null;
  S.groupes = [];
  B.equipe.matin(S);
  S.tables.forEach(function (t) { t.groupe = null; t.sale = false; t.serveur = null; t.reserve = null; });
  B.ev.matin(S);
  B.rep.michelinMatin(S);   /* v1.0 : étoile Michelin (ancien jeu) */
  S.equipe.forEach(function (w) { const b = B.equipe.base(S, w); w.x = b.x; w.y = b.y; w.chemin = []; w.tache = null; });
  B.equipe.nouveauxCandidats(S);
  S.ouvert = B.equipe.peutOuvrir(S);
  void P;
  return true;
};

/* Contrôle de cohérence, utilisé par le simulateur et les tests. Renvoie la liste des problèmes. */
B.verifier = function (S) {
  const pb = [];
  (function scan(o, chemin) {
    if (typeof o === 'number') {
      if (!isFinite(o)) pb.push('valeur impossible à ' + chemin);
      return;
    }
    if (o && typeof o === 'object') for (const k in o) scan(o[k], chemin + '.' + k);
  })(S, 'partie');
  const st = S.stats.jour;
  if (!isFinite(S.argent)) pb.push('argent impossible');
  if (S.stocks) for (const i in S.stocks.lots) S.stocks.lots[i].forEach(function (l) { if (!(l.q >= -1e-6)) pb.push('stock négatif : ' + i); });
  ['groupes', 'arrives', 'servis', 'repartis', 'fileMax', 'attenteCommande', 'nbCommandes', 'recettes', 'pourboires', 'couverts', 'coutMatiere', 'platsRenvoyes', 'achats', 'gaspillage'].forEach(function (k) {
    if (st[k] < 0) pb.push('compteur négatif : ' + k);
  });
  if (st.servis + st.repartis > st.arrives) pb.push('plus de clients sortis que de clients entrés');
  S.tables.forEach(function (t) {
    if (t.groupe) {
      const g = S.groupes.find(function (x) { return x.id === t.groupe; });
      if (!g) pb.push('table ' + t.id + ' occupée par un groupe disparu');
      else if (!g.tables || g.tables.indexOf(t.id) < 0) pb.push('table ' + t.id + ' et groupe ' + g.id + ' ne se correspondent pas');
    }
    if (t.groupe && t.sale) pb.push('table ' + t.id + ' occupée et sale à la fois');
    if (t.groupe && t.reserve) pb.push('table ' + t.id + ' réservée et occupée à la fois');
  });
  S.groupes.forEach(function (g) {
    const assis = ['marche', 'carte', 'commande', 'cuisine', 'pret', 'mange', 'addition'].indexOf(g.etat) >= 0;
    if (assis && !(g.tables && g.tables.length)) pb.push('groupe ' + g.id + ' sans table');
    if (assis) {
      const places = g.tables.reduce(function (s, id) { return s + B.salle.geo(id).places; }, 0);
      if (places < g.taille) pb.push('groupe ' + g.id + ' trop nombreux pour sa table');
    }
    if (['commande', 'pret', 'addition', 'cuisine'].indexOf(g.etat) >= 0 && S.minute - g.depuis > 120 * (g.etat === 'cuisine' ? B.ev.facteurCuisine(S) : 1)) pb.push('groupe ' + g.id + ' oublié depuis plus de 90 min (' + g.etat + ')');
  });
  S.equipe.forEach(function (w) {
    if (w.tache && w.tache.groupe && !S.groupes.find(function (g) { return g.id === w.tache.groupe; })) pb.push('serveur ' + w.nom + ' sert un groupe disparu');
    if (w.service === 'salle' && w.salaire < 0) pb.push('salaire négatif');
  });
  if (S.equipe.filter(function (p) { return p.patron; }).length !== 1) pb.push('il faut exactement un patron');
  S.equipe.forEach(function (p) {
    if (p.absent && (p.tache || S.groupes.some(function (g) { return g.cuisinier === p.id && g.etat === 'cuisine'; }))) pb.push(p.nom + ' travaille alors qu’il est absent');
    if (!B.equipe.aDesRepos(p)) { if (p.absent) pb.push(p.nom + ' (patron ou intérim) ne devrait pas être absent'); return; }
    if (!p.repos || p.repos.length !== 2 || (p.repos[0] + 1) % 7 !== p.repos[1]) pb.push(p.nom + ' : les 2 jours de repos ne se suivent pas');
    if (p.absent === 'repos' && !B.planning.estRepos(p, B.jourSemaine(S))) pb.push(p.nom + ' en repos un jour travaillé');
  });
  if (!(S.cagnotte >= -0.001)) pb.push('cagnotte négative');
  if (!(S.proprete >= 0 && S.proprete <= 100)) pb.push('propreté hors limites');
  S.groupes.forEach(function (g) {
    if (g.cuisinier && !S.equipe.find(function (p) { return p.id === g.cuisinier && p.service === 'cuisine'; })) pb.push('groupe ' + g.id + ' attend un cuisinier absent');
  });
  if (!B.DATA.argent.niveaux[S.difficulte]) pb.push('difficulté inconnue');
  if (S.pret && !(S.pret.restant >= 0 && S.pret.restant <= S.pret.montant + 0.01)) pb.push('prêt impossible');
  if (S.argent < -B.DATA.argent.decouvertAutorise - 50000) pb.push('argent bien trop négatif sans faillite');
  if ((S.decouvert || 0) >= B.DATA.argent.faillite.soirsDeSuite && !S.faillite) pb.push('faillite oubliée');
  S.equipe.forEach(function (p) { if (!p.patron && !p.interim && !(p.embauche >= 1)) pb.push(p.nom + ' sans jour d’embauche'); });
  if (!S.cal) pb.push('calendrier absent');
  else {
    S.cal.prives.forEach(function (e) { if (e.etat === 'reserve' && !(e.prix > 0 && e.n > 0)) pb.push('événement privé sans prix'); });
    if (S.cal.attente && S.cal.attente.id !== 'resultat' && S.cal.attente.id !== 'michelin' && !B.ev.defEvenement(S.cal.attente.id)) pb.push('événement du jour inconnu');
  }
  if (!(B.rep.note(S) >= B.rep.D().min - 1e-9 && B.rep.note(S) <= B.rep.D().max + 1e-9)) pb.push('réputation impossible');
  if (!Array.isArray(S.avis)) pb.push('avis absents');
  return pb;
};

/* ==== src/moteur/objectifs.js ==== */
/* objectifs.js — v0.9 (étape 7) : objectifs simples et progressifs (donnees/objectifs.json).
   État gardé dans S.objectifs = { faits: { id: jour } } (champ facultatif : les sauvegardes 0.8 le reçoivent au chargement). */
B.objectifs = {};
B.objectifs.liste = function () { return B.DATA.objectifs.liste; };
B.objectifs.etat = function (S) {
  if (!S.objectifs) S.objectifs = { faits: {} };
  return S.objectifs;
};
B.objectifs.total = function (S) { return (S.stats.totalServis || 0) + (S.finJour ? 0 : (S.stats.jour.servis || 0)); };

/* Où on en est pour un objectif : { fait, n, sur } (n / sur pour afficher une progression quand il y en a une). */
B.objectifs.avance = function (S, o) {
  const E = B.objectifs.etat(S);
  if (E.faits[o.id]) return { fait: true };
  const reels = S.equipe.filter(function (p) { return !p.patron && !p.interim && !p.partant; });
  switch (o.type) {
    case 'equipe': { const n = reels.filter(function (p) { return p.service === o.service; }).length; return { fait: n >= o.n, n: n, sur: o.n }; }
    case 'poste': { const n = reels.filter(function (p) { return p.poste === o.poste; }).length; return { fait: n >= o.n, n: n, sur: o.n }; }
    case 'ouvert': return { fait: !!S.dejaOuvert };
    case 'servis': { const n = B.objectifs.total(S); return { fait: n >= o.n, n: Math.min(n, o.n), sur: o.n }; }
    case 'jours': { const n = S.stats.joursJoues || 0; return { fait: n >= o.n, n: Math.min(n, o.n), sur: o.n }; }
    case 'benefice_jour': return { fait: !!(S.bilan && S.bilan.resultat > 0) };
    case 'proprete': return { fait: !!(S.bilan && S.proprete >= o.n) };
    case 'prive': return { fait: !!(S.bilan && S.bilan.prives > 0) };
    case 'benefice_semaine': return { fait: !!(S.semaines && S.semaines.length && S.semaines[0].resultat > 0) };
  }
  return { fait: false };
};

/* Le premier objectif pas encore réussi (null quand tout est fait). */
B.objectifs.courant = function (S) {
  const E = B.objectifs.etat(S);
  return B.objectifs.liste().find(function (o) { return !E.faits[o.id]; }) || null;
};

/* Coche ce qui vient d'être réussi. silencieux = pas de message (reprise d'une ancienne partie). Renvoie les ids réussis. */
B.objectifs.verifier = function (S, silencieux) {
  const E = B.objectifs.etat(S), nouveaux = [];
  B.objectifs.liste().forEach(function (o) {
    if (!E.faits[o.id] && B.objectifs.avance(S, o).fait) { E.faits[o.id] = S.jour; nouveaux.push(o.id); }
  });
  if (nouveaux.length && !silencieux) {
    nouveaux.forEach(function (id) { B.message(S, 'msg_objectif_fait', { titre: B.t('obj_' + id) }); });
    const c = B.objectifs.courant(S);
    B.message(S, c ? 'msg_objectif_suivant' : 'msg_objectif_tous', { titre: c ? B.t('obj_' + c.id) : '' });
  }
  return nouveaux;
};
B.objectifs.nbFaits = function (S) { const E = B.objectifs.etat(S); return B.objectifs.liste().filter(function (o) { return E.faits[o.id]; }).length; };

/* ==== src/moteur/sauvegarde.js ==== */
/* sauvegarde.js — enregistrer et relire une partie. Chaque sauvegarde porte un numéro de version.
   Quand le format change, on ajoute une étape dans B.MIGRATIONS (de la version n à n+1) :
   ainsi chaque nouvelle version du jeu sait relire toutes les anciennes. */
B.VERSION_SAUVEGARDE = 9;

B.MIGRATIONS = {
  /* v1 → v2 (Bistrot 0.2) : l'équipe arrive. Le patron démarre seul (Léa n'est plus là), avec des candidats.
     La journée en cours repart au matin, car le service ne peut pas continuer sans cuisine. */
  1: function (S) {
    delete S.serveurs;
    S.equipe = []; S.candidats = []; S.placement = 'auto';
    S.groupes = [];
    S.tables.forEach(function (t) { t.groupe = null; t.sale = false; t.serveur = null; });
    S.minute = B.DATA.clients.journee.ouverture;
    S.stats.jour = B.statsVides();
    S.finJour = false; S.bilan = null;
    B.equipe.creerPatron(S);
    B.equipe.genererDepart(S);
    S.ouvert = false;
    B.message(S, 'msg_lea_partie');
    S.version = 2;
    return S;
  },
  /* v2 → v3 (Bistrot 0.3) : effectif de 16, intérim et renvoi. L'option d'intérim automatique prend la valeur
     par défaut de la difficulté. Les « Intérimaire » repris par erreur de l'ancien jeu (remplaçants d'un jour) partent. */
  2: function (S) {
    S.dejaOuvert = !!S.ouvert || S.jour > 1;
    S.interimAuto = !!B.DATA.equipe.interim.autoParDefaut[S.difficulte || 'facile'];
    const avant = S.equipe.length;
    S.equipe = S.equipe.filter(function (p) { return p.patron || p.nom !== 'Intérimaire'; });
    if (S.equipe.length < avant) {
      B.equipe.replacer(S);
      S.groupes.forEach(function (g) { if (g.cuisinier && !S.equipe.some(function (p) { return p.id === g.cuisinier; })) { g.cuisinier = null; g.pret = null; } if (g.serveur && !S.equipe.some(function (p) { return p.id === g.serveur; })) g.serveur = null; });
      S.tables.forEach(function (t) { if (t.serveur && !S.equipe.some(function (p) { return p.id === t.serveur; })) t.serveur = null; });
      S.ouvert = S.ouvert && B.equipe.peutOuvrir(S);
    }
    S.version = 3;
    return S;
  },
  /* v3 → v4 (Bistrot 0.4) : la carte, les prix et le paiement arrivent. Carte de départ du lieu ;
     les clients déjà attablés reçoivent leur commande (sans erreur de cuisson) et paieront à la fin. */
  3: function (S) {
    B.carte.creer(S);
    S.cagnotte = 0; S.tickets = [];
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    S.groupes.forEach(function (g) {
      if (['cuisine', 'pret', 'mange', 'addition'].indexOf(g.etat) >= 0 && !g.commande) {
        B.carte.commander(S, g);
        g.commande.forEach(function (l) { if (l.cuisson) l.servie = l.cuisson; });
      }
    });
    S.version = 4;
    return S;
  },
  /* v4 → v5 (Bistrot 0.5) : stocks, boissons, plats de saison, menu du jour. Le calendrier démarre à la date de création ;
     la carte reçoit les boissons ; premières courses livrées et payées ; les commandes déjà prises ne touchent pas la réserve. */
  4: function (S) {
    S.calendrier = { debut: (S.creeLe || '2026-11-25').slice(0, 10) };
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    B.carte.catalogue(S).forEach(function (d) {
      if (!S.carte.plats[d.id]) S.carte.plats[d.id] = { on: d.cat === 'boisson' && !d.saison, prix: B.carte.prixConseille(S, d) };
    });
    B.carte.completer(S);
    B.stock.creer(S);
    S.version = 5;
    return S;
  },
  /* v5 → v6 (Bistrot 0.6) : étape Équipe. Barmans, plongeurs et agents de nettoyage (« rôle à venir ») prennent leur poste ;
     chacun reçoit 2 jours de repos qui se suivent (personne n'est absent le jour de la reprise) ; propreté de départ ;
     la cagnotte garde son montant ; un candidat pour chaque nouveau poste ouvert à l'embauche (s'il reste une place). */
  5: function (S) {
    S.equipe.forEach(function (p) {
      const P = B.equipe.poste(p.poste);
      if (P && !p.patron) p.service = P.service;
    });
    S.equipe.forEach(function (p) {
      if (!B.equipe.aDesRepos(p)) { p.absent = null; return; }
      p.absent = null; p.formation = null; p.formations = []; p.sommelier = false; p.pourboires = 0;
      p.repos = null;
    });
    S.equipe.forEach(function (p) { if (B.equipe.aDesRepos(p)) p.repos = B.planning.choisirRepos(S, p); });
    S.partages = [];
    S.proprete = B.DATA.equipe.effets.proprete.depart;
    S.cagnotte = B.r2(S.cagnotte || 0);
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    ['barman', 'plong', 'nett', 'appr'].forEach(function (poste) {
      if (B.equipe.placeLibre(S, poste) && !S.candidats.some(function (c) { return c.poste === poste; })) S.candidats.push(B.equipe.candidat(S, poste));
    });
    B.equipe.replacer(S);
    S.version = 6;
    return S;
  },
  /* v6 → v7 (Bistrot 0.7) : étape Argent. Les parties d'avant restent en Facile (propriétaire, pas de prêt).
     Les salaires et les charges seront payés à partir du prochain soir ; l'ancienneté des employés compte
     à partir de la mise à jour (période d'essai) ; les comptes de la semaine démarrent aujourd'hui. */
  6: function (S) {
    S.difficulte = B.DATA.argent.niveaux[S.difficulte] ? S.difficulte : 'facile';
    S.pret = null; S.decouvert = 0; S.faillite = null;
    S.historique = []; S.semaines = []; S.reporte = {};
    S.semaine = B.argent.semaineVide(S, 1, S.jour);
    S.equipe.forEach(function (p) { if (!p.patron && !p.interim && !(p.embauche >= 1)) p.embauche = S.jour; });
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    if (S.bilan && S.bilan.resultat != null && !S.bilan.depenses) S.bilan.ancienFormat = true;
    S.version = 7;
    return S;
  },
  /* v7 → v8 (Bistrot 0.8) : lieux, météo et calendrier. La météo et le calendrier se calculent à partir de la date :
     rien à convertir. On ajoute l'état des fêtes et des événements (vide) ; le chef propose dès maintenant
     les menus de fête des 7 prochains jours ; les événements du jour et privés commencent demain matin. */
  7: function (S) {
    S.cal = B.ev.etatVide();
    S.tables.forEach(function (t) { t.reserve = null; });
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    if (S.carte) B.carte.catalogue(S).forEach(function (d) { if (!S.carte.plats[d.id]) S.carte.plats[d.id] = { on: false, prix: B.carte.prixConseille(S, d) }; });
    if (S.carte && S.stocks) B.ev.matinFetes(S);
    S.version = 8;
    return S;
  },
  /* v8 → v9 (Bistrot 1.0-test) : réputation et avis. La note gardée depuis le début (3 ou celle de l'ancien jeu) devient
     la vraie réputation ; pas encore d'avis. Les bonus de clients que la v0.8.1 donnait à la place de la réputation
     (inspection, critique) sont remplacés par leur effet sur la réputation ; le bonus de l'influenceuse reste (ancien jeu). */
  8: function (S) {
    const R = B.DATA.reputation, P = R.poids, N = R.notes;
    const v = B.statsVides();
    for (const k in v) if (S.stats.jour[k] == null) S.stats.jour[k] = v[k];
    S.note = Math.max(R.min, Math.min(R.max, S.note == null ? R.depart : S.note));
    S.avis = []; S.totalAvis = 0; S.michelin = null;
    if (S.cal && S.cal.effets) {
      S.cal.effets.forEach(function (f) {
        if (f.k === 'inspection') B.rep.maj(S, f.m > 1 ? N.inspectBravo : N.inspectMauvais, f.m > 1 ? P.inspectBravo : P.inspectSanction);
        if (f.k === 'critique') B.rep.maj(S, f.m > 1 ? 4.5 : 1.5, P.critiqueClient);
      });
      S.cal.effets = S.cal.effets.filter(function (f) { return f.k !== 'inspection' && f.k !== 'critique'; });
    }
    S.version = 9;
    return S;
  }
};

B.serialiser = function (S) { return JSON.stringify(S); };

/* Relit un texte de sauvegarde. Renvoie { partie } ou { erreur: 'cle_du_texte' }. Ne modifie jamais le texte d'origine. */
B.relire = function (texte) {
  let S;
  try { S = JSON.parse(texte); } catch (e) { return { erreur: 'erreur_sauvegarde_illisible' }; }
  if (!S || S.format !== 'bistrot' || typeof S.version !== 'number') return { erreur: 'erreur_sauvegarde_illisible' };
  if (S.version > B.VERSION_SAUVEGARDE) return { erreur: 'erreur_sauvegarde_recente' };
  while (S.version < B.VERSION_SAUVEGARDE) {
    const m = B.MIGRATIONS[S.version];
    if (!m) return { erreur: 'erreur_sauvegarde_illisible' };
    S = m(S);
  }
  if (!S.objectifs) { S.objectifs = { faits: {} }; B.objectifs.verifier(S, true); }   /* v0.9 : champ facultatif, ce qui est déjà acquis est coché sans message */
  S.jeu = B.VERSION_JEU;
  return { partie: S };
};

/* Noms des cases de rangement du téléphone. Le lien TEST et le lien OFFICIEL ont chacun les leurs. */
B.cles = function (canal) {
  const p = 'bistrotjeu.' + canal + '.';
  return { partie: p + 'partie', secours: p + 'partie-precedente', reglages: p + 'reglages', copieAncien: p + 'copie-ancien-jeu', copieFaillite: p + 'copie-faillite' };
};

/* ==== src/moteur/ancien.js ==== */
/* ancien.js — lecture des parties de l'ancien jeu « Chez YaYa » (v1 à v10.2).
   Règle d'or : on LIT seulement. Aucune écriture, aucune suppression sur les cases de l'ancien jeu. */
B.ancien = {};

/* Cases utilisées par l'ancien jeu : 5 emplacements + la sauvegarde principale. */
B.ancien.cles = ['bistrot_slot1', 'bistrot_slot2', 'bistrot_slot3', 'bistrot_slot4', 'bistrot_slot5', 'bistrot_save_v1'];
B.ancien.cleActive = 'bistrot_active_slot';

B.ancien.lire = function (texte) {
  try {
    const o = JSON.parse(texte);
    if (!o || typeof o !== 'object' || typeof o.t !== 'number' || typeof o.cash !== 'number') return null;
    return o;
  } catch (e) { return null; }
};

/* Résumé lisible d'une ancienne partie. */
B.ancien.resumer = function (o) {
  const lieu = B.lieu(o.v96loc || 'paris');
  return {
    nom: (o.rName || 'Chez YaYa').trim(),
    lieu: lieu.id,
    lieuNom: lieu.nom,
    jour: Math.floor(o.t / 1440) + 1,
    argent: Math.round(o.cash * 100) / 100,
    note: typeof o.rep === 'number' && isFinite(o.rep) ? Math.round(o.rep * 100) / 100 : 3,
    versionSauvegarde: o.v || 0
  };
};

/* Crée une partie Bistrot à partir d'une ancienne partie (copie, l'originale reste intacte). */
B.ancien.convertir = function (o, infos) {
  const r = B.ancien.resumer(o);
  const S = B.nouvellePartie({ nom: r.nom, lieu: r.lieu, graine: infos && infos.graine, date: infos && infos.date });
  B.equipe.creerPatron(S);
  const n = B.ancien.reprendreEquipe(S, o);
  const patron = B.equipe.patron(S);
  if (!B.equipe.salle(S).filter(function (p) { return !p.patron; }).length) patron.service = 'salle';
  else if (!B.equipe.cuisine(S).length) patron.service = 'cuisine';
  B.equipe.replacer(S);
  B.equipe.genererDepart(S);
  S.ouvert = B.equipe.peutOuvrir(S);
  S.dejaOuvert = S.ouvert;
  B.carte.creer(S);
  const carte = B.ancien.reprendreCarte(S, o);
  S.equipeReprise = n;
  S.jour = Math.max(1, r.jour);
  S.argent = r.argent;
  S.note = Math.max(0.5, Math.min(5, r.note == null ? 3 : r.note));   /* v1.0 : la réputation de l'ancien jeu devient la vraie réputation */
  B.stock.creer(S, true);
  const stocks = B.ancien.reprendreStocks(S, o);
  if (!stocks.produits) { B.stock.premieresCourses(S); B.menuJour.calculer(S); }
  S.origine = {
    jeu: 'Chez YaYa', versionSauvegarde: r.versionSauvegarde,
    cle: infos && infos.cle || null, reprisLe: infos && infos.date || null,
    reprisPourLinstant: ['nom', 'lieu', 'jour', 'argent', 'note', 'equipe', 'carte', 'stocks'],
    carte: carte, stocks: stocks
  };
  B.objectifs.verifier(S, true);   /* v0.9 : ce qui est déjà acquis est coché sans message */
  return S;
};

/* Reprend les employés lisibles de l'ancien jeu. Salaire recalculé sur la grille HCR (poste + expérience).
   Bar, plonge et nettoyage gardent leur poste. Jours de repos choisis automatiquement. Renvoie le nombre repris. */
B.ancien.reprendreEquipe = function (S, o) {
  const staff = Array.isArray(o.staff) ? o.staff : [];
  const fem = B.DATA.equipe.prenomsFemininsAncienJeu.concat(B.DATA.equipe.prenoms.filter(function (p) { return p[1] === 'f'; }).map(function (p) { return p[0]; }));
  const borne = function (v, d) { v = Math.round(+v); return isFinite(v) ? Math.max(1, Math.min(10, v)) : d; };
  const persos = { 'sérieux': 'serieux', 'souriant': 'souriant', 'ambitieux': 'ambitieux', 'discret': 'discret', 'stressé': 'stresse', 'blagueur': 'blagueur', 'posé': 'pose' };
  let n = 0;
  staff.forEach(function (s) {
    if (!s || typeof s.name !== 'string' || !s.name.trim()) return;
    if (s.tmp || (s.ct && s.ct.k === 'interim')) return; /* intérimaires d'un jour : pas repris */
    let poste = B.DATA.equipe.postes[s.post] ? s.post : (s.role === 'cook' ? 'commis' : s.role === 'waiter' ? 'serv' : null);
    if (!poste) return;
    const sub = s.sub || {}, note = borne(s.skill, 5), exp = Math.max(0, Math.min(45, Math.round(+s.exp) || 0));
    B.equipe.nouveauMembre(S, {
      nom: s.name.trim().slice(0, 40), genre: fem.indexOf(s.name.split(' ')[0]) >= 0 ? 'f' : 'm', poste: poste,
      note: note, vitesse: borne(sub.vit, note), amabilite: borne(sub.ami, note), qualite: borne(sub.qua, note),
      salaire: B.equipe.minimum(S, poste, exp), experience: exp, perso: persos[s.pers] || null
    });
    n++;
  });
  return n;
};

/* Reprend la carte de l'ancienne partie : plats présents dans Bistrot (mêmes identifiants), à la carte ou non, et leur prix.
   Les plats de saison, du menu du jour et les boissons de l'ancien jeu ne sont pas encore dans Bistrot. */
B.ancien.reprendreCarte = function (S, o) {
  const m = o && o.menu && typeof o.menu === 'object' ? o.menu : null;
  const r = { lus: 0, ignores: 0, ajustes: 0 };
  if (!m) return r;
  const P = B.DATA.carte.prix;
  let touche = false;
  B.carte.catalogue(S).forEach(function (d) {
    const a = m[d.id];
    if (!a || typeof a !== 'object' || typeof a.on !== 'boolean') return;
    if (!touche) {
      /* on repart de zéro pour chaque catégorie présente dans l'ancienne carte */
      const presentes = {};
      B.carte.catalogue(S).forEach(function (x) { if (m[x.id] && typeof m[x.id].on === 'boolean') presentes[x.cat] = 1; });
      B.carte.TOUTES.forEach(function (c) { if (presentes[c]) B.carte.surCarte(S, c).forEach(function (id) { S.carte.plats[id].on = false; }); });
      touche = true;
    }
    S.carte.plats[d.id].on = a.on && B.carte.enSaison(S, d);
    const conseille = B.carte.prixConseille(S, d), prix = +a.price;
    if (isFinite(prix) && prix >= P.minimum && prix <= conseille * P.maxFoisConseille) S.carte.plats[d.id].prix = Math.round(prix * 2) / 2;
    r.lus++;
  });
  if (!touche) return r;
  Object.keys(m).forEach(function (id) { if (m[id] && m[id].on && !S.carte.plats[id]) r.ignores++; });
  const avant = JSON.stringify(B.carte.surCarte(S));
  B.carte.completer(S);
  if (JSON.stringify(B.carte.surCarte(S)) !== avant) r.ajustes = 1;
  return r;
};

/* Reprend la réserve de l'ancienne partie : quantités, dates limites (lots), prix payés, commandes en route,
   commande automatique. Les produits que Bistrot ne connaît pas sont ignorés. Renvoie un résumé. */
B.ancien.reprendreStocks = function (S, o) {
  const r = { produits: 0, portions: 0, perimes: 0, commandes: 0 };
  if (!o || !o.stock || typeof o.stock !== 'object') return r;
  const jourAncien = Math.floor((+o.t || 0) / 1440);
  S.stocks.lots = {};
  for (const i in o.stock) {
    const st = o.stock[i];
    if (!B.DATA.stocks.ingredients[i] || !st || !(+st.q >= 1)) continue;
    const prix = isFinite(+st.cost) && +st.cost > 0 ? B.r2(+st.cost) : B.stock.prixAchat(S, i, 'grossiste');
    const lots = Array.isArray(o.lots && o.lots[i]) ? o.lots[i].filter(function (l) { return l && +l.q > 0 && isFinite(+l.exp); }) : [];
    let reste = Math.floor(+st.q);
    lots.sort(function (a, b) { return a.exp - b.exp; }).forEach(function (l) {
      const q = Math.min(reste, Math.floor(+l.q));
      if (q <= 0) return;
      const dlc = S.jour + (Math.floor(+l.exp) - jourAncien);
      if (dlc < S.jour) { r.perimes += q; reste -= q; return; }
      B.stock.lots(S, i).push({ q: q, dlc: dlc, prix: prix, four: 'grossiste' });
      reste -= q;
    });
    if (reste > 0) B.stock.lots(S, i).push({ q: reste, dlc: S.jour + B.stock.info(i).dlc - 1, prix: prix, four: 'grossiste' });
    B.stock.lots(S, i).sort(function (a, b) { return a.dlc - b.dlc; });
    r.produits++; r.portions += Math.floor(+st.q) - 0;
  }
  r.portions -= r.perimes;
  const F = { marche: 'marche', gros: 'grossiste', disc: 'discount', bio: 'bio' };
  (Array.isArray(o.orders) ? o.orders : []).forEach(function (c) {
    if (!c || !c.items) return;
    const lignes = {}, prix = {};
    for (const i in c.items) if (B.DATA.stocks.ingredients[i] && +c.items[i] > 0) { lignes[i] = Math.floor(+c.items[i]); prix[i] = B.r2(+(c.unit && c.unit[i]) || B.stock.prixAchat(S, i, 'grossiste')); }
    if (!Object.keys(lignes).length) return;
    S.stocks.commandes.push({ id: S.prochainId++, four: F[c.sup] || 'grossiste', lignes: lignes, prix: prix, cout: B.r2(+c.cost || 0), passee: B.maintenant(S), arrivee: B.maintenant(S), auto: false });
    r.commandes++;
  });
  if (o.auto && typeof o.auto === 'object') S.stocks.auto = Object.keys(o.auto).some(function (i) { return o.auto[i] && o.auto[i].on; });
  B.stock.livrer(S, true);
  B.menuJour.calculer(S);
  return r;
};

/* Liste les anciennes parties trouvées, sans doublon (la sauvegarde principale recopie souvent un emplacement). */
B.ancien.trouver = function (lireCase) {
  const vues = {}, out = [];
  let active = null;
  try { active = lireCase(B.ancien.cleActive); } catch (e) { active = null; }
  B.ancien.cles.forEach(function (cle) {
    let txt = null;
    try { txt = lireCase(cle); } catch (e) { txt = null; }
    if (!txt) return;
    const o = B.ancien.lire(txt);
    if (!o) return;
    if (vues[txt]) return;
    vues[txt] = true;
    const n = cle.indexOf('slot') >= 0 ? +cle.slice(-1) : null;
    out.push({ cle: cle, emplacement: n, derniere: n === null || String(n) === String(active), texte: txt, resume: B.ancien.resumer(o) });
  });
  return out;
};

/* Panneau de droite, en bas : le détail de la table touchée, ou un résumé de la salle. */

    if (!S.faillite) html += UI.ligneReputation(S);

    const taille = gFile.taille === 1 ? B.t('pers_1') : B.t('pers_n', { n: gFile.taille });

  } else if (sel) {
    const g = sel.groupe && S.groupes.find(function (x) { return x.id === sel.groupe; });
    const ids = g ? g.tables : [sel.id];
    html += '<b>' + UI.esc(B.t('detail_table', { num: B.salle.nomTables(ids) })) + '</b>';
    if (g) {
      const taille = g.taille === 1 ? B.t('pers_1') : B.t('pers_n', { n: g.taille });
      html += '<div>' + UI.esc(B.t('detail_groupe', { taille: taille, groupe: B.t('groupe_' + g.type, { nom: g.nom }) })) + '</div>';
      html += '<div>' + UI.esc(B.t('etat_long_' + g.etat)) + '</div>';
      const min = Math.floor(S.minute - g.depuis);
      const attend = ['commande', 'pret', 'addition', 'cuisine'].indexOf(g.etat) >= 0;
      html += '<div class="' + UI.classeAttente(g) + '">' + UI.esc(B.t(attend ? 'detail_attend' : 'detail_depuis', { min: min })) + '</div>';
      if (g.commande) {
        const total = g.commande.reduce(function (s, l) { return s + l.prix; }, 0);
        html += '<div>' + UI.esc(B.t('detail_addition', { total: B.prix(total), n: g.commande.length })) + '</div>';
        html += '<button type="button" class="petit-btn btn-ticket" data-ticket="' + g.id + '">' + UI.esc(B.t('detail_ticket')) + '</button>';
      }
    } else if (sel.sale) {
      html += '<div>' + UI.esc(B.t('detail_a_debarrasser')) + '</div>';
    } else {
      html += '<div>' + UI.esc(B.t('detail_libre', { places: sel.places })) + '</div>';
    }
  } else {
    let enSalle = 0, file = 0;
    S.groupes.forEach(function (g) {
      if (g.etat === 'file') file++;
      else if (g.etat !== 'repart' && g.etat !== 'depart') enSalle += g.taille;
    });
    const aide = S.placement === 'manuel' && S.groupes.some(function (g) { return g.etat === 'file'; }) ? 'placement_aide' : 'detail_aucune';
    if (aide === 'detail_aucune' && S.objectifs) html += '<button type="button" class="obj-ligne" data-objectif="1">' + UI.esc(UI.texteObjectif(S)) + '</button>';
    else html += '<div class="aide">' + UI.esc(B.t(aide)) + '</div>';
    html += UI.ligneReputation(S);

    html += '<div>' + UI.esc(B.t('detail_file', { n: file })) + '</div>';
    html += '<div>' + UI.esc(B.t('detail_servis', { n: S.stats.jour.servis })) + '</div>';
    html += '<div>' + UI.esc(B.t('detail_repartis', { n: S.stats.jour.repartis })) + '</div>';
    html += '<div>' + UI.esc(B.t('detail_recettes', { total: B.euros(S.stats.jour.recettes) })) + '</div>';
  }
  if (el._html !== html) { el.innerHTML = html; el._html = html; }

/* Position verticale du n-ième groupe de la file (les gros groupes prennent plus de place). */
UI.dessin.yFile = function (S, rang) {
  let y = B.DATA.salle.file.y, i = 0;
  for (const g of S.groupes) {
    if (g.etat !== 'file') continue;
    if (i === rang) return y + (Math.ceil(g.taille / 2) - 1) * 11;
    y += Math.ceil(g.taille / 2) * 22 + 22; i++;
  }
  return y;
};

/* Petit groupe qui marche : les personnes en paquet autour d'un point. */

UI.dessin.dynamique = function () {
  const S = UI.S, P = B.DATA.salle;
  let bas = '', haut = '', etiq = '';
  /* Rallonges entre deux tables rapprochées, miettes sur les tables sales, assiettes */
  S.groupes.forEach(function (g) {
    if (g.tables && g.tables.length > 1 && g.etat !== 'file') {
      const a = B.salle.geo(g.tables[0]), b = B.salle.geo(g.tables[1]);
      bas += '<rect x="' + (Math.min(a.x, b.x) + 40) + '" y="' + (a.y - 30) + '" width="' + (Math.abs(b.x - a.x) - 80) + '" height="60" fill="#b9834f" stroke="#7a5233" stroke-width="3"/>';
    }
  });
  const choisie = UI.selection && B.salle.tableDe(S, UI.selection);
  const gChoisi = choisie && choisie.groupe && S.groupes.find(function (g) { return g.id === choisie.groupe; });
  const tablesChoisies = gChoisi ? gChoisi.tables : (choisie ? [choisie.id] : []);
  S.tables.forEach(function (t) {
    const geo = B.salle.geo(t.id);
    if (t.sale) {
      bas += '<circle cx="' + (geo.x - 12) + '" cy="' + (geo.y - 8) + '" r="9" fill="#f4f4f4" stroke="#999" stroke-width="2"/><circle cx="' + (geo.x + 14) + '" cy="' + (geo.y + 10) + '" r="9" fill="#f4f4f4" stroke="#999" stroke-width="2"/>';
    }
    if (tablesChoisies.indexOf(t.id) >= 0) {
      const c = B.salle.taille(geo.places) + 14;
      haut += '<rect x="' + (geo.x - c / 2) + '" y="' + (geo.y - c / 2) + '" width="' + c + '" height="' + c + '" rx="12" fill="none" stroke="#1d6fd8" stroke-width="5"/>';
    }
  });
  /* Numéros de table */
  P.tables.forEach(function (t) {
    haut += '<text x="' + t.x + '" y="' + (t.y + 11) + '" class="num">' + t.id + '</text>';
  });
  /* Clients */
  let rangFile = 0, nbFile = 0, touchesFile = '';
  const manuel = S.placement === 'manuel' && S.ouvert;
  S.groupes.forEach(function (g) {
    const assis = ['carte', 'commande', 'cuisine', 'pret', 'mange', 'addition'].indexOf(g.etat) >= 0;
    if (g.etat === 'file') {
      nbFile++;
      const yf = UI.dessin.yFile(S, rangFile), demi = Math.ceil(g.taille / 2) * 11;
      if (yf + demi <= 428) {
        if (UI.groupeChoisi === g.id) haut += '<rect x="' + (P.file.x - 30) + '" y="' + (yf - demi - 8) + '" width="60" height="' + (2 * demi + 16) + '" rx="10" fill="none" stroke="#1d6fd8" stroke-width="5"/>';
        bas += UI.dessin.paquet(g, P.file.x, yf);
        if (manuel) touchesFile += '<rect data-groupe="' + g.id + '" x="' + (P.file.x - 40) + '" y="' + (yf - demi - 11) + '" width="80" height="' + (2 * demi + 22) + '" fill="transparent"/>';
      }
      rangFile++;
    } else if (assis) {
      const places = [];
      g.tables.forEach(function (id) { B.salle.places(id).forEach(function (p) { places.push(p); }); });
      for (let i = 0; i < g.taille; i++) bas += UI.dessin.client(places[i].x, places[i].y, UI.dessin.couleur(g));
      if (g.etat === 'mange') g.tables.forEach(function (id) {
        const geo = B.salle.geo(id);
        bas += '<circle cx="' + geo.x + '" cy="' + (geo.y - 22) + '" r="10" fill="#fff" stroke="#ccc" stroke-width="2"/>';
      });
      const c = B.salle.centre(g.tables), geo = B.salle.geo(g.tables[0]);
      const y = geo.y < P.allee ? geo.y - 85 : geo.y + 89;
      etiq += UI.dessin.etiquette(c.x, y, B.t('etat_court_' + g.etat), UI.dessin.couleurs[UI.classeAttente(g)]);
    } else {
      bas += UI.dessin.paquet(g, g.x, g.y);
    }
  });
  S.tables.forEach(function (t) {
    if (t.reserve && !t.groupe) {
      const g0 = B.salle.geo(t.id), y0 = g0.y < P.allee ? g0.y - 85 : g0.y + 89, e = S.cal && S.cal.prives.find(function (x) { return x.id === t.reserve; });
      if (e && e.installe) B.salle.places(t.id).forEach(function (p) { bas += UI.dessin.client(p.x, p.y, UI.dessin.couleurs.reserve); });
      etiq += UI.dessin.etiquette(g0.x, y0, B.t(e && e.installe ? 'etat_court_prive' : 'etat_court_reserve'), UI.dessin.couleurs.reserve);
    }
    if (!t.sale) return;
    const geo = B.salle.geo(t.id), y = geo.y < P.allee ? geo.y - 85 : geo.y + 89;
    etiq += UI.dessin.etiquette(geo.x, y, B.t('etat_court_sale'), UI.dessin.couleurs.sale);
  });
  if (nbFile) etiq += '<text x="22" y="' + (P.file.y - 30) + '" class="petit-txt gauche">' + UI.esc(B.t('salle_file', { n: nbFile })) + '</text>';

    if (!r || !UI.S) return;
    const id = +r.dataset.table;
    if (UI.groupeChoisi) {
      const res = B.clients.placerManuel(UI.S, UI.groupeChoisi, id);

      UI.majDetail(); UI.dessin.dynamique();

/* ==== src/interface/messages.js ==== */
/* messages.js — notifications dans leur zone réservée (jamais sur un bouton) et Journal complet. */
UI.toasts = [];
UI.DUREE_MESSAGE = 6000;
UI.MAX_VISIBLES = 3;

UI.majMessages = function (maintenant) {
  while (B.flux.length) UI.toasts.push({ m: B.flux.shift(), fin: maintenant + UI.DUREE_MESSAGE });
  UI.toasts = UI.toasts.filter(function (t) { return t.fin > maintenant; });
  const el = UI.$('messages');
  /* On affiche jusqu'à 3 messages, moins s'ils ne tiennent pas en entier dans la zone. */
  for (let n = Math.min(UI.MAX_VISIBLES, UI.toasts.length); n >= 0; n--) {
    const visibles = UI.toasts.slice(UI.toasts.length - n).reverse();
    const caches = UI.toasts.length - n;
    let html = visibles.map(function (t) {
      return '<div class="msg"><span class="h">' + B.heure(t.m.minute) + '</span> ' + UI.esc(t.m.texte) + '</div>';
    }).join('');
    if (caches > 0) html += '<div class="msg-plus">' + UI.esc(B.t('msg_plus', { n: caches })) + '</div>';
    if (el._html === html) return;
    el.innerHTML = html;
    if (el.scrollHeight <= el.clientHeight + 1 || n === 0) { el._html = html; return; }
  }
};

UI.htmlJournal = function () {
  const J = UI.S ? UI.S.journal.slice().reverse() : [];
  if (!J.length) return '<p>' + UI.esc(B.t('journal_vide')) + '</p>';
  return '<ul class="journal">' + J.map(function (m) {
    return '<li><span class="h">' + UI.esc(B.t('journal_ligne', { jour: m.jour, heure: B.heure(m.minute) })) + '</span>' + UI.esc(m.texte) + '</li>';
  }).join('') + '</ul>';
};

/* ==== src/interface/volets.js ==== */
/* volets.js — panneaux qui s'ouvrent par-dessus la salle (Journal, Menu) et se ferment d'un geste.
   Le jeu se met en pause pendant la lecture (réglage), et reprend à la fermeture. */
UI.voletOuvert = null;

UI.ouvrirVolet = function (quoi) {
  UI.voletOuvert = quoi;
  const v = UI.$('volet');
  v.classList.toggle('large', quoi === 'equipe' || quoi === 'carte' || quoi === 'stocks' || quoi === 'argent' || quoi === 'calendrier' || quoi === 'aide');
  if (quoi === 'equipe') { UI.candidatCourant = null; UI.renvoiCourant = null; UI.renvoiRefus = null; UI.ficheCourante = null; UI.eqMsg = null; UI.eqOnglet = UI.S && UI.S.dejaOuvert ? 'equipe' : 'embauche'; UI.rafraichirEquipe(true); }
  else if (quoi === 'carte') { UI.platCourant = null; UI.carteRefus = null; UI.rafraichirCarte(true); }
  else if (quoi === 'stocks') { UI.stMsg = null; UI.rafraichirStocks(true); }
  else if (quoi === 'argent') { UI.agOnglet = 'jour'; UI.rafraichirArgent(true); }
  else if (quoi === 'calendrier') { UI.rafraichirCalendrier(true); }
  else if (quoi === 'aide') { UI.rafraichirAide(true); }
  else if (quoi === 'ticket') {
    const g = UI.S.groupes.find(function (x) { return x.id === UI.ticketGroupe; });
    UI.$('volet-titre').textContent = B.t('ticket_titre');
    UI.$('volet-corps').innerHTML = g ? UI.htmlTicket(g) : '';
  }
  else {
    UI.$('volet-titre').textContent = B.t(quoi === 'journal' ? 'journal_titre' : 'menu_titre');
    UI.$('volet-corps').innerHTML = quoi === 'journal' ? UI.htmlVoletJournal() : UI.htmlMenu();
  }
  clearTimeout(UI._cacheVolet);
  UI.$('voile').hidden = false;
  v.hidden = false;
  requestAnimationFrame(function () { v.classList.add('ouvert'); if (quoi === 'equipe' || quoi === 'argent' || quoi === 'calendrier') UI.$('volet-corps').scrollTop = 0; });
  if (UI.reglages.pauseAuto) UI.pause('volet', true);
  UI.sauver();
};

UI.fermerVolet = function () {
  const v = UI.$('volet');
  v.classList.remove('ouvert');
  UI.$('voile').hidden = true;
  clearTimeout(UI._cacheVolet);
  UI._cacheVolet = setTimeout(function () { if (!v.classList.contains('ouvert')) v.hidden = true; }, 220);
  UI.voletOuvert = null;
  UI.candidatCourant = null;
  UI.renvoiCourant = null;
  UI.renvoiRefus = null;
  UI.ficheCourante = null;
  UI.eqMsg = null;
  UI.platCourant = null;
  UI.carteRefus = null;
  UI.ticketGroupe = null;
  UI.stMsg = null;
  UI.mdjChoix = null;
  UI.mdjMsg = null;
  UI.calPrive = null;
  UI.pause('volet', false);
  UI.majDetail();
};

UI.htmlMenu = function () {
  const S = UI.S;
  let h = S ? '<button type="button" class="gros principal" data-action="aide">' + UI.esc(B.t('menu_aide')) + '</button>' : '';

UI.initVolets = function () {
  UI.$('volet-fermer').textContent = B.t('btn_fermer');
  UI.$('volet-fermer').addEventListener('click', UI.fermerVolet);
  UI.$('voile').addEventListener('click', UI.fermerVolet);
  UI.$('volet-corps').addEventListener('click', function (e) {
    const jo = e.target.closest('[data-jr-onglet]');
    if (jo) { UI.jrOnglet = jo.dataset.jrOnglet; UI.$('volet-corps').innerHTML = UI.htmlVoletJournal(); UI.$('volet-corps').scrollTop = 0; return; }
    const b = e.target.closest('[data-action]');
    if (!b) return;
    if (b.dataset.action === 'son' || b.dataset.action === 'volume') {
      if (b.dataset.action === 'son') UI.reglages.son = !UI.reglages.son;
      else UI.reglages.volume = Math.max(1, Math.min(10, UI.reglages.volume + (+b.dataset.pas)));
      UI.sauverReglages();
      UI.sons.debloquer();
      UI.sons.jouer('ding');
      UI.$('volet-corps').innerHTML = UI.htmlMenu();
      return;
    }
    if (b.dataset.action === 'pause-auto') {
      UI.reglages.pauseAuto = !UI.reglages.pauseAuto;
      UI.sauverReglages();
      if (!UI.reglages.pauseAuto) UI.pause('volet', false);
      UI.$('volet-corps').innerHTML = UI.htmlMenu();
    } else if (b.dataset.action === 'placement' && UI.S) {
      UI.S.placement = UI.S.placement === 'manuel' ? 'auto' : 'manuel';
      UI.groupeChoisi = null;
      UI.majPlacement(); UI.sauver();
      UI.$('volet-corps').innerHTML = UI.htmlMenu();
    } else if (b.dataset.action === 'aide') {
      UI.ouvrirAide('objectifs');
    } else if (b.dataset.action === 'accueil') {
      UI.fermerVolet();
      UI.sauver();
      UI.montrerAccueil();
    }
  });
  /* Glisser le volet vers la droite pour le fermer */
  let x0 = null;
  const v = UI.$('volet');
  v.addEventListener('pointerdown', function (e) { x0 = e.clientX; });
  v.addEventListener('pointerup', function (e) { if (x0 != null && e.clientX - x0 > 60) UI.fermerVolet(); x0 = null; });
  v.addEventListener('pointercancel', function () { x0 = null; });
};

/* Prochain jour où la personne travaille (pour une formation), en date lisible. */
UI.prochainJourTravaille = function (S, p) {
  for (let d = 1; d <= 8; d++) if (!B.planning.estRepos(p, B.jourSemaine(S, S.jour + d))) return B.texteDate(S, d);

  if (p.absent === 'formation') return B.t('eq_aujourdhui_formation', { formation: B.t('form_nom_' + p.formation.id) });

UI.dernierSoirDuMois = function (S) {

};

UI.rafraichirEquipe = function (enHaut) {
  if (UI.voletOuvert !== 'equipe') return;
  const r = UI.renvoiCourant != null && UI.S && UI.S.equipe.find(function (x) { return x.id === UI.renvoiCourant; });
  const f = UI.ficheCourante != null && UI.S && UI.S.equipe.find(function (x) { return x.id === UI.ficheCourante; });
  UI.$('volet-titre').textContent = UI.candidatCourant ? B.t('entretien_titre', { nom: UI.candidatCourant.nom }) : r ? B.t('renvoi_titre', { nom: r.nom }) : f ? B.t('eq_fiche_titre', { nom: f.nom }) : B.t('equipe_titre');
  const corps = UI.$('volet-corps'), y = corps.scrollTop;
  corps.innerHTML = UI.htmlEquipe();
  corps.scrollTop = enHaut ? 0 : y;
};

UI.initEquipe = function () {
  UI.$('volet-corps').addEventListener('click', function (e) {
    const o = e.target.closest('[data-eq-onglet]');
    if (o && UI.voletOuvert === 'equipe') { UI.eqOnglet = o.dataset.eqOnglet; UI.eqMsg = null; UI.renvoiRefus = null; UI.rafraichirEquipe(true); return; }
    const b = e.target.closest('[data-eq]');
    if (!b || !UI.S || b.disabled) return;
    const S = UI.S, a = b.dataset.eq, c = UI.candidatCourant;
    if (a === 'ouvrir') {
      if (B.ouvrir(S)) { UI.sauver(); UI.fermerVolet(); UI.majBarre(); UI.majDetail(); }
      return;
    }
    const pid = b.dataset.id != null ? S.equipe.find(function (x) { return x.id === +b.dataset.id; }) : null;
    if (a === 'fiche') { if (pid) { UI.ficheCourante = pid.id; UI.eqMsg = null; UI.renvoiRefus = null; } UI.rafraichirEquipe(true); return; }
    if (a === 'fiche-retour') { UI.ficheCourante = null; UI.eqMsg = null; UI.renvoiRefus = null; UI.rafraichirEquipe(true); return; }
    if (a === 'repos-moins' || a === 'repos-plus') {
      if (pid && B.planning.decaler(S, pid, a === 'repos-plus' ? 1 : -1)) UI.eqMsg = { ok: true, texte: B.t('eq_repos_change', { prenom: UI.prenom(pid), a: B.DATA.textes.jours_semaine[pid.repos[0]], b: B.DATA.textes.jours_semaine[pid.repos[1]] }) };
      UI.sauver(); UI.rafraichirEquipe(); return;
    }
    if (a === 'form-inscrire' && pid) {
      const r = B.planning.inscrire(S, pid, b.dataset.f);
      UI.eqMsg = r.ok ? { ok: true, texte: B.t('eq_formation_ok', { prenom: UI.prenom(pid), formation: B.t('form_nom_' + b.dataset.f), jour: UI.prochainJourTravaille(S, pid) }) } : { ok: false, texte: B.t(r.erreur) };
      UI.sauver(); UI.majBarre(); UI.rafraichirEquipe(true); return;
    }
    if (a === 'form-annuler' && pid) {
      if (B.planning.annuler(S, pid)) UI.eqMsg = { ok: true, texte: B.t('eq_formation_annulee', { prenom: UI.prenom(pid) }) };
      UI.sauver(); UI.majBarre(); UI.rafraichirEquipe(true); return;
    }
    if (a === 'patron') { UI.renvoiRefus = null; B.equipe.changerPatron(S); UI.sauver(); UI.rafraichirEquipe(); return; }
    if (a === 'renvoyer') {
      const p = S.equipe.find(function (x) { return x.id === +b.dataset.id; });
      if (!p) return;
      const non = B.equipe.peutRenvoyer(S, p);
      if (non) { UI.renvoiRefus = { id: p.id, texte: UI.tGenre(non, p, { prenom: UI.prenom(p) }) }; UI.rafraichirEquipe(); return; }
      UI.renvoiRefus = null; UI.renvoiCourant = p.id; UI.rafraichirEquipe(true); return;
    }
    if (a === 'interim') { B.equipe.appelerInterim(S, b.dataset.sv, false); UI.sauver(); UI.rafraichirEquipe(); UI.majBarre(); UI.dessin.dynamique(); return; }
    if (a === 'interim-auto') { S.interimAuto = !S.interimAuto; UI.sauver(); UI.rafraichirEquipe(); return; }
    if (a === 'renvoi-non') { UI.renvoiCourant = null; UI.rafraichirEquipe(true); return; }
    if (a === 'renvoi-oui') {
      const p = S.equipe.find(function (x) { return x.id === UI.renvoiCourant; });
      UI.renvoiCourant = null;
      if (p) {
        const non = B.equipe.peutRenvoyer(S, p);
        if (non) UI.renvoiRefus = { id: p.id, texte: UI.tGenre(non, p, { prenom: UI.prenom(p) }) };
        else { B.equipe.renvoyer(S, p); if (UI.ficheCourante === p.id) UI.ficheCourante = null; }
      }
      UI.sauver(); UI.rafraichirEquipe(true); UI.majBarre(); UI.majDetail(); UI.dessin.dynamique();
      return;
    }
    if (a === 'entretien') {
      UI.candidatCourant = S.candidats.find(function (x) { return x.id === +b.dataset.id; }) || null;
      if (UI.candidatCourant) UI.candidatCourant.dernierMot = null;
      UI.rafraichirEquipe(true); return;
    }
    if (a === 'retour') { UI.candidatCourant = null; UI.rafraichirEquipe(true); return; }
    if (!c) return;
    if (a === 'question') B.equipe.repondre(S, c, b.dataset.q);
    else if (a === 'moins') c.offre = Math.max(c.minimum, Math.round((c.offre - 0.1) * 100) / 100);
    else if (a === 'plus') c.offre = Math.round((c.offre + 0.1) * 100) / 100;
    else if (a === 'proposer') B.equipe.proposer(S, c, c.offre);
    UI.sauver();
    UI.rafraichirEquipe(a === 'proposer');
  });
};

/* ==== src/interface/argent.js ==== */
/* argent.js (écran) — volet Argent (caisse, aujourd'hui, semaines, loyer et charges), bilans du soir et de la semaine, faillite.
   On l'ouvre en touchant la caisse, en haut à gauche. */
UI.agOnglet = 'jour';   /* jour | semaine | charges */

UI.ligneAg = function (lib, montant, classe, signe) {
  const txt = signe ? (montant > 0.004 ? '−' : '') + B.euros(Math.abs(montant)) : B.euros(montant);
  return '<div class="ligne-ag' + (classe ? ' ' + classe : '') + '"><span>' + UI.esc(lib) + '</span><b>' + UI.esc(txt) + '</b></div>';
};
/* Lignes « Recettes, puis chaque dépense non nulle, puis bénéfice » */
UI.lignesComptes = function (recettes, dep, resultat, enCours) {
  let h = UI.ligneAg(B.t('ag_recettes'), recettes, 'plus');
  B.argent.POSTES.forEach(function (k) { if (Math.abs(dep[k] || 0) > 0.004) h += UI.ligneAg(B.t('ag_poste_' + k), dep[k], 'moins', true); });
  h += UI.ligneAg(B.t(enCours ? 'ag_pour_l_instant' : resultat >= 0 ? 'ag_benefice' : 'ag_perte'), resultat, 'total ' + (resultat >= 0 ? 'vert-txt' : 'rouge-txt'));
  return h;
};
UI.minuscule = function (t) { return /^[A-Z]{2,}/.test(t) ? t : t.charAt(0).toLowerCase() + t.slice(1); };
UI.texteNiveau = function (S) { return B.t('niveau_' + S.difficulte); };

UI.htmlArgent = function () {
  const S = UI.S;
  let h = '<div class="cagnotte caisse"><span>' + UI.esc(B.t('ag_caisse')) + '<br><small>' + UI.esc(B.t('ag_niveau', { niveau: UI.texteNiveau(S) })) + '</small></span><b class="' + (S.argent < 0 ? 'rouge-txt' : '') + '">' + UI.esc(B.euros(S.argent)) + '</b></div>';
  if (S.decouvert > 0) h += '<div class="alerte-ag">' + UI.esc(B.t('ag_decouvert', { soir: S.decouvert, max: B.DATA.argent.faillite.soirsDeSuite })) + '</div>';
  h += UI.onglets('data-ag-onglet', [['jour', B.t('ag_onglet_jour')], ['semaine', B.t('ag_onglet_semaine')], ['charges', B.t('ag_onglet_charges')]], UI.agOnglet);
  h += '<div class="gros-texte">';
  if (UI.agOnglet === 'semaine') h += UI.htmlAgSemaine();
  else if (UI.agOnglet === 'charges') h += UI.htmlAgCharges();
  else h += UI.htmlAgJour();
  return h + '</div>';
};

UI.htmlAgJour = function () {
  const S = UI.S, j = B.argent.journee(S), P = B.argent.prevision(S);
  let h = '<h3>' + UI.esc(B.t(S.finJour ? 'ag_jour_fini' : 'ag_jour_en_cours', { jour: S.jour })) + '</h3>';
  h += UI.lignesComptes(j.recettes, j.depenses, j.resultat, !S.finJour);
  if (!S.finJour) {
    const inter = B.equipe.interimaires(S).reduce(function (s, p) { return s + B.argent.salaireJour(p); }, 0);
    h += '<p class="sous">' + UI.esc(B.t('ag_ce_soir', { total: B.euros(P.total + inter) })) + (B.argent.niveau(S).tva ? ' ' + UI.esc(B.t('ag_ce_soir_tva')) : '') + '</p>';
  }
  h += '<h3>' + UI.esc(B.t('ag_cout_journee')) + '</h3>';
  [['salaires', P.salaires], ['cotisations', P.cotisations], ['loyer', P.loyer], ['charges', P.charges], ['pret', P.pret]].forEach(function (x) {
    if (x[1] > 0.004 || x[0] === 'loyer' || x[0] === 'salaires') h += UI.ligneAg(B.t('ag_poste_' + x[0]) + (x[0] === 'loyer' && !P.loyer ? ' · ' + B.t('ag_proprietaire') : ''), x[1], 'moins', true);
  });
  h += UI.ligneAg(B.t('ag_total_jour'), P.total, 'total', true);
  const H = (S.historique || []).slice(-7).reverse();
  if (H.length) {
    h += '<h3>' + UI.esc(B.t('ag_derniers_jours')) + '</h3><table class="planning comptes"><tr><th>' + UI.esc(B.t('ag_col_jour')) + '</th><th>' + UI.esc(B.t('ag_col_recettes')) + '</th><th>' + UI.esc(B.t('ag_col_depenses')) + '</th><th>' + UI.esc(B.t('ag_col_benefice')) + '</th></tr>';
    H.forEach(function (x) {
      const dep = Object.keys(x.depenses).reduce(function (s, k) { return s + x.depenses[k]; }, 0);
      h += '<tr><th>' + UI.esc(B.t('ag_jour_n', { n: x.jour })) + '</th><td>' + UI.esc(B.euros(x.recettes)) + '</td><td>' + UI.esc(B.euros(dep)) + '</td><td class="' + (x.resultat < 0 ? 'rouge-txt' : 'vert-txt') + '">' + UI.esc(B.euros(x.resultat)) + '</td></tr>';
    });
    h += '</table>';
  }
  return h;
};

UI.htmlSemaine = function (w, enCours) {
  let h = '<h3>' + UI.esc(B.t(enCours ? 'ag_semaine_en_cours' : 'ag_semaine_titre', { n: w.numero, a: w.debut, b: w.fin, j: w.jours, max: B.DATA.argent.semaine.jours })) + '</h3>';
  h += '<p>' + UI.esc(B.t('ag_semaine_clients', { n: w.servis, r: w.repartis })) + '</p>';
  h += UI.lignesComptes(w.recettes, w.depenses, w.resultat, enCours);
  if (!enCours && w.avant != null) h += '<p class="sous">' + UI.esc(B.t('ag_semaine_avant', { total: B.euros(w.avant) })) + '</p>';
  return h;
};
UI.htmlAgSemaine = function () {
  const S = UI.S;
  let h = '';
  if (S.semaine && S.semaine.jours) h += UI.htmlSemaine(S.semaine, true);
  else h += '<p class="sous">' + UI.esc(B.t('ag_semaine_vide', { jour: S.semaine ? S.semaine.debut : S.jour })) + '</p>';
  (S.semaines || []).forEach(function (w) { h += UI.htmlSemaine(w, false); });
  return h;
};

UI.htmlAgCharges = function () {
  const S = UI.S, N = B.argent.niveau(S), A = B.DATA.argent;
  let h = '<h3>' + UI.esc(B.t('ag_par_mois')) + '</h3>';
  const loyer = B.argent.loyerMois(S);
  h += UI.ligneAg(loyer ? B.t('ag_loyer_mois', { m2: A.loyer.surface }) : B.t('ag_poste_loyer') + ' · ' + B.t('ag_proprietaire'), loyer, 'moins', true);
  B.argent.chargesMois(S).forEach(function (c) { h += UI.ligneAg(B.t('ag_charge_' + c.id), c.mois, 'moins', true); });
  const sal = B.equipe.coutMensuel(S);
  h += UI.ligneAg(B.t('ag_salaires_mois'), sal, 'moins', true);
  if (N.cotisations) h += UI.ligneAg(B.t('ag_cotisations_mois', { taux: Math.round(N.cotisations * 100) }), sal * N.cotisations, 'moins', true);
  if (S.pret && S.pret.restant > 0) h += UI.ligneAg(B.t('ag_poste_pret'), S.pret.mensualite, 'moins', true);
  h += '<p class="sous">' + UI.esc(B.t('ag_paye_chaque_soir')) + '</p>';
  if (N.tva) h += '<p>' + UI.esc(B.t('ag_tva_regle', { taux: Math.round(N.tva * 100) })) + '</p>';
  else h += '<p>' + UI.esc(B.t('ag_sans_tva')) + '</p>';
  if (S.pret) {
    h += '<h3>' + UI.esc(B.t('ag_pret_titre')) + '</h3>';
    h += UI.ligneAg(B.t('ag_pret_montant'), S.pret.montant) + UI.ligneAg(B.t('ag_pret_restant'), S.pret.restant) + UI.ligneAg(B.t('ag_pret_interets'), S.pret.interets);
    h += '<p class="sous">' + UI.esc(B.t('ag_pret_regle', { taux: String(Math.round(S.pret.taux * 1000) / 10).replace('.', ','), mois: S.pret.mois, mensualite: B.euros(S.pret.mensualite) })) + '</p>';
  }
  h += '<h3>' + UI.esc(B.t('ag_regles_titre')) + '</h3>';
  h += '<p>' + UI.esc(B.t('ag_regle_indemnite', { essai: A.indemnites.essaiJours, jours: A.indemnites.joursDeSalaire })) + '</p>';
  h += '<p>' + UI.esc(B.t('ag_regle_faillite', { soirs: A.faillite.soirsDeSuite, decouvert: B.euros(A.decouvertAutorise) })) + '</p>';
  return h;
};

UI.rafraichirArgent = function (enHaut) {
  if (UI.voletOuvert !== 'argent') return;
  UI.$('volet-titre').textContent = B.t('ag_titre');
  const c = UI.$('volet-corps'), y = c.scrollTop;
  c.innerHTML = UI.htmlArgent();
  c.scrollTop = enHaut ? 0 : y;
};

/* ---------- Fin de journée : l'argent du jour, l'alerte de découvert, le bilan de la semaine ---------- */

UI.htmlFinSemaine = function (b) {

/* ---------- Faillite : un message clair, la partie est gardée ---------- */
UI.htmlFaillite = function (S) {

  h += '<p class="gros-texte">' + UI.esc(B.t('faillite_pourquoi', { soirs: f.soirs, argent: B.euros(f.argent), jour: f.jour })) + '</p>';
  h += '<p class="gros-texte">' + UI.esc(B.t(f.resultat < 0 ? 'faillite_semaine_perte' : 'faillite_semaine', { jours: f.jours, recettes: B.euros(f.recettes), resultat: B.euros(Math.abs(f.resultat)) })) + '</p>';

UI.montrerFaillite = function () {

};

UI.initArgent = function () {

};

/* ==== src/interface/calendrier.js ==== */
/* calendrier.js (écran) — étape 6 (v0.8) : le bouton météo et date (en haut à droite), le volet Calendrier
   (aujourd'hui, 7 jours, le mois, fêtes et événements), la fenêtre des événements du jour et les tables réservées. */
UI.calOnglet = 'jour';    /* jour | semaine | mois | evenements */
UI.calMois = 0;           /* décalage en mois pour l'onglet Mois */
UI.calPrive = null;       /* événement privé ouvert */

UI.pct = function (f) { const p = Math.round((f - 1) * 100); return (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(p) + ' %'; };
UI.texteMeteo = function (m) { return m.emoji + ' ' + m.temp + '° · ' + B.t('ciel_' + m.ciel); };
UI.dateCourte = function (S, dec) { const d = B.dateDuJour(S, dec), T = B.DATA.textes; return T.jours_court[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + T.mois_court[d.getUTCMonth()]; };
/* Ce qu'il y a de spécial un jour : férié, fête, événement privé, vacances (le plus important d'abord) */
UI.marquesDuJour = function (S, i) {
  const out = [];
  (S.cal ? S.cal.prives : []).forEach(function (e) { if (e.etat === 'reserve' && e.jour === i.jour) out.push({ cls: 'prive', txt: B.ev.typePrive(S, e.type).emoji + ' ' + B.heure(e.debut) + ' ' + B.ev.typePrive(S, e.type).nom }); });
  if (i.ferie) out.push({ cls: 'ferie', txt: '🔴 ' + i.ferie.nom });
  else if (i.fete) out.push({ cls: 'fete', txt: i.fete.emoji + ' ' + i.fete.nom });
  for (const id in (S.cal ? S.cal.fetes : {})) { const f = S.cal.fetes[id]; if (f.etat === 'oui' && i.jour >= f.debut && i.jour <= f.fin) { const m = B.ev.infoMenu(S, f.k); out.push({ cls: 'menu', txt: m.emoji + ' ' + m.nom }); } }
  if (i.vacances) out.push({ cls: 'vac', txt: i.vacances.emoji + ' ' + B.t('cal_vacances_court', { nom: i.vacances.nom }) });
  return out;
};
UI.aDecider = function (S) { return S && S.cal ? B.ev.fetesEnAttente(S).length + B.ev.ouverts(S).length : 0; };

/* ---------- Le bouton (en haut du panneau de droite) ---------- */
UI.majCalendrier = function () {
  const S = UI.S, b = UI.$('btn-calendrier');
  if (!S || !S.cal) return;
  const i = B.cal.infos(S, 0), mq = UI.marquesDuJour(S, i), n = UI.aDecider(S);
  const tag = mq.length ? mq[0] : { cls: 'saison', txt: B.t('saison_' + i.saison) };
  const html = '<span class="cal-l1">' + UI.esc(i.meteo.emoji + ' ' + i.meteo.temp + '°') + '<small>' + UI.esc(B.t('ciel_' + i.meteo.ciel)) + '</small></span>' +
    '<span class="cal-l2">' + UI.esc(UI.dateCourte(S, 0)).replace(/^(\S+) /, '<span class="jsem">$1 </span>') + '</span>' +
    '<span class="cal-l3 ' + tag.cls + '">' + UI.esc(tag.txt) + '</span>' + (n ? '<i class="pastille">' + n + '</i>' : '');
  if (b._html !== html) { b.innerHTML = html; b._html = html; b.setAttribute('aria-label', B.t('cal_titre')); }
};

/* ---------- Le volet ---------- */
UI.htmlCalendrier = function () {
  const S = UI.S;
  if (UI.calPrive != null && B.ev.prive(S, UI.calPrive)) return UI.htmlPrive(B.ev.prive(S, UI.calPrive));
  const n = UI.aDecider(S);
  let h = UI.onglets('data-cal-onglet', [['jour', B.t('cal_onglet_jour')], ['semaine', B.t('cal_onglet_semaine')], ['mois', B.t('cal_onglet_mois')], ['evenements', B.t('cal_onglet_evenements') + (n ? ' (' + n + ')' : '')]], UI.calOnglet);
  h += '<div class="gros-texte">';
  if (UI.calOnglet === 'semaine') h += UI.htmlCalSemaine();
  else if (UI.calOnglet === 'mois') h += UI.htmlCalMois();
  else if (UI.calOnglet === 'evenements') h += UI.htmlCalEvenements();
  else h += UI.htmlCalJour();

  h += UI.ligneCal(B.t('cal_effet_reputation', { note: UI.noteTexte(B.rep.note(S)) }), B.rep.facteurAffluence(S));   /* v1.0 */
  (S.cal.effets || []).forEach(function (x) { if (x.jusqua >= S.jour) h += UI.ligneCal(B.t('cal_effet_' + x.k, { heure: B.heure(x.de || 0), jusqua: B.ev.texteJour(S, x.jusqua) }), x.m); });

  if (gr) h += '<p class="alerte-ag">' + UI.esc(B.t('cal_greve', { four: B.stock.nomFournisseur(S, gr.four), jusqua: B.ev.texteJour(S, gr.jusqua) })) + '</p>';
  (S.cal.flambees || []).forEach(function (f) { if (f.jusqua >= S.jour) h += '<p class="alerte-ag">' + UI.esc(B.t('cal_flambee', { produit: B.stock.ing(f.ing).nom, jusqua: B.ev.texteJour(S, f.jusqua) })) + '</p>'; });
  h += '<p class="sous">' + UI.esc(B.t('cal_effet_note')) + '</p>';

  h += '<h3>' + UI.esc(B.t('cal_clientele_titre')) + '</h3>';
  h += '<p>' + UI.esc(B.t('cal_touristes', { pct: Math.round(B.cal.partTouristes(S, n) * 100) })) + (B.cal.facteurFamilles(S, n, 700) > 1.001 ? ' ' + UI.esc(B.t('cal_familles')) : '') + '</p>';
  h += '<h3>' + UI.esc(B.t('cal_lieu_titre', { lieu: l.nom })) + '</h3>';
  h += '<p>' + UI.esc(B.t('cal_lieu_infos', { meteo: l.meteo, tourisme: l.tourisme, calendrier: l.calendrier })) + '</p>';
  const mq = UI.marquesDuJour(S, i);
  if (mq.length) h += '<p>' + mq.map(function (m) { return '<span class="marque ' + m.cls + '">' + UI.esc(m.txt) + '</span>'; }).join(' ') + '</p>';
  return h;
};
UI.ligneCal = function (lib, f) { return '<div class="ligne-ag"><span>' + UI.esc(lib) + '</span><b class="' + (f > 1.004 ? 'vert-txt' : f < 0.996 ? 'rouge-txt' : '') + '">' + UI.esc(Math.abs(f - 1) < 0.004 ? '=' : UI.pct(f)) + '</b></div>'; };

UI.htmlCalSemaine = function () {
  const S = UI.S;
  let h = '<p class="sous">' + UI.esc(B.t('cal_semaine_intro')) + '</p><table class="planning cal-7"><tr><th>' + UI.esc(B.t('cal_col_jour')) + '</th><th>' + UI.esc(B.t('cal_col_meteo')) + '</th><th>' + UI.esc(B.t('cal_col_affluence')) + '</th><th>' + UI.esc(B.t('cal_col_note')) + '</th></tr>';
  for (let d = 0; d < 7; d++) {
    const i = B.cal.infos(S, d), mq = UI.marquesDuJour(S, i);
    h += '<tr' + (d === 0 ? ' class="auj"' : '') + '><th>' + UI.esc(d === 0 ? B.t('cal_aujourdhui') : d === 1 ? B.t('cal_demain') : UI.dateCourte(S, d)) + '</th><td>' + UI.esc(i.meteo.emoji + ' ' + i.meteo.temp + '°') + '</td>' +
      '<td class="' + (i.facteur >= 1 ? 'vert-txt' : 'rouge-txt') + '">' + UI.esc(UI.pct(i.facteur)) + '</td><td class="gauche">' + mq.map(function (m) { return '<span class="marque ' + m.cls + '">' + UI.esc(m.txt) + '</span>'; }).join(' ') + '</td></tr>';
  }
  return h + '</table>';
};

UI.htmlCalMois = function () {
  const S = UI.S, T = B.DATA.textes, d0 = B.dateDuJour(S, 0);
  const premier = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + UI.calMois, 1, 12));
  const nbJours = new Date(Date.UTC(premier.getUTCFullYear(), premier.getUTCMonth() + 1, 0, 12)).getUTCDate();
  const decal0 = Math.round((premier - d0) / 864e5);
  let h = '<div class="cal-nav"><button type="button" class="petit-btn mini" data-cal-mois="-1" aria-label="' + UI.esc(B.t('cal_mois_avant')) + '">◀</button><b>' + UI.esc(T.mois_noms[premier.getUTCMonth()] + ' ' + premier.getUTCFullYear()) + '</b><button type="button" class="petit-btn mini" data-cal-mois="1" aria-label="' + UI.esc(B.t('cal_mois_apres')) + '">▶</button></div>';
  h += '<div class="cal-grille">' + [1, 2, 3, 4, 5, 6, 0].map(function (j) { return '<div class="cal-entete">' + UI.esc(T.jours_court[j]) + '</div>'; }).join('');
  const vide = (premier.getUTCDay() + 6) % 7;
  for (let k = 0; k < vide; k++) h += '<div class="cal-case vide"></div>';
  for (let j = 1; j <= nbJours; j++) {
    const dec = decal0 + j - 1, i = B.cal.infos(S, dec), mq = UI.marquesDuJour(S, i);
    const cls = 'cal-case' + (dec === 0 ? ' auj' : '') + (dec < 0 ? ' passe' : '') + (i.ferie ? ' ferie' : '') + (i.vacances ? ' vac' : '');
    h += '<div class="' + cls + '"><span class="num">' + j + (dec >= 0 && dec < 15 ? ' <small>' + UI.esc(i.meteo.emoji) + '</small>' : '') + '</span>' +
      mq.filter(function (m) { return m.cls !== 'vac'; }).slice(0, 2).map(function (m) { return '<span class="ev ' + m.cls + '">' + UI.esc(m.txt) + '</span>'; }).join('') + '</div>';
  }
  h += '</div><p class="sous">' + UI.esc(B.t('cal_legende')) + '</p>';
  return h;
};

UI.htmlCalEvenements = function () {
  const S = UI.S, C = S.cal, P = B.DATA.calendrier.evenementsPrives;
  let h = '';
  const F = B.ev.fetesEnAttente(S);
  h += '<h3>' + UI.esc(B.t('cal_fetes_titre')) + '</h3>';
  if (!F.length) h += '<p class="sous">' + UI.esc(B.t('cal_fetes_aucune')) + '</p>';
  F.forEach(function (f) {
    const m = B.ev.infoMenu(S, f.k), plats = B.ev.platsDeFete(S).filter(function (d) { return d.fete === f.k; });
    h += '<div class="carte-ev"><b>' + UI.esc(m.emoji + ' ' + m.nom + (f.vac ? ' · ' + f.vac : '')) + '</b><span>' + UI.esc(B.t('cal_fete_dates', { de: B.ev.texteJour(S, f.debut), a: B.ev.texteJour(S, f.fin) })) + '</span>';
    h += '<span class="sous">' + UI.esc(B.t('cal_fete_chef')) + '</span><ul>' + plats.map(function (d) { return '<li>' + UI.esc(d.emoji + ' ' + d.nom + ' · ' + B.prix(B.carte.prixConseille(S, d))) + '</li>'; }).join('') + '</ul>';
    h += '<div class="rang"><button type="button" class="gros principal" data-cal-fete="' + f.id + '" data-oui="1">' + UI.esc(B.t('cal_fete_oui')) + '</button><button type="button" class="gros" data-cal-fete="' + f.id + '" data-oui="0">' + UI.esc(B.t('cal_fete_non')) + '</button></div></div>';
  });
  const enCours = Object.keys(C.fetes).map(function (id) { return C.fetes[id]; }).filter(function (f) { return f.etat === 'oui' && f.fin >= S.jour; });
  enCours.forEach(function (f) { const m = B.ev.infoMenu(S, f.k); h += '<p>' + UI.esc(B.t(S.jour >= f.debut ? 'cal_fete_en_cours' : 'cal_fete_prevue', { nom: m.emoji + ' ' + m.nom, de: B.ev.texteJour(S, f.debut), a: B.ev.texteJour(S, f.fin) })) + '</p>'; });
  h += '<h3>' + UI.esc(B.t('cal_prives_titre')) + '</h3>';
  const ouverts = B.ev.ouverts(S), resa = C.prives.filter(function (e) { return e.etat === 'reserve'; }).sort(function (a, b) { return a.jour - b.jour; });
  if (!ouverts.length && !resa.length) h += '<p class="sous">' + UI.esc(B.t('cal_prives_aucun', { jour: P.aPartirDuJour })) + '</p>';
  ouverts.concat(resa).forEach(function (e) {
    const T = B.ev.typePrive(S, e.type);
    h += '<button type="button" class="ligne-prive' + (e.etat === 'reserve' ? '' : ' a-faire') + '" data-cal-prive="' + e.id + '"><b>' + UI.esc(T.emoji + ' ' + T.nom + ' · ' + e.nom) + '</b><span>' +
      UI.esc(B.t('cal_prive_resume', { n: e.n, date: B.ev.texteJour(S, e.jour), heure: B.heure(e.debut) })) + '</span><span class="etat">' + UI.esc(B.t('cal_prive_etat_' + e.etat, { date: B.ev.texteJour(S, e.expire) })) + '</span></button>';
  });
  const passes = C.prives.filter(function (e) { return e.etat === 'fini' || e.etat === 'perdu'; }).slice(-4).reverse();
  if (passes.length) h += '<p class="sous">' + passes.map(function (e) { return UI.esc(B.ev.typePrive(S, e.type).emoji + ' ' + e.nom + ' : ' + B.t('cal_prive_etat_' + e.etat) + (e.etat === 'fini' ? ' (' + B.euros(e.n * e.prix) + ')' : '')); }).join('<br>') + '</p>';
  h += '<p class="sous">' + UI.esc(B.t('cal_prives_regle', { acompte: Math.round(P.acompte * 100) })) + '</p>';
  return h;

UI.htmlPrive = function (e) {
  const S = UI.S, T = B.ev.typePrive(S, e.type), cpp = B.ev.coutParPersonne(S, e);

  h += '<p>' + UI.esc(B.t('cal_prive_detail', { n: e.n, date: B.ev.texteJour(S, e.jour), service: B.t('cal_service_' + e.service), de: B.heure(e.debut), a: B.heure(e.fin) })) + '</p>';
  h += '<p class="sous">' + UI.esc(B.t('cal_prive_etat_' + e.etat, { date: B.ev.texteJour(S, e.expire) })) + '</p>';
  h += '<h3>' + UI.esc(B.t('cal_prive_menu')) + '</h3><ul class="menu-prive">' + e.plats.map(function (id) { const d = B.carte.plat(S, id); return d ? '<li>' + UI.esc(d.emoji + ' ' + d.nom) + '</li>' : ''; }).join('') + '</ul>';
